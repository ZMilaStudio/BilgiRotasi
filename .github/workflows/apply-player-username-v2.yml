name: Oyuncu kullanıcı adı sistemi V2

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, 'Oyuncu adı düzeltmesi')
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Flutter kur
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.7"
          channel: stable
          cache: true

      - name: Bağımlılıkları kur
        run: flutter pub get

      - name: Git kimliğini ayarla
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout main

      - name: Kullanıcı adı sistemini uygula
        shell: bash
        env:
          PLAYER_USERNAME_DART_B64: ""
          PLAYER_USERNAME_TEST_B64: ""
          APPLY_USERNAME_PY_B64: ""
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          files = {
              "lib/player_username.dart":
                  "PLAYER_USERNAME_DART_B64",
              "test/player_username_test.dart":
                  "PLAYER_USERNAME_TEST_B64",
              "/tmp/apply_username_system.py":
                  "APPLY_USERNAME_PY_B64",
          }

          for path_text, env_name in files.items():
              path = Path(path_text)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(
                  base64.b64decode(os.environ[env_name])
              )
          PY

          python3 /tmp/apply_username_system.py

      - name: Biçimlendir, analiz et ve test et
        shell: bash
        run: |
          set -euo pipefail

          dart format \
            lib/main.dart \
            lib/account_cloud.dart \
            lib/player_username.dart \
            lib/live_duel_leaderboard.dart \
            lib/live_duel_matchmaking.dart \
            lib/app_build_info.dart \
            test/account_deletion_policy_test.dart \
            test/player_username_test.dart

          flutter analyze \
            --no-fatal-warnings \
            --no-fatal-infos

          flutter test \
            --concurrency=1 \
            --reporter expanded

          python3 tools/rc1_quality_gate.py
          git diff --check

      - name: Değişiklikleri kaydet
        shell: bash
        run: |
          set -euo pipefail

          git add \
            lib/main.dart \
            lib/account_cloud.dart \
            lib/player_username.dart \
            lib/live_duel_leaderboard.dart \
            lib/live_duel_matchmaking.dart \
            lib/app_build_info.dart \
            test/account_deletion_policy_test.dart \
            test/player_username_test.dart \
            firestore.rules \
            pubspec.yaml \
            tools/rc1_quality_gate.py \
            BILGI_ROTASI_DURUM.md

          git commit -m "Oyuncu kullanici adi sistemini ekle"
          git push origin main
