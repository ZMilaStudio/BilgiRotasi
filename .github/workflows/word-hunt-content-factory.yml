name: Kelime Avı Content Factory

on:
  pull_request:
    paths:
      - 'tools/word_hunt_batch_generator.py'
      - 'tools/word_hunt_content_factory.sample.json'
      - 'tools/word_hunt_wave10a_baslangic_segment2.json'
      - 'tools/word_hunt_segment1_source_lock.json'
      - 'tools/tests/test_word_hunt_content_compiler.py'
      - 'tools/word_hunt_release_stock_manifest.py'
      - 'tools/word_hunt_release_stock_check.py'
      - '.github/workflows/word-hunt-content-factory.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  content-factory:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Kaynağı indir
        uses: actions/checkout@v4

      - name: Python 3.12 kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Canonical ve legacy tooling syntax doğrula
        run: |
          python3 -m py_compile tools/word_hunt_batch_generator.py
          python3 -m py_compile tools/tests/test_word_hunt_content_compiler.py
          python3 -m py_compile tools/word_hunt_release_stock_manifest.py
          python3 -m py_compile tools/word_hunt_release_stock_check.py

      - name: KA-02 Segment1 source lock doğrula
        run: >-
          python3 tools/word_hunt_batch_generator.py
          --verify-source-lock-only
          --source-lock tools/word_hunt_segment1_source_lock.json

      - name: KA-02 Python contract tests
        run: python3 -m unittest tools.tests.test_word_hunt_content_compiler -v

      - name: NON-PRODUCTION sample iki kez derle
        run: |
          python3 tools/word_hunt_batch_generator.py             --input tools/word_hunt_content_factory.sample.json             --source-lock tools/word_hunt_segment1_source_lock.json             --output /tmp/ka02-a.json             --report /tmp/ka02-a.txt
          python3 tools/word_hunt_batch_generator.py             --input tools/word_hunt_content_factory.sample.json             --source-lock tools/word_hunt_segment1_source_lock.json             --output /tmp/ka02-b.json             --report /tmp/ka02-b.txt
          cmp /tmp/ka02-a.json /tmp/ka02-b.json
          cmp /tmp/ka02-a.txt /tmp/ka02-b.txt
          grep -Fq 'Status: COMPILE PASS' /tmp/ka02-a.txt
          grep -Fq 'Candidate state: CANDIDATE READY FOR REVIEW' /tmp/ka02-a.txt

      - name: Locked output validation mode
        run: >-
          python3 tools/word_hunt_batch_generator.py
          --validate /tmp/ka02-a.json
          --source-lock tools/word_hunt_segment1_source_lock.json
          --report /tmp/ka02-validation.txt


      - name: Wave10A Başlangıç Segment2 iki kez derle
        run: |
          python3 tools/word_hunt_batch_generator.py \
            --input tools/word_hunt_wave10a_baslangic_segment2.json \
            --source-lock tools/word_hunt_segment1_source_lock.json \
            --output /tmp/wave10a-baslangic-a.json \
            --report /tmp/wave10a-baslangic-a.txt
          python3 tools/word_hunt_batch_generator.py \
            --input tools/word_hunt_wave10a_baslangic_segment2.json \
            --source-lock tools/word_hunt_segment1_source_lock.json \
            --output /tmp/wave10a-baslangic-b.json \
            --report /tmp/wave10a-baslangic-b.txt
          cmp /tmp/wave10a-baslangic-a.json /tmp/wave10a-baslangic-b.json
          cmp /tmp/wave10a-baslangic-a.txt /tmp/wave10a-baslangic-b.txt
          grep -Fq 'Status: COMPILE PASS' /tmp/wave10a-baslangic-a.txt
          grep -Fq 'Candidate state: CANDIDATE READY FOR REVIEW' /tmp/wave10a-baslangic-a.txt

      - name: Wave10A locked output validation
        run: >-
          python3 tools/word_hunt_batch_generator.py
          --validate /tmp/wave10a-baslangic-a.json
          --source-lock tools/word_hunt_segment1_source_lock.json
          --report /tmp/wave10a-baslangic-validation.txt

      - name: Wave10A candidate artifact yükle
        uses: actions/upload-artifact@v4
        with:
          name: word-hunt-wave10a-baslangic-segment2-candidate
          path: |
            /tmp/wave10a-baslangic-a.json
            /tmp/wave10a-baslangic-a.txt
            /tmp/wave10a-baslangic-validation.txt
          if-no-files-found: error
          retention-days: 14
