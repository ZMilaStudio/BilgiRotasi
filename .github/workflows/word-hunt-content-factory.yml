name: Kelime Avı Content Factory

on:
  pull_request:
    paths:
      - 'lib/word_hunt/word_hunt_models.dart'
      - 'lib/word_hunt/word_hunt_route_catalog.dart'
      - 'lib/word_hunt/word_hunt_starter_content.dart'
      - 'lib/word_hunt/word_hunt_gokyuzu_content.dart'
      - 'lib/word_hunt/word_hunt_orman_content.dart'
      - 'lib/word_hunt/word_hunt_orman2_content.dart'
      - 'lib/word_hunt/word_hunt_kristal_content.dart'
      - 'lib/word_hunt/word_hunt_kayip_sehir_content.dart'
      - 'lib/word_hunt/word_hunt_yeralti_kralligi_content.dart'
      - 'lib/word_hunt/word_hunt_gunes_imparatorlugu_content.dart'
      - 'tools/word_hunt_corpus_support.dart'
      - 'tools/word_hunt_production_corpus_lock_test.dart'
      - 'tools/word_hunt_production_corpus.lock.json'
      - 'tools/word_hunt_batch_generator.py'
      - 'tools/word_hunt_corpus_qa.py'
      - 'tools/tests/test_word_hunt_corpus_qa.py'
      - 'tools/word_hunt_content_factory.sample.json'
      - 'tools/word_hunt_candidate_batch.json'
      - 'tools/word_hunt_segment1_source_lock.json'
      - 'tools/word_hunt_wave10a_baslangic_segment2.lock.json'
      - 'tools/tests/test_word_hunt_content_compiler.py'
      - 'tools/word_hunt_release_stock_manifest.py'
      - 'tools/word_hunt_release_stock_check.py'
      - '.github/workflows/word-hunt-content-factory.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  content-factory:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Kaynağı indir
        uses: actions/checkout@v4

      - name: Flutter 3.44.6 kur
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Python 3.12 kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Flutter bağımlılıklarını kur
        run: flutter pub get

      - name: Corpus Dart format gate
        run: |
          dart format \
            tools/word_hunt_corpus_support.dart \
            tools/word_hunt_production_corpus_lock_test.dart
          if ! git diff --quiet -- \
            tools/word_hunt_corpus_support.dart \
            tools/word_hunt_production_corpus_lock_test.dart; then
            echo "::error::Dart formatter changed checked-in corpus tooling source."
            git --no-pager diff -- \
              tools/word_hunt_corpus_support.dart \
              tools/word_hunt_production_corpus_lock_test.dart
            exit 1
          fi

      - name: Production Dart corpus lock parity
        run: >-
          flutter test
          tools/word_hunt_production_corpus_lock_test.dart
          --reporter expanded

      - name: Canonical ve legacy tooling syntax doğrula
        run: |
          python3 -m py_compile tools/word_hunt_batch_generator.py
          python3 -m py_compile tools/tests/test_word_hunt_content_compiler.py
          python3 -m py_compile tools/word_hunt_corpus_qa.py
          python3 -m py_compile tools/tests/test_word_hunt_corpus_qa.py
          python3 -m py_compile tools/word_hunt_release_stock_manifest.py
          python3 -m py_compile tools/word_hunt_release_stock_check.py

      - name: Historical Segment1 source lock doğrula
        run: >-
          python3 tools/word_hunt_batch_generator.py
          --verify-source-lock-only
          --source-lock tools/word_hunt_segment1_source_lock.json

      - name: Current production corpus lock doğrula
        run: >-
          python3 tools/word_hunt_batch_generator.py
          --verify-production-corpus-lock-only
          --production-corpus-lock tools/word_hunt_production_corpus.lock.json

      - name: KA-02 Python contract tests
        run: python3 -m unittest tools.tests.test_word_hunt_content_compiler -v

      - name: Checkpoint C corpus QA Python tests
        run: python3 -m unittest tools.tests.test_word_hunt_corpus_qa -v

      - name: KA-02 v2 sample iki kez derle
        run: |
          python3 tools/word_hunt_batch_generator.py             --input tools/word_hunt_content_factory.sample.json             --production-corpus-lock tools/word_hunt_production_corpus.lock.json             --output /tmp/ka02-v2-a.json             --report /tmp/ka02-v2-a.txt
          python3 tools/word_hunt_batch_generator.py             --input tools/word_hunt_content_factory.sample.json             --production-corpus-lock tools/word_hunt_production_corpus.lock.json             --output /tmp/ka02-v2-b.json             --report /tmp/ka02-v2-b.txt
          cmp /tmp/ka02-v2-a.json /tmp/ka02-v2-b.json
          cmp /tmp/ka02-v2-a.txt /tmp/ka02-v2-b.txt
          grep -Fq 'Compiler version: ka02-v2' /tmp/ka02-v2-a.txt
          grep -Fq 'Status: COMPILE PASS' /tmp/ka02-v2-a.txt
          grep -Fq 'Contiguous current-frontier append: PASS' /tmp/ka02-v2-a.txt

      - name: KA-02 v2 locked output validation
        run: >-
          python3 tools/word_hunt_batch_generator.py
          --validate /tmp/ka02-v2-a.json
          --production-corpus-lock tools/word_hunt_production_corpus.lock.json
          --report /tmp/ka02-v2-validation.txt

      - name: Checkpoint C deterministic corpus QA evidence
        run: |
          python3 tools/word_hunt_corpus_qa.py \
            --production-corpus-lock tools/word_hunt_production_corpus.lock.json \
            --json-report /tmp/word-hunt-corpus-qa-production-a.json \
            --markdown-report /tmp/word-hunt-corpus-qa-production-a.md
          python3 tools/word_hunt_corpus_qa.py \
            --production-corpus-lock tools/word_hunt_production_corpus.lock.json \
            --json-report /tmp/word-hunt-corpus-qa-production-b.json \
            --markdown-report /tmp/word-hunt-corpus-qa-production-b.md
          cmp /tmp/word-hunt-corpus-qa-production-a.json /tmp/word-hunt-corpus-qa-production-b.json
          cmp /tmp/word-hunt-corpus-qa-production-a.md /tmp/word-hunt-corpus-qa-production-b.md
          python3 tools/word_hunt_corpus_qa.py \
            --production-corpus-lock tools/word_hunt_production_corpus.lock.json \
            --candidate /tmp/ka02-v2-a.json \
            --json-report /tmp/word-hunt-corpus-qa-candidate-a.json \
            --markdown-report /tmp/word-hunt-corpus-qa-candidate-a.md
          python3 tools/word_hunt_corpus_qa.py \
            --production-corpus-lock tools/word_hunt_production_corpus.lock.json \
            --candidate /tmp/ka02-v2-a.json \
            --json-report /tmp/word-hunt-corpus-qa-candidate-b.json \
            --markdown-report /tmp/word-hunt-corpus-qa-candidate-b.md
          cmp /tmp/word-hunt-corpus-qa-candidate-a.json /tmp/word-hunt-corpus-qa-candidate-b.json
          cmp /tmp/word-hunt-corpus-qa-candidate-a.md /tmp/word-hunt-corpus-qa-candidate-b.md

      - name: Immutable Wave10A ka02-v1 evidence doğrula
        run: >-
          python3 tools/word_hunt_batch_generator.py
          --validate-legacy-v1-evidence tools/word_hunt_wave10a_baslangic_segment2.lock.json
          --source-lock tools/word_hunt_segment1_source_lock.json

      - name: KA-02 v2 sample artifact yükle
        uses: actions/upload-artifact@v4
        with:
          name: word-hunt-ka02-v2-sample
          path: |
            /tmp/ka02-v2-a.json
            /tmp/ka02-v2-a.txt
            /tmp/ka02-v2-validation.txt
          if-no-files-found: error
          retention-days: 14

      - name: Checkpoint C candidate review evidence yükle
        uses: actions/upload-artifact@v4
        with:
          name: word-hunt-ka02-v2-corpus-qa-review
          path: |
            /tmp/word-hunt-corpus-qa-candidate-a.json
            /tmp/word-hunt-corpus-qa-candidate-a.md
          if-no-files-found: error
          retention-days: 14


      - name: Wave10B Başlangıç L21-30 candidate iki kez derle
        run: |
          python3 tools/word_hunt_batch_generator.py \
            --input tools/word_hunt_candidate_batch.json \
            --production-corpus-lock tools/word_hunt_production_corpus.lock.json \
            --output /tmp/wave10b-a.json \
            --report /tmp/wave10b-a.txt
          python3 tools/word_hunt_batch_generator.py \
            --input tools/word_hunt_candidate_batch.json \
            --production-corpus-lock tools/word_hunt_production_corpus.lock.json \
            --output /tmp/wave10b-b.json \
            --report /tmp/wave10b-b.txt
          cmp /tmp/wave10b-a.json /tmp/wave10b-b.json
          cmp /tmp/wave10b-a.txt /tmp/wave10b-b.txt
          grep -Fq 'Compiler version: ka02-v2' /tmp/wave10b-a.txt
          grep -Fq 'Status: COMPILE PASS' /tmp/wave10b-a.txt
          grep -Fq 'Candidate levels: 10' /tmp/wave10b-a.txt
          grep -Fq 'Contiguous current-frontier append: PASS' /tmp/wave10b-a.txt

      - name: Wave10B candidate locked validation
        run: |
          python3 tools/word_hunt_batch_generator.py \
            --validate /tmp/wave10b-a.json \
            --production-corpus-lock tools/word_hunt_production_corpus.lock.json \
            --report /tmp/wave10b-validation.txt
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(
              Path("tools/word_hunt_candidate_batch.json").read_text(encoding="utf-8")
          )
          artifact = json.loads(Path("/tmp/wave10b-a.json").read_text(encoding="utf-8"))
          expected = [
              (route["routeId"], level["id"], level["index"])
              for route in manifest["routes"]
              for level in route["levels"]
          ]
          actual = [
              (route["routeId"], level["id"], level["index"])
              for route in artifact["routes"]
              for level in route["levels"]
          ]
          assert actual == expected
          assert len(actual) == 10
          assert [index for _, _, index in actual] == list(range(21, 31))
          assert all(level["type"] != "routeFinal" for route in artifact["routes"] for level in route["levels"])
          assert artifact["productionCorpusLock"]["sourceDigest"] == "6dbabc0b5c3f35cdbf573b2dec49e0f0d346fc0146bb52aff6318ed43b7fd9e3"
          PY

      - name: Wave10B candidate corpus QA determinism ve hard-risk gate
        run: |
          python3 tools/word_hunt_corpus_qa.py \
            --production-corpus-lock tools/word_hunt_production_corpus.lock.json \
            --candidate /tmp/wave10b-a.json \
            --json-report /tmp/wave10b-qa-a.json \
            --markdown-report /tmp/wave10b-qa-a.md \
            --fail-on-hard-risk
          python3 tools/word_hunt_corpus_qa.py \
            --production-corpus-lock tools/word_hunt_production_corpus.lock.json \
            --candidate /tmp/wave10b-a.json \
            --json-report /tmp/wave10b-qa-b.json \
            --markdown-report /tmp/wave10b-qa-b.md \
            --fail-on-hard-risk
          cmp /tmp/wave10b-qa-a.json /tmp/wave10b-qa-b.json
          cmp /tmp/wave10b-qa-a.md /tmp/wave10b-qa-b.md
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("/tmp/wave10b-qa-a.json").read_text(encoding="utf-8"))
          assert report["productionLevelCount"] == 90
          assert report["candidateLevelCount"] == 10
          assert report["levelCount"] == 100
          assert report["summary"]["hardRiskCount"] == 0
          assert report["candidateDigest"]
          PY

      - name: Wave10B candidate owner-review evidence yükle
        uses: actions/upload-artifact@v4
        with:
          name: word-hunt-wave10b-baslangic-l21-30-candidate-review
          path: |
            /tmp/wave10b-a.json
            /tmp/wave10b-a.txt
            /tmp/wave10b-validation.txt
            /tmp/wave10b-qa-a.json
            /tmp/wave10b-qa-a.md
          if-no-files-found: error
          retention-days: 14
