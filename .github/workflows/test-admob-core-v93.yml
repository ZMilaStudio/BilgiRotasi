name: AdMob çekirdek açılış testi 1.68.3+93

"on":
  push:
    branches:
      - main
    paths:
      - ".github/workflows/test-admob-core-v93.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-core-test:
    name: Standart AdMob çekirdeğini ekle, test et ve paketle
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    timeout-minutes: 40

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Flutter kur
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.7"
          channel: stable
          cache: true

      - name: Sağlam 1.68.2+92 tabanını doğrula
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "version: 1.68.2+92" pubspec.yaml
          ! grep -Fq "google_mobile_ads" pubspec.yaml
          ! grep -Fq "com.google.android.gms.ads.APPLICATION_ID" \
            android/app/src/main/AndroidManifest.xml
          test ! -f lib/ad_monetization.dart
          grep -Fq "static const String versionName = '1.68.2';" \
            lib/app_build_info.dart
          grep -Fq "static const int buildNumber = 92;" \
            lib/app_build_info.dart

      - name: Yalnızca standart AdMob çekirdeğini ekle
        shell: bash
        env:
          STARTUP_ANCHOR_B64: "ICBydW5BcHAoY29uc3QgQmlsZ2lSb3Rhc2lBcHAoKSk7CgogIHVuYXdhaXRlZChfaW5pdGlhbGl6ZUFjY291bnRDbG91ZEluQmFja2dyb3VuZCgpKTsKfQoKRnV0dXJlPHZvaWQ+IF9pbml0aWFsaXplQWNjb3VudENsb3VkSW5CYWNrZ3JvdW5kKCkgYXN5bmMgew=="
          STARTUP_REPLACEMENT_B64: ""
          APPLICATION_ANCHOR_B64: "ICAgIDxhcHBsaWNhdGlvbgogICAgICAgIGFuZHJvaWQ6bGFiZWw9IkJpbGdpIFJvdGFzxLEiCiAgICAgICAgYW5kcm9pZDpuYW1lPSIke2FwcGxpY2F0aW9uTmFtZX0iCiAgICAgICAgYW5kcm9pZDppY29uPSJAbWlwbWFwL2xhdW5jaGVyX2ljb24iPg=="
          APPLICATION_REPLACEMENT_B64: ""
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import os

          def decode_env(name: str) -> str:
              value = os.environ.get(name, '')
              if not value:
                  raise SystemExit(f'{name} boş.')
              return base64.b64decode(value).decode('utf-8')

          def replace_once(path_str: str, old: str, new: str, label: str) -> None:
              path = Path(path_str)
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f'{label}: beklenen bölüm {count} kez bulundu.'
                  )
              path.write_text(
                  text.replace(old, new, 1),
                  encoding='utf-8',
              )

          replace_once(
              'pubspec.yaml',
              'version: 1.68.2+92',
              'version: 1.68.3+93',
              'pubspec sürümü',
          )

          pubspec_path = Path('pubspec.yaml')
          pubspec = pubspec_path.read_text(encoding='utf-8')
          dependency_anchor = '  google_sign_in: ^7.2.0\n'
          if pubspec.count(dependency_anchor) != 1:
              raise SystemExit('google_sign_in bağımlılık satırı bulunamadı.')
          pubspec = pubspec.replace(
              dependency_anchor,
              dependency_anchor + '  google_mobile_ads: 9.0.0\n',
              1,
          )
          pubspec_path.write_text(pubspec, encoding='utf-8')

          replace_once(
              'lib/app_build_info.dart',
              "static const String versionName = '1.68.2';",
              "static const String versionName = '1.68.3';",
              'uygulama sürüm adı',
          )
          replace_once(
              'lib/app_build_info.dart',
              'static const int buildNumber = 92;',
              'static const int buildNumber = 93;',
              'uygulama build numarası',
          )

          main_path = Path('lib/main.dart')
          main = main_path.read_text(encoding='utf-8')
          import_anchor = "import 'package:google_sign_in/google_sign_in.dart';\n"
          if main.count(import_anchor) != 1:
              raise SystemExit('Google Sign-In import satırı bulunamadı.')
          main = main.replace(
              import_anchor,
              import_anchor
              + "import 'package:google_mobile_ads/google_mobile_ads.dart';\n",
              1,
          )
          startup_anchor = decode_env('STARTUP_ANCHOR_B64')
          startup_replacement = decode_env('STARTUP_REPLACEMENT_B64')
          if main.count(startup_anchor) != 1:
              raise SystemExit('Uygulama açılış bölümü bulunamadı.')
          main = main.replace(startup_anchor, startup_replacement, 1)
          main_path.write_text(main, encoding='utf-8')

          manifest_path = Path(
              'android/app/src/main/AndroidManifest.xml'
          )
          manifest = manifest_path.read_text(encoding='utf-8')
          application_anchor = decode_env('APPLICATION_ANCHOR_B64')
          application_replacement = decode_env(
              'APPLICATION_REPLACEMENT_B64'
          )
          if manifest.count(application_anchor) != 1:
              raise SystemExit('Android application etiketi bulunamadı.')
          manifest = manifest.replace(
              application_anchor,
              application_replacement,
              1,
          )
          manifest_path.write_text(manifest, encoding='utf-8')

          replace_once(
              'android/app/build.gradle.kts',
              '        minSdk = flutter.minSdkVersion',
              '        minSdk = 23',
              'Android minimum SDK',
          )
          PY

      - name: Bağımlılıkları çöz ve kaynakları doğrula
        shell: bash
        run: |
          set -euo pipefail
          rm -f pubspec.lock
          flutter pub get
          mkdir -p reports dist

          flutter pub deps --style=compact \
            | tee reports/ADMOB_CORE_DEPENDENCIES.txt

          grep -Fq "google_mobile_ads 9.0.0" \
            reports/ADMOB_CORE_DEPENDENCIES.txt
          grep -Fq "version: 1.68.3+93" pubspec.yaml
          grep -Fq "minSdk = 23" android/app/build.gradle.kts
          grep -Fq "MobileAds.instance.initialize()" lib/main.dart
          grep -Fq "unawaited(_initializeMobileAdsInBackground());" \
            lib/main.dart
          grep -Fq "com.google.android.gms.ads.APPLICATION_ID" \
            android/app/src/main/AndroidManifest.xml
          grep -Fq "ca-app-pub-3940256099942544~3347511713" \
            android/app/src/main/AndroidManifest.xml
          ! grep -Fq 'tools:node="remove"' \
            android/app/src/main/AndroidManifest.xml
          test ! -f lib/ad_monetization.dart

      - name: Biçimlendir, analiz et ve tüm testleri çalıştır
        shell: bash
        run: |
          set -euo pipefail
          dart format \
            lib/main.dart \
            lib/app_build_info.dart
          flutter analyze --no-fatal-warnings --no-fatal-infos
          flutter test --concurrency=1 --reporter expanded
          git diff --check

      - name: Kalıcı Android imzasını geçici yükle
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"

          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode \
            > android/app/bilgi_rotasi_upload.jks

          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=bilgi_rotasi_upload.jks
          EOF

          chmod 600 \
            android/app/bilgi_rotasi_upload.jks \
            android/key.properties

      - name: Çekirdek test APK ve AAB üret
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --release
          flutter build appbundle --release

          cp build/app/outputs/flutter-apk/app-release.apk \
            dist/BilgiRotasi-AdMob-Cekirdek-Test-1.68.3-93.apk
          cp build/app/outputs/bundle/release/app-release.aab \
            dist/BilgiRotasi-AdMob-Cekirdek-Test-1.68.3-93.aab

      - name: Paket, manifest ve kalıcı imzayı doğrula
        shell: bash
        run: |
          set -euo pipefail

          APK="dist/BilgiRotasi-AdMob-Cekirdek-Test-1.68.3-93.apk"
          AAB="dist/BilgiRotasi-AdMob-Cekirdek-Test-1.68.3-93.aab"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          AAPT2="$(find "$SDK_ROOT/build-tools" -type f -name aapt2 | sort -V | tail -n 1)"

          test -x "$APKSIGNER"
          test -x "$AAPT2"

          CERT_OUTPUT="$("$APKSIGNER" verify --print-certs "$APK")"
          ACTUAL_SHA1="$(printf '%s\n' "$CERT_OUTPUT" | awk -F': ' '/certificate SHA-1 digest/ {print $NF; exit}' | tr '[:lower:]' '[:upper:]' | tr -d '[:space:]:')"
          EXPECTED_SHA1="000EE43F410ABC6B4F634C4F716D76EB19084115"
          test "$ACTUAL_SHA1" = "$EXPECTED_SHA1"

          jarsigner -verify "$AAB"

          "$AAPT2" dump packagename "$APK" \
            > reports/ADMOB_CORE_PACKAGE.txt
          grep -Fxq "com.leventua.bilgirotasi" \
            reports/ADMOB_CORE_PACKAGE.txt

          "$AAPT2" dump xmltree \
            --file AndroidManifest.xml \
            "$APK" \
            > reports/ADMOB_CORE_MANIFEST.txt

          grep -Fq "com.leventua.bilgirotasi.MainActivity" \
            reports/ADMOB_CORE_MANIFEST.txt
          grep -Fq "com.google.android.gms.ads.APPLICATION_ID" \
            reports/ADMOB_CORE_MANIFEST.txt
          grep -Fq "ca-app-pub-3940256099942544~3347511713" \
            reports/ADMOB_CORE_MANIFEST.txt
          grep -Fq "com.google.android.gms.ads.MobileAdsInitProvider" \
            reports/ADMOB_CORE_MANIFEST.txt

          sha256sum "$APK" \
            | tee reports/ADMOB_CORE_APK_SHA256.txt
          sha256sum "$AAB" \
            | tee reports/ADMOB_CORE_AAB_SHA256.txt

      - name: Gizli dosyaları temizle
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            android/key.properties \
            android/app/bilgi_rotasi_upload.jks
          test ! -f android/key.properties
          test ! -f android/app/bilgi_rotasi_upload.jks

      - name: Test APK, AAB ve raporları yükle
        uses: actions/upload-artifact@v7
        with:
          name: BilgiRotasi-AdMob-Cekirdek-Test-1.68.3-93
          path: |
            dist/BilgiRotasi-AdMob-Cekirdek-Test-1.68.3-93.apk
            dist/BilgiRotasi-AdMob-Cekirdek-Test-1.68.3-93.aab
            reports/ADMOB_CORE_DEPENDENCIES.txt
            reports/ADMOB_CORE_PACKAGE.txt
            reports/ADMOB_CORE_MANIFEST.txt
            reports/ADMOB_CORE_APK_SHA256.txt
            reports/ADMOB_CORE_AAB_SHA256.txt
          if-no-files-found: error
          retention-days: 30
