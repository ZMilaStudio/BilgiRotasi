name: Kalıcı Android proje altyapısı V3

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/setup-permanent-android-v3.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  setup-and-verify:
    name: Android projesini oluştur ve doğrula
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Flutter kur
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.7"
          channel: stable
          cache: true

      - name: Çalışan sürümü doğrula
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "version: 1.67.1+89" pubspec.yaml
          ! grep -Fq "google_mobile_ads" pubspec.yaml
          test -f firebase/google-services.json
          test -f assets/questions.json
          test -f lib/main.dart
          python3 - <<'PY'
          import json
          from pathlib import Path
          cfg = json.loads(
              Path("firebase/google-services.json").read_text()
          )
          pkg = (
              cfg["client"][0]["client_info"]
              ["android_client_info"]["package_name"]
          )
          if pkg != "com.leventua.bilgirotasi":
              raise SystemExit(
                  "Firebase paket adı uyuşmuyor: " + pkg
              )
          PY

      - name: Kalıcı Android projesini üret
        shell: bash
        env:
          ANDROID_INSTALLER_B64: ""
        run: |
          set -euo pipefail
          SEED="$RUNNER_TEMP/bilgi_rotasi_android_seed"
          rm -rf "$SEED" android
          flutter create             --platforms=android             --org com.leventua             --project-name bilgirotasi             "$SEED"
          cp -R "$SEED/android" android
          cp firebase/google-services.json             android/app/google-services.json
          printf '%s' "$ANDROID_INSTALLER_B64"             | base64 --decode             > /tmp/configure_permanent_android.py
          python3 /tmp/configure_permanent_android.py

      - name: Simge, splash ve kalite kontrolleri
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create
          python3 tools/rc1_quality_gate.py             --report reports/PERMANENT_ANDROID_REPORT.md
          flutter analyze --no-fatal-warnings --no-fatal-infos
          flutter test --concurrency=1 --reporter expanded
          git diff --check

      - name: Kalıcı imzayı geçici yükle
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64"             | base64 --decode             > android/app/bilgi_rotasi_upload.jks
          printf '%s\n'             "storePassword=$ANDROID_KEYSTORE_PASSWORD"             "keyPassword=$ANDROID_KEY_PASSWORD"             "keyAlias=$ANDROID_KEY_ALIAS"             "storeFile=bilgi_rotasi_upload.jks"             > android/key.properties
          chmod 600             android/app/bilgi_rotasi_upload.jks             android/key.properties

      - name: Kalıcı projeden imzalı APK üret
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --release
          SOURCE_APK="build/app/outputs/flutter-apk/app-release.apk"
          test -f "$SOURCE_APK"
          mkdir -p dist reports
          cp "$SOURCE_APK"             dist/BilgiRotasi-Kalici-Android-1.67.1-89.apk

      - name: Paket ve imzayı doğrula
        shell: bash
        run: |
          set -euo pipefail
          APK="dist/BilgiRotasi-Kalici-Android-1.67.1-89.apk"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          APKSIGNER="$(
            find "$SDK_ROOT/build-tools"               -type f               -name apksigner               | sort -V               | tail -n 1
          )"
          CERT_OUTPUT="$("$APKSIGNER" verify --print-certs "$APK")"
          printf '%s\n' "$CERT_OUTPUT"
          ACTUAL_SHA1="$(
            printf '%s\n' "$CERT_OUTPUT"               | awk -F': '                 '/certificate SHA-1 digest/ {print $NF; exit}'               | tr '[:lower:]' '[:upper:]'               | tr -d '[:space:]:'
          )"
          test "$ACTUAL_SHA1" =             "000EE43F410ABC6B4F634C4F716D76EB19084115"
          AAPT2="$(
            find "$SDK_ROOT/build-tools"               -type f               -name aapt2               | sort -V               | tail -n 1
          )"

          if [ -z "$AAPT2" ] || [ ! -x "$AAPT2" ]; then
            echo "Android aapt2 aracı bulunamadı."
            exit 1
          fi

          "$AAPT2" dump packagename "$APK"             > reports/PERMANENT_ANDROID_PACKAGE.txt

          grep -Fxq             "com.leventua.bilgirotasi"             reports/PERMANENT_ANDROID_PACKAGE.txt

          "$AAPT2" dump permissions "$APK"             > reports/PERMANENT_ANDROID_PERMISSIONS.txt

          grep -Fq             "android.permission.INTERNET"             reports/PERMANENT_ANDROID_PERMISSIONS.txt

          "$AAPT2" dump badging "$APK"             > reports/PERMANENT_ANDROID_BADGING.txt

          sha256sum "$APK"             | tee reports/PERMANENT_ANDROID_APK_SHA256.txt

      - name: APK'yı emülatörde açılış testinden geçir
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -euo pipefail
            APK="$GITHUB_WORKSPACE/dist/BilgiRotasi-Kalici-Android-1.67.1-89.apk"
            PACKAGE="com.leventua.bilgirotasi"
            adb install -r "$APK"
            adb logcat -c
            adb shell monkey               -p "$PACKAGE"               -c android.intent.category.LAUNCHER               1
            sleep 20
            PID="$(adb shell pidof "$PACKAGE" | tr -d '\r')"
            if [ -z "$PID" ]; then
              adb logcat -d
              exit 1
            fi
            adb logcat -d               > "$GITHUB_WORKSPACE/reports/PERMANENT_ANDROID_LAUNCH_LOG.txt"
            if grep -Eqi               'FATAL EXCEPTION|AndroidRuntime.*FATAL'               "$GITHUB_WORKSPACE/reports/PERMANENT_ANDROID_LAUNCH_LOG.txt"; then
              cat "$GITHUB_WORKSPACE/reports/PERMANENT_ANDROID_LAUNCH_LOG.txt"
              exit 1
            fi
            adb shell dumpsys activity activities               | grep -F "$PACKAGE"

      - name: Gizli dosyaları temizle
        shell: bash
        run: |
          set -euo pipefail
          rm -f             android/key.properties             android/app/bilgi_rotasi_upload.jks
          test ! -f android/key.properties
          test ! -f android/app/bilgi_rotasi_upload.jks
          if git ls-files             | grep -E               '(^|/)(key\.properties|.*\.(jks|keystore))$'; then
            echo "İmza sırrı Git takibine girmiş."
            exit 1
          fi
          git diff --check

      - name: Kalıcı Android projesini ana dala kaydet
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email             "41898282+github-actions[bot]@users.noreply.github.com"
          git add android
          if git diff --cached --quiet; then
            echo "Kalıcı Android projesi zaten güncel."
            exit 0
          fi
          git commit -m "Kalici Android proje altyapisini ekle V3"
          git push origin main

      - name: Doğrulama APK ve raporlarını yükle
        uses: actions/upload-artifact@v4
        with:
          name: BilgiRotasi-Kalici-Android-V3-1.67.1-89
          path: |
            dist/BilgiRotasi-Kalici-Android-1.67.1-89.apk
            reports/PERMANENT_ANDROID_REPORT.md
            reports/PERMANENT_ANDROID_PACKAGE.txt
            reports/PERMANENT_ANDROID_PERMISSIONS.txt
            reports/PERMANENT_ANDROID_BADGING.txt
            reports/PERMANENT_ANDROID_APK_SHA256.txt
            reports/PERMANENT_ANDROID_LAUNCH_LOG.txt
          if-no-files-found: error
          retention-days: 14
