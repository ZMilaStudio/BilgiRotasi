name: Canlı Düello eşleştirme ve BR düzeltmesi

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, 'Canlı düello eşleştirme düzeltmesi')
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Flutter kur
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.7"
          channel: stable
          cache: true

      - name: Bağımlılıkları kur
        run: flutter pub get

      - name: Git kimliğini ayarla
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout main

      - name: Düzeltmeyi uygula
        shell: bash
        env:
          FIX_SCRIPT_B64: ""
        run: |
          set -euo pipefail
          printf '%s' "$FIX_SCRIPT_B64" \
            | base64 --decode \
            > /tmp/apply_fix.py
          python3 /tmp/apply_fix.py

      - name: Biçimlendir, analiz et ve test et
        shell: bash
        run: |
          set -euo pipefail

          dart format \
            lib/account_cloud.dart \
            lib/player_username.dart \
            lib/live_duel_league.dart \
            lib/app_build_info.dart \
            test/live_duel_league_test.dart \
            test/username_server_binding_test.dart

          flutter analyze \
            --no-fatal-warnings \
            --no-fatal-infos

          flutter test \
            --concurrency=1 \
            --reporter expanded

          python3 tools/rc1_quality_gate.py
          git diff --check

      - name: Değişiklikleri kaydet
        shell: bash
        run: |
          set -euo pipefail

          git add \
            lib/account_cloud.dart \
            lib/player_username.dart \
            lib/live_duel_league.dart \
            lib/app_build_info.dart \
            test/live_duel_league_test.dart \
            test/username_server_binding_test.dart \
            pubspec.yaml \
            tools/rc1_quality_gate.py \
            BILGI_ROTASI_DURUM.md

          git commit -m "Canli duello kullanici adi ve BR duzeltmesi"
          git push origin main
