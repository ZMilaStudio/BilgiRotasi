name: BR güvenlik ve çevrimdışı açılış V3

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, 'BR güvenlik ve çevrimdışı açılış V3')
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Flutter kur
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.7"
          channel: stable
          cache: true

      - name: Bağımlılıkları kur
        run: flutter pub get

      - name: Git kimliğini ayarla
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout main

      - name: Güvenlik paketini GitHub Actions'a uyarla
        shell: bash
        run: |
          set -euo pipefail

          test -f BilgiRotasi_Canli_Duello_Sunucu_Dogrulamasi_Paketi.zip
          unzip -o BilgiRotasi_Canli_Duello_Sunucu_Dogrulamasi_Paketi.zip

          python3 - <<'PYCODE'
          import os
          import textwrap
          from pathlib import Path

          path = Path('BILGI_ROTASI_CANLI_DUELLO_SUNUCU_DOGRULAMA_KUR.py')
          text = path.read_text(encoding='utf-8')
          workspace = os.environ['GITHUB_WORKSPACE']

          text = text.replace(
              'REPO = Path("/workspaces/BilgiRotasi")',
              f'REPO = Path({workspace!r})',
          )
          text = text.replace('"/workspaces/flutter/bin/dart"', '"dart"')
          text = text.replace('"/workspaces/flutter/bin/flutter"', '"flutter"')

          analyze_start = text.index('def analyze() -> None:')
          analyze_end = text.index('\n\ndef run_tests() -> None:', analyze_start)
          analyze_function = textwrap.dedent(
              """
              def analyze() -> None:
                  print("\\n2/5 Flutter analizi çalışıyor...", flush=True)
                  result = subprocess.run(
                      [
                          "flutter",
                          "analyze",
                          "--no-fatal-warnings",
                          "--no-fatal-infos",
                      ],
                      cwd=REPO,
                      check=False,
                  )
                  if result.returncode != 0:
                      raise RuntimeError("Flutter analizi derleme hatası verdi.")
              """
          ).strip()
          text = text[:analyze_start] + analyze_function + text[analyze_end:]

          versions_start = text.index('def patch_versions() -> None:')
          versions_end = text.index('\n\ndef analyze() -> None:', versions_start)
          versions_function = textwrap.dedent(
              """
              def patch_versions() -> None:
                  pubspec = REPO / "pubspec.yaml"
                  version_text = pubspec.read_text(encoding="utf-8")
                  version_text = replace_once(
                      version_text,
                      f"version: {OLD_VERSION}",
                      f"version: {NEW_VERSION}",
                      "pubspec sürümü",
                  )
                  pubspec.write_text(version_text, encoding="utf-8")

                  build_info = REPO / "lib/app_build_info.dart"
                  build_text = build_info.read_text(encoding="utf-8")
                  build_text = replace_once(
                      build_text,
                      f"static const String versionName = '{OLD_VERSION_NAME}';",
                      f"static const String versionName = '{NEW_VERSION_NAME}';",
                      "uygulama sürümü",
                  )
                  build_text = replace_once(
                      build_text,
                      f"static const int buildNumber = {OLD_BUILD};",
                      f"static const int buildNumber = {NEW_BUILD};",
                      "yapı numarası",
                  )
                  build_info.write_text(build_text, encoding="utf-8")

                  gate = REPO / "tools/rc1_quality_gate.py"
                  gate_text = gate.read_text(encoding="utf-8")
                  gate_text = replace_once(
                      gate_text,
                      f'EXPECTED_VERSION = "{OLD_VERSION}"',
                      f'EXPECTED_VERSION = "{NEW_VERSION}"',
                      "kalite kapısı sürümü",
                  )
                  gate.write_text(gate_text, encoding="utf-8")
              """
          ).strip()
          text = text[:versions_start] + versions_function + text[versions_end:]

          old_push = '        run(["git", "push", "origin", "main"])'
          if text.count(old_push) != 1:
              raise SystemExit('Kurulum içindeki push satırı bulunamadı.')
          text = text.replace(
              old_push,
              '        print("Push işlemi V3 otomasyonuna bırakıldı.")',
              1,
          )

          path.write_text(text, encoding='utf-8')
          PYCODE

      - name: Canlı Düello güvenli puan yazımını uygula
        run: python3 BILGI_ROTASI_CANLI_DUELLO_SUNUCU_DOGRULAMA_KUR.py

      - name: Çevrimdışı açılışı düzelt
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PYCODE'
          import re
          from pathlib import Path

          main_path = Path('lib/main.dart')
          main_text = main_path.read_text(encoding='utf-8')
          main_pattern = re.compile(
              r"  try \{\n"
              r"    await AccountCloudService\.initialize\(\);\n"
              r"  \} catch \(_\) \{\n"
              r"    // Firebase açılamasa bile misafir oyun devam eder\.\n"
              r"  \}\n\n"
              r"  runApp\(const BilgiRotasiApp\(\)\);\n"
              r"\}",
          )
          main_replacement = """  runApp(const BilgiRotasiApp());

            unawaited(_initializeAccountCloudInBackground());
          }

          Future<void> _initializeAccountCloudInBackground() async {
            try {
              await AccountCloudService.initialize().timeout(
                const Duration(seconds: 8),
              );
            } catch (_) {
              // İnternet olmasa bile yerel oyun açılmaya devam eder.
            }
          }"""
          main_text, count = main_pattern.subn(main_replacement, main_text, count=1)
          if count != 1:
              raise SystemExit('Ana çevrimdışı açılış bloğu bulunamadı.')
          main_path.write_text(main_text, encoding='utf-8')

          account_path = Path('lib/account_cloud.dart')
          account_text = account_path.read_text(encoding='utf-8')
          existing_pattern = re.compile(
              r"        state\.value = AccountSessionState\(\n"
              r"          mode: AccountMode\.google,\n"
              r"          firebaseReady: true,\n"
              r"          user: currentUser,\n"
              r"          busy: true,\n"
              r"        \);\n\n"
              r"        await _activateExistingUser\(currentUser\);",
          )
          existing_replacement = """        state.value = AccountSessionState(
                    mode: AccountMode.google,
                    firebaseReady: true,
                    user: currentUser,
                    message:
                        'Telefondaki kayıtla açıldı. '
                        'Bulut eşitlemesi arka planda denenecek.',
                  );

                  unawaited(_activateExistingUser(currentUser));"""
          account_text, count = existing_pattern.subn(
              existing_replacement,
              account_text,
              count=1,
          )
          if count != 1:
              raise SystemExit('Mevcut hesap açılış bloğu bulunamadı.')

          server_pattern = re.compile(
              r"    final document = await _firestore!\n"
              r"        \.collection\('users'\)\n"
              r"        \.doc\(uid\)\n"
              r"        \.get\(GetOptions\(source: Source\.server\)\);",
          )
          server_replacement = """    final document = await _firestore!
                  .collection('users')
                  .doc(uid)
                  .get(GetOptions(source: Source.server))
                  .timeout(const Duration(seconds: 6));"""
          account_text, count = server_pattern.subn(
              server_replacement,
              account_text,
              count=1,
          )
          if count != 1:
              raise SystemExit('Bulut okuma bloğu bulunamadı.')
          account_path.write_text(account_text, encoding='utf-8')

          test_path = Path('test/offline_startup_policy_test.dart')
          test_path.write_text(
              """import 'dart:io';

          import 'package:flutter_test/flutter_test.dart';

          void main() {
            group('Çevrimdışı açılış politikası', () {
              test('uygulama bulut başlatmasını beklemeden açılır', () {
                final source = File('lib/main.dart').readAsStringSync();
                final runAppIndex = source.indexOf(
                  'runApp(const BilgiRotasiApp());',
                );
                final cloudIndex = source.indexOf(
                  'unawaited(_initializeAccountCloudInBackground());',
                );
                expect(runAppIndex, greaterThanOrEqualTo(0));
                expect(cloudIndex, greaterThan(runAppIndex));
              });

              test('mevcut hesap bulut cevabını beklemez', () {
                final source = File('lib/account_cloud.dart').readAsStringSync();
                expect(
                  source,
                  contains('unawaited(_activateExistingUser(currentUser));'),
                );
                expect(
                  source,
                  isNot(contains('await _activateExistingUser(currentUser);')),
                );
              });

              test('sunucu okumasında zaman aşımı vardır', () {
                final source = File('lib/account_cloud.dart').readAsStringSync();
                expect(
                  source,
                  contains('.timeout(const Duration(seconds: 6));'),
                );
              });
            });
          }
          """,
              encoding='utf-8',
          )

          status = Path('BILGI_ROTASI_DURUM.md')
          status_text = status.read_text(encoding='utf-8')
          status_text += """

          ## Çevrimdışı Açılış Düzeltmesi

          - Uygulama bulut başlatmasını beklemeden ilk kareyi açar.
          - Mevcut Google hesabı yerel kayıtla anında açılır.
          - Bulut eşitlemesi arka planda denenir.
          - Sunucu okuması 6 saniyede zaman aşımına uğrar.
          - İnternet yokken native açılış logosunda kalma engellendi.
          """
          status.write_text(status_text, encoding='utf-8')
          PYCODE

          dart format \
            lib/main.dart \
            lib/account_cloud.dart \
            test/offline_startup_policy_test.dart

          flutter analyze --no-fatal-warnings --no-fatal-infos
          flutter test \
            test/offline_startup_policy_test.dart \
            --concurrency=1 \
            --reporter expanded
          git diff --check

      - name: Çevrimdışı açılış commitini oluştur
        run: |
          git add -A
          git commit -m "Cevrimdisi acilisi ve BR guvenligini tamamla"

      - name: Değişiklikleri main dalına gönder
        run: git push origin main
