name: Kelime Avi Exact-Head Signed Release AAB

on:
  push:
    branches:
      - diag/kelime-avi-signed-aab-ac8812b

permissions:
  contents: read

jobs:
  signed-release-aab:
    if: github.repository == 'ZMilaStudio/BilgiRotasi' && github.event_name == 'push' && github.ref == 'refs/heads/diag/kelime-avi-signed-aab-ac8812b'
    name: Exact-head signed standalone AAB
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      PRODUCTION_SOURCE_SHA: ac8812b9b12ce83990679e76bb00da5bc92fa419
      CANONICAL_RELEASE_BRANCH: release/final-closed-test-aab-1.68.8
      TEMPORARY_WORKFLOW_SHA: ${{ github.sha }}
      STANDALONE_DIR: apps/kelime_avi_standalone
      KELIME_AVI_UPLOAD_KEYSTORE_BASE64: ${{ secrets.KELIME_AVI_UPLOAD_KEYSTORE_BASE64 }}
      KELIME_AVI_UPLOAD_STORE_PASSWORD: ${{ secrets.KELIME_AVI_UPLOAD_STORE_PASSWORD }}
      KELIME_AVI_UPLOAD_KEY_ALIAS: ${{ secrets.KELIME_AVI_UPLOAD_KEY_ALIAS }}
      KELIME_AVI_UPLOAD_KEY_PASSWORD: ${{ secrets.KELIME_AVI_UPLOAD_KEY_PASSWORD }}

    steps:
      - name: Check out isolated workflow commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify workflow-only diff and select exact release source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/diag/kelime-avi-signed-aab-ac8812b'
          test "$(git rev-parse HEAD)" = "$TEMPORARY_WORKFLOW_SHA"
          test "$(git rev-list --parents -n 1 HEAD | wc -w)" -eq 2
          test "$(git rev-parse HEAD^)" = "$PRODUCTION_SOURCE_SHA"
          git merge-base --is-ancestor "$PRODUCTION_SOURCE_SHA" HEAD
          test "$(git diff --name-only "$PRODUCTION_SOURCE_SHA" HEAD)" = '.github/workflows/kelime-avi-exact-head-signed-aab.yml'
          git fetch origin "$CANONICAL_RELEASE_BRANCH"
          REMOTE_SHA="$(git ls-remote origin "refs/heads/$CANONICAL_RELEASE_BRANCH" | awk '{print $1}')"
          test "$REMOTE_SHA" = "$PRODUCTION_SOURCE_SHA"
          git checkout --detach "$PRODUCTION_SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$PRODUCTION_SOURCE_SHA"
          git diff --exit-code
          git diff --cached --exit-code
          test ! -e apps/kelime_avi_standalone/android/key.properties
          test ! -e apps/kelime_avi_standalone/android/app/kelime_avi_upload.jks

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up canonical Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Verify upload signing secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KELIME_AVI_UPLOAD_KEYSTORE_BASE64"
          test -n "$KELIME_AVI_UPLOAD_STORE_PASSWORD"
          test -n "$KELIME_AVI_UPLOAD_KEY_ALIAS"
          test -n "$KELIME_AVI_UPLOAD_KEY_PASSWORD"

      - name: Prepare temporary upload keystore
        shell: bash
        working-directory: apps/kelime_avi_standalone
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$KELIME_AVI_UPLOAD_KEYSTORE_BASE64" | base64 --decode > android/app/kelime_avi_upload.jks
          printf '%s\n' \
            "storeFile=app/kelime_avi_upload.jks" \
            "storePassword=$KELIME_AVI_UPLOAD_STORE_PASSWORD" \
            "keyAlias=$KELIME_AVI_UPLOAD_KEY_ALIAS" \
            "keyPassword=$KELIME_AVI_UPLOAD_KEY_PASSWORD" \
            > android/key.properties
          chmod 600 android/app/kelime_avi_upload.jks android/key.properties

      - name: Verify standalone release identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCTION_SOURCE_SHA"
          gradle="$STANDALONE_DIR/android/app/build.gradle.kts"
          manifest="$STANDALONE_DIR/android/app/src/main/AndroidManifest.xml"
          pubspec="$STANDALONE_DIR/pubspec.yaml"
          grep -Fq 'namespace = "com.zmilastudio.kelimeavi"' "$gradle"
          grep -Fq 'applicationId = "com.zmilastudio.kelimeavi"' "$gradle"
          grep -Fq 'android:label="Kelime Avı"' "$manifest"
          grep -Fq 'version: 1.0.0+1' "$pubspec"

      - name: Resolve standalone dependencies
        working-directory: apps/kelime_avi_standalone
        run: flutter pub get

      - name: Standalone analyze
        working-directory: apps/kelime_avi_standalone
        run: flutter analyze

      - name: Standalone tests
        working-directory: apps/kelime_avi_standalone
        run: flutter test --reporter expanded

      - name: Build signed release AAB
        working-directory: apps/kelime_avi_standalone
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCTION_SOURCE_SHA"
          flutter build appbundle --release --no-pub

      - name: Verify AAB signing identity and prepare delivery
        shell: bash
        working-directory: apps/kelime_avi_standalone
        run: |
          set -euo pipefail
          export LC_ALL=C
          aab="build/app/outputs/bundle/release/app-release.aab"
          expected_fingerprint="66:32:75:3D:43:3F:2A:E9:96:A5:CB:6B:AB:25:98:A9:22:A8:4D:03:40:CF:0F:15:DC:E3:69:0D:21:A9:4B:7F"
          test -s "$aab"
          jarsigner -verify "$aab" 2>&1 | tee JARSIGNER_VERIFY.txt
          grep -Fq 'jar verified' JARSIGNER_VERIFY.txt
          keytool -printcert -jarfile "$aab" > AAB_CERTIFICATE.txt
          aab_fingerprint="$(sed -nE 's/^[[:space:]]*SHA256:[[:space:]]*//p' AAB_CERTIFICATE.txt | head -n1)"
          test -n "$aab_fingerprint"
          test "$aab_fingerprint" = "$expected_fingerprint"
          keystore_fingerprint="$(
            keytool -list -v \
              -keystore android/app/kelime_avi_upload.jks \
              -storepass:env KELIME_AVI_UPLOAD_STORE_PASSWORD \
              -alias "$KELIME_AVI_UPLOAD_KEY_ALIAS" \
              | sed -nE 's/^[[:space:]]*SHA256:[[:space:]]*//p' \
              | head -n1
          )"
          test -n "$keystore_fingerprint"
          test "$keystore_fingerprint" = "$expected_fingerprint"
          test "$keystore_fingerprint" = "$aab_fingerprint"
          sha256sum "$aab" | tee app-release.aab.sha256

          delivery="$RUNNER_TEMP/kelime-avi-signed-aab"
          mkdir "$delivery"
          cp "$aab" "$delivery/KelimeAvi-1.0.0-1-signed.aab"
          cp app-release.aab.sha256 "$delivery/"
          cp AAB_CERTIFICATE.txt "$delivery/"
          cp JARSIGNER_VERIFY.txt "$delivery/"
          AAB_SHA256="$(awk '{print $1}' app-release.aab.sha256)"
          {
            echo "production_source_sha=$PRODUCTION_SOURCE_SHA"
            echo "temporary_workflow_sha=$TEMPORARY_WORKFLOW_SHA"
            echo "package=com.zmilastudio.kelimeavi"
            echo "versionName=1.0.0"
            echo "versionCode=1"
            echo "build_type=release"
            echo "signing=Kelime Avi upload key"
            echo "certificate_sha256=$aab_fingerprint"
            echo "aab_sha256=$AAB_SHA256"
          } > "$delivery/manifest.txt"
          test -s "$delivery/KelimeAvi-1.0.0-1-signed.aab"
          test -s "$delivery/manifest.txt"

      - name: Upload signed AAB package
        uses: actions/upload-artifact@v4
        with:
          name: KelimeAvi-signed-aab-ac8812b
          path: ${{ runner.temp }}/kelime-avi-signed-aab/
          if-no-files-found: error
          retention-days: 7

      - name: Remove temporary signing files
        if: always()
        shell: bash
        working-directory: apps/kelime_avi_standalone
        run: |
          set -euo pipefail
          rm -f android/key.properties android/app/kelime_avi_upload.jks
          test ! -e android/key.properties
          test ! -e android/app/kelime_avi_upload.jks
