name: AdMob banner ve ödüllü reklam paketi

'on':
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, 'Reklam paketini ekle')
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Flutter kur
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.7"
          channel: stable
          cache: true

      - name: Git kimliğini ayarla
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout main

      - name: Reklam paketini uygula
        shell: bash
        env:
          INSTALLER_B64: ""
        run: |
          set -euo pipefail
          printf '%s' "$INSTALLER_B64" | base64 --decode > /tmp/apply_admob.py
          python3 /tmp/apply_admob.py

      - name: Bağımlılıkları kur
        run: flutter pub get

      - name: Biçimlendir, analiz et ve test et
        shell: bash
        run: |
          set -euo pipefail

          dart format \
            lib/main.dart \
            lib/ad_monetization.dart \
            lib/xp_progression.dart \
            lib/gameplay_boost.dart \
            lib/live_duel_screen.dart \
            lib/live_duel_leaderboard.dart \
            lib/live_duel_play_screen.dart \
            lib/app_build_info.dart \
            test/ad_monetization_test.dart

          flutter analyze \
            --no-fatal-warnings \
            --no-fatal-infos

          flutter test \
            --concurrency=1 \
            --reporter expanded

          python3 tools/rc1_quality_gate.py
          git diff --check

      - name: Değişiklikleri kaydet
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git commit -m "AdMob banner ve odullu reklam paketini ekle"
          git push origin main
