name: Kristal Vadisi Android proof

on:
  push:
    branches:
      - ci/kristal-final-validation-20260917
    paths:
      - .github/workflows/kristal-android-proof.yml

permissions:
  contents: write

jobs:
  android-proof:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      EXPECTED_FEATURE_HEAD: bbce317939dbf24916c86d869fcdadcecba778c3
      PACKAGE: com.leventua.bilgirotasi
      ACTIVITY: com.leventua.bilgirotasi/.MainActivity
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/kelime-avi-kristal-vadisi
          fetch-depth: 0
      - name: Guard exact feature head
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL="$(git rev-parse HEAD)"
          test "$ACTUAL" = "$EXPECTED_FEATURE_HEAD"
      - name: Apply owner silhouette polish
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          renderer = Path('lib/word_hunt/word_hunt_reusable_route_map_screen.dart')
          src = renderer.read_text()

          old_metrics = '''abstract final class WordHuntFacetedCrystalMetrics {
            static const double normalScale = 1.00;
            static const double challengeScale = 1.06;
            static const double finalScale = 1.11;
          }'''
          new_metrics = '''abstract final class WordHuntFacetedCrystalMetrics {
            static const double normalScale = 1.00;
            static const double challengeScale = 1.06;
            static const double finalScale = 1.11;

            // Görsel footprint metrikleri; hitbox/canonical geometry değildir.
            static const double paintWidth = 62;
            static const double paintHeight = 56;
            static const double normalBodyWidth = 48;
            static const double normalBodyHeight = 46;
            static const double normalShardSilhouette = 58;
            static const double finalBodyWidth = 52;
            static const double finalBodyHeight = 50;
            static const double finalCrestWidth = 52;
            static const double finalCrestHeight = 32;
          }'''
          if old_metrics not in src:
              raise SystemExit('metrics guard missing')
          src = src.replace(old_metrics, new_metrics, 1)

          old_size = '''              width: 54,
              height: 46,'''
          new_size = '''              width: WordHuntFacetedCrystalMetrics.paintWidth,
              height: WordHuntFacetedCrystalMetrics.paintHeight,'''
          if old_size not in src:
              raise SystemExit('faceted paint size guard missing')
          src = src.replace(old_size, new_size, 1)

          old_inner = '''                      innerRimColor: isFinal && unlocked
                          ? theme.pathColor
                          : theme.textColor.withValues(
                              alpha: unlocked ? 0.24 : 0.18,
                            ),'''
          new_inner = '''                      innerRimColor: unlocked
                          ? theme.pathColor
                          : theme.lockedPathColor,'''
          if old_inner not in src:
              raise SystemExit('inner rim guard missing')
          src = src.replace(old_inner, new_inner, 1)

          old_lock = '''                          width: 16,
                          height: 12,'''
          new_lock = '''                          width: 18,
                          height: 14,'''
          if old_lock not in src:
              raise SystemExit('lock size guard missing')
          src = src.replace(old_lock, new_lock, 1)
          src = src.replace('''                            size: 7.5,''', '''                            size: 8.5,''', 1)

          old_crest_pos = '''              top: -18,
              width: 44,
              height: 25,'''
          new_crest_pos = '''              top: -28,
              width: WordHuntFacetedCrystalMetrics.finalCrestWidth,
              height: WordHuntFacetedCrystalMetrics.finalCrestHeight,'''
          if old_crest_pos not in src:
              raise SystemExit('crest position guard missing')
          src = src.replace(old_crest_pos, new_crest_pos, 1)

          start = src.index('class _FacetedCrystalNodePainter extends CustomPainter {')
          crest_start = src.index('class _CrystalFinalCrestPainter extends CustomPainter {')
          scenic_start = src.index('class _ScenicRouteNodePainter extends CustomPainter {')

          node_painter = r'''class _FacetedCrystalNodePainter extends CustomPainter {
            const _FacetedCrystalNodePainter({
              required this.fillColor,
              required this.rimColor,
              required this.innerRimColor,
              required this.accentColor,
              required this.shadowColor,
              required this.textColor,
              required this.locked,
              required this.challenge,
              required this.finalNode,
              required this.active,
            });

            final Color fillColor;
            final Color rimColor;
            final Color innerRimColor;
            final Color accentColor;
            final Color shadowColor;
            final Color textColor;
            final bool locked;
            final bool challenge;
            final bool finalNode;
            final bool active;

            Path _shard({
              required Offset center,
              required double angle,
              required double innerRadius,
              required double outerRadius,
              required double halfWidth,
            }) {
              final direction = Offset(math.cos(angle), math.sin(angle));
              final normal = Offset(-direction.dy, direction.dx);
              final base = center + direction * innerRadius;
              final shoulder = center + direction * (innerRadius + 2.8);
              final tip = center + direction * outerRadius;
              return Path()
                ..moveTo(
                  base.dx + normal.dx * halfWidth,
                  base.dy + normal.dy * halfWidth,
                )
                ..lineTo(
                  shoulder.dx + normal.dx * halfWidth * 0.70,
                  shoulder.dy + normal.dy * halfWidth * 0.70,
                )
                ..lineTo(tip.dx, tip.dy)
                ..lineTo(
                  shoulder.dx - normal.dx * halfWidth * 0.70,
                  shoulder.dy - normal.dy * halfWidth * 0.70,
                )
                ..lineTo(
                  base.dx - normal.dx * halfWidth,
                  base.dy - normal.dy * halfWidth,
                )
                ..close();
            }

            @override
            void paint(Canvas canvas, Size size) {
              final center = Offset(size.width * 0.50, size.height * 0.50);
              final bodyWidth = finalNode
                  ? WordHuntFacetedCrystalMetrics.finalBodyWidth
                  : WordHuntFacetedCrystalMetrics.normalBodyWidth;
              final bodyHeight = finalNode
                  ? WordHuntFacetedCrystalMetrics.finalBodyHeight
                  : WordHuntFacetedCrystalMetrics.normalBodyHeight;
              final medallionRect = Rect.fromCenter(
                center: center,
                width: bodyWidth,
                height: bodyHeight,
              );
              final coreRect = medallionRect.deflate(finalNode ? 6.0 : 5.0);
              final outerRadius = finalNode
                  ? 30.0
                  : challenge
                  ? 29.5
                  : WordHuntFacetedCrystalMetrics.normalShardSilhouette / 2;
              final innerRadius = finalNode ? 23.2 : 21.8;
              final shardHalfWidth = finalNode ? 5.0 : 4.6;

              final shadowPaint = Paint()
                ..color = shadowColor.withValues(alpha: locked ? 0.52 : 0.74);
              final defaultShard = Color.alphaBlend(
                textColor.withValues(alpha: locked ? 0.05 : 0.10),
                rimColor,
              );
              final shardEdge = Paint()
                ..style = PaintingStyle.stroke
                ..strokeWidth = 1.0
                ..strokeJoin = StrokeJoin.round
                ..color = textColor.withValues(alpha: locked ? 0.14 : 0.32);

              // Altı büyük shard 411px ekranda da kristal silüeti olarak okunur.
              for (var i = 0; i < 6; i++) {
                final angle = -math.pi / 2 + (math.pi * 2 * i / 6);
                final shard = _shard(
                  center: center,
                  angle: angle,
                  innerRadius: innerRadius,
                  outerRadius: outerRadius,
                  halfWidth: shardHalfWidth,
                );
                canvas.drawPath(shard.shift(const Offset(1.0, 1.6)), shadowPaint);
                final challengeGold = challenge && !locked && i.isEven;
                final color = challengeGold
                    ? accentColor.withValues(alpha: active ? 0.94 : 0.80)
                    : defaultShard.withValues(alpha: locked ? 0.68 : 0.98);
                canvas.drawPath(shard, Paint()..color = color);
                canvas.drawPath(shard, shardEdge);
              }

              // Final, normal/challenge'dan daha karmaşık yan silüete sahiptir.
              if (finalNode) {
                for (final angle in <double>[0, math.pi]) {
                  final sideShard = _shard(
                    center: center,
                    angle: angle,
                    innerRadius: 23.6,
                    outerRadius: 30.4,
                    halfWidth: 5.2,
                  );
                  canvas.drawPath(
                    sideShard.shift(const Offset(1.0, 1.5)),
                    shadowPaint,
                  );
                  canvas.drawPath(
                    sideShard,
                    Paint()
                      ..color = rimColor.withValues(alpha: locked ? 0.62 : 0.96),
                  );
                  canvas.drawPath(sideShard, shardEdge);
                }
              }

              canvas.drawOval(
                medallionRect.shift(const Offset(1.2, 2.2)),
                Paint()..color = shadowColor.withValues(alpha: locked ? 0.68 : 0.86),
              );

              final mineralBase = Color.alphaBlend(
                Colors.black.withValues(alpha: locked ? 0.30 : 0.16),
                fillColor,
              );
              canvas.drawOval(medallionRect, Paint()..color = mineralBase);
              canvas.drawOval(
                medallionRect,
                Paint()
                  ..style = PaintingStyle.stroke
                  ..strokeWidth = finalNode
                      ? 4.0
                      : challenge
                      ? 3.4
                      : 3.1
                  ..color = rimColor.withValues(alpha: locked ? 0.78 : 1.0),
              );

              // Görünür turquoise/silver inner mineral ring.
              canvas.drawOval(
                medallionRect.deflate(finalNode ? 4.0 : 3.8),
                Paint()
                  ..style = PaintingStyle.stroke
                  ..strokeWidth = finalNode ? 2.3 : 2.0
                  ..color = innerRimColor.withValues(alpha: locked ? 0.70 : 0.96),
              );

              final light = Color.alphaBlend(
                textColor.withValues(alpha: locked ? 0.08 : 0.24),
                fillColor,
              );
              final dark = Color.alphaBlend(
                Colors.black.withValues(alpha: locked ? 0.44 : 0.30),
                fillColor,
              );
              canvas.drawOval(
                coreRect,
                Paint()
                  ..shader = RadialGradient(
                    center: const Alignment(-0.34, -0.40),
                    radius: 1.0,
                    colors: <Color>[light, fillColor, dark],
                    stops: const <double>[0.0, 0.54, 1.0],
                  ).createShader(coreRect),
              );

              // Mikro çizgiler yerine üç büyük facet plane.
              final c = coreRect.center;
              final top = Offset(c.dx, coreRect.top);
              final left = Offset(coreRect.left, c.dy);
              final right = Offset(coreRect.right, c.dy);
              final bottom = Offset(c.dx, coreRect.bottom);
              final upperLeft = Path()
                ..moveTo(c.dx, c.dy)
                ..lineTo(left.dx, left.dy)
                ..lineTo(coreRect.left + coreRect.width * .22, coreRect.top)
                ..lineTo(top.dx, top.dy)
                ..close();
              final upperRight = Path()
                ..moveTo(c.dx, c.dy)
                ..lineTo(top.dx, top.dy)
                ..lineTo(coreRect.right - coreRect.width * .18, coreRect.top)
                ..lineTo(right.dx, right.dy)
                ..close();
              final lower = Path()
                ..moveTo(c.dx, c.dy)
                ..lineTo(right.dx, right.dy)
                ..lineTo(bottom.dx, bottom.dy)
                ..lineTo(left.dx, left.dy)
                ..close();
              canvas.drawPath(
                upperLeft,
                Paint()..color = textColor.withValues(alpha: locked ? 0.045 : 0.16),
              );
              canvas.drawPath(
                upperRight,
                Paint()..color = innerRimColor.withValues(alpha: locked ? 0.07 : 0.18),
              );
              canvas.drawPath(
                lower,
                Paint()..color = Colors.black.withValues(alpha: locked ? 0.15 : 0.10),
              );

              canvas.drawOval(
                coreRect,
                Paint()
                  ..style = PaintingStyle.stroke
                  ..strokeWidth = 1.4
                  ..color = innerRimColor.withValues(alpha: locked ? 0.48 : 0.86),
              );

              // Tek güçlü highlight edge küçük ekranda kaybolmaz.
              canvas.drawArc(
                coreRect.deflate(1.1),
                math.pi * 1.04,
                math.pi * 0.58,
                false,
                Paint()
                  ..style = PaintingStyle.stroke
                  ..strokeWidth = 1.65
                  ..strokeCap = StrokeCap.round
                  ..color = textColor.withValues(alpha: locked ? 0.13 : 0.38),
              );
            }

            @override
            bool shouldRepaint(covariant _FacetedCrystalNodePainter old) =>
                old.fillColor != fillColor ||
                old.rimColor != rimColor ||
                old.innerRimColor != innerRimColor ||
                old.accentColor != accentColor ||
                old.shadowColor != shadowColor ||
                old.textColor != textColor ||
                old.locked != locked ||
                old.challenge != challenge ||
                old.finalNode != finalNode ||
                old.active != active;
          }'''

          crest_painter = r'''class _CrystalFinalCrestPainter extends CustomPainter {
            const _CrystalFinalCrestPainter({
              required this.crystalColor,
              required this.edgeColor,
              required this.accentColor,
              required this.shadowColor,
              required this.active,
            });

            final Color crystalColor;
            final Color edgeColor;
            final Color accentColor;
            final Color shadowColor;
            final bool active;

            Path _filledPrism({
              required Size size,
              required double centerX,
              required double tipY,
              required double baseLeft,
              required double baseRight,
              required double shoulderY,
            }) {
              final cx = size.width * centerX;
              final half = size.width * (baseRight - baseLeft) * .30;
              return Path()
                ..moveTo(size.width * baseLeft, size.height * .80)
                ..lineTo(cx - half, size.height * shoulderY)
                ..lineTo(cx, size.height * tipY)
                ..lineTo(cx + half, size.height * shoulderY)
                ..lineTo(size.width * baseRight, size.height * .80)
                ..close();
            }

            void _drawFilledCrystalPrism(
              Canvas canvas,
              Size size, {
              required double centerX,
              required double tipY,
              required double baseLeft,
              required double baseRight,
              required double shoulderY,
              required Color fill,
              required double facetBias,
            }) {
              final prism = _filledPrism(
                size: size,
                centerX: centerX,
                tipY: tipY,
                baseLeft: baseLeft,
                baseRight: baseRight,
                shoulderY: shoulderY,
              );
              canvas.drawPath(
                prism.shift(const Offset(1.1, 1.7)),
                Paint()..color = shadowColor.withValues(alpha: active ? .80 : .66),
              );
              final fillPaint = Paint()
                ..shader = LinearGradient(
                  begin: Alignment.topLeft,
                  end: Alignment.bottomRight,
                  colors: <Color>[
                    Color.alphaBlend(
                      Colors.white.withValues(alpha: active ? .22 : .10),
                      fill,
                    ),
                    fill,
                    Color.alphaBlend(
                      Colors.black.withValues(alpha: active ? .20 : .30),
                      fill,
                    ),
                  ],
                  stops: const <double>[0, .50, 1],
                ).createShader(Offset.zero & size);
              canvas.drawPath(prism, fillPaint);
              canvas.drawPath(
                prism,
                Paint()
                  ..style = PaintingStyle.stroke
                  ..strokeWidth = active ? 1.45 : 1.20
                  ..strokeJoin = StrokeJoin.round
                  ..color = edgeColor.withValues(alpha: active ? .98 : .82),
              );

              final cx = size.width * centerX;
              final facet = Path()
                ..moveTo(cx, size.height * (tipY + .05))
                ..lineTo(cx, size.height * .76)
                ..lineTo(
                  size.width * (centerX - facetBias),
                  size.height * .66,
                )
                ..close();
              canvas.drawPath(
                facet,
                Paint()
                  ..color = accentColor.withValues(alpha: active ? .24 : .11),
              );
            }

            @override
            void paint(Canvas canvas, Size size) {
              final sideFill = Color.alphaBlend(
                accentColor.withValues(alpha: active ? .14 : .07),
                crystalColor,
              );
              final outerFill = Color.alphaBlend(
                edgeColor.withValues(alpha: active ? .10 : .12),
                crystalColor,
              );

              // Beş dolu prism: stroke-only crown silhouette yok.
              _drawFilledCrystalPrism(
                canvas,
                size,
                centerX: .12,
                tipY: .46,
                baseLeft: .03,
                baseRight: .23,
                shoulderY: .60,
                fill: outerFill,
                facetBias: .025,
              );
              _drawFilledCrystalPrism(
                canvas,
                size,
                centerX: .31,
                tipY: .22,
                baseLeft: .19,
                baseRight: .43,
                shoulderY: .45,
                fill: sideFill,
                facetBias: .035,
              );
              _drawFilledCrystalPrism(
                canvas,
                size,
                centerX: .50,
                tipY: .00,
                baseLeft: .36,
                baseRight: .64,
                shoulderY: .34,
                fill: crystalColor,
                facetBias: .045,
              );
              _drawFilledCrystalPrism(
                canvas,
                size,
                centerX: .69,
                tipY: .22,
                baseLeft: .57,
                baseRight: .81,
                shoulderY: .45,
                fill: sideFill,
                facetBias: .035,
              );
              _drawFilledCrystalPrism(
                canvas,
                size,
                centerX: .88,
                tipY: .46,
                baseLeft: .77,
                baseRight: .97,
                shoulderY: .60,
                fill: outerFill,
                facetBias: .025,
              );

              // Dolu mineral setting: line-art taç tabanı yerine ağırlık verir.
              final setting = Path()
                ..moveTo(size.width * .08, size.height * .72)
                ..quadraticBezierTo(
                  size.width * .50,
                  size.height * .96,
                  size.width * .92,
                  size.height * .72,
                )
                ..lineTo(size.width * .84, size.height * .65)
                ..quadraticBezierTo(
                  size.width * .50,
                  size.height * .82,
                  size.width * .16,
                  size.height * .65,
                )
                ..close();
              canvas.drawPath(
                setting.shift(const Offset(0.8, 1.2)),
                Paint()..color = shadowColor.withValues(alpha: active ? .72 : .58),
              );
              canvas.drawPath(
                setting,
                Paint()
                  ..color = edgeColor.withValues(alpha: active ? .78 : .52),
              );
              canvas.drawPath(
                setting,
                Paint()
                  ..style = PaintingStyle.stroke
                  ..strokeWidth = active ? 1.3 : 1.0
                  ..color = edgeColor.withValues(alpha: active ? .98 : .78),
              );

              final gemCenter = Offset(size.width * .50, size.height * .70);
              final gem = Path()
                ..moveTo(gemCenter.dx, gemCenter.dy - 3.2)
                ..lineTo(gemCenter.dx + 3.5, gemCenter.dy)
                ..lineTo(gemCenter.dx, gemCenter.dy + 3.2)
                ..lineTo(gemCenter.dx - 3.5, gemCenter.dy)
                ..close();
              canvas.drawPath(
                gem,
                Paint()..color = accentColor.withValues(alpha: active ? .96 : .44),
              );
              canvas.drawPath(
                gem,
                Paint()
                  ..style = PaintingStyle.stroke
                  ..strokeWidth = .9
                  ..color = edgeColor.withValues(alpha: active ? 1.0 : .82),
              );
            }

            @override
            bool shouldRepaint(covariant _CrystalFinalCrestPainter old) =>
                old.crystalColor != crystalColor ||
                old.edgeColor != edgeColor ||
                old.accentColor != accentColor ||
                old.shadowColor != shadowColor ||
                old.active != active;
          }'''

          src = src[:start] + node_painter + '\n\n' + crest_painter + '\n\n' + src[scenic_start:]
          renderer.write_text(src)

          test_path = Path('test/word_hunt_kristal_renderer_test.dart')
          test = test_path.read_text()
          anchor = '''    expect(WordHuntFacetedCrystalMetrics.finalScale, 1.11);'''
          insert = '''    expect(WordHuntFacetedCrystalMetrics.finalScale, 1.11);
            expect(WordHuntFacetedCrystalMetrics.paintWidth, 62);
            expect(WordHuntFacetedCrystalMetrics.paintHeight, 56);
            expect(WordHuntFacetedCrystalMetrics.normalBodyWidth, 48);
            expect(WordHuntFacetedCrystalMetrics.normalBodyHeight, 46);
            expect(WordHuntFacetedCrystalMetrics.normalShardSilhouette, 58);
            expect(WordHuntFacetedCrystalMetrics.finalBodyWidth, 52);
            expect(WordHuntFacetedCrystalMetrics.finalBodyHeight, 50);
            expect(WordHuntFacetedCrystalMetrics.finalCrestWidth, 52);
            expect(WordHuntFacetedCrystalMetrics.finalCrestHeight, 32);'''
          if anchor not in test:
              raise SystemExit('renderer test metrics guard missing')
          test = test.replace(anchor, insert, 1)
          structural_anchor = '''    expect(rendererSource, isNot(contains('route.id == \"kristal-vadisi\"')));'''
          structural_insert = '''    expect(rendererSource, isNot(contains('route.id == \"kristal-vadisi\"')));
            expect(rendererSource, contains('for (var i = 0; i < 6; i++)'));
            expect(rendererSource, contains('_drawFilledCrystalPrism('));
            expect(rendererSource, contains('Beş dolu prism'));
            expect(rendererSource, contains('Mikro çizgiler yerine üç büyük facet plane'));'''
          if structural_anchor not in test:
              raise SystemExit('renderer test structure guard missing')
          test = test.replace(structural_anchor, structural_insert, 1)
          test_path.write_text(test)
          PY
          dart format \
            lib/word_hunt/word_hunt_reusable_route_map_screen.dart \
            test/word_hunt_kristal_renderer_test.dart
          git diff --check
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true
      - name: Validate renderer polish
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          dart analyze lib/word_hunt
          flutter test test/word_hunt_kristal_renderer_test.dart --reporter expanded
          git diff --check
          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -eq 2
          printf '%s\n' "${changed[@]}" | grep -Fxq 'lib/word_hunt/word_hunt_reusable_route_map_screen.dart'
          printf '%s\n' "${changed[@]}" | grep -Fxq 'test/word_hunt_kristal_renderer_test.dart'
      - name: Commit visual polish to feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            lib/word_hunt/word_hunt_reusable_route_map_screen.dart \
            test/word_hunt_kristal_renderer_test.dart
          git commit -m 'feat(kelime-avi): strengthen crystal medallion silhouettes'
          git push origin HEAD:feat/kelime-avi-kristal-vadisi
          FEATURE_SHA="$(git rev-parse HEAD)"
          echo "FEATURE_SHA=$FEATURE_SHA" >> "$GITHUB_ENV"
          printf '%s\n' "$FEATURE_SHA" > /tmp/FEATURE_SHA.txt
      - name: Prepare exact production proof target
        shell: bash
        run: |
          set -euo pipefail
          cat > lib/word_hunt/word_hunt_kristal_final_proof_main.dart <<'DART'
          import 'dart:ui' as ui;
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import 'word_hunt_kristal_content.dart';
          import 'word_hunt_kristal_visual_theme.dart';
          import 'word_hunt_progress.dart';
          import 'word_hunt_themed_production_route_screen.dart';

          const activeFinal = bool.fromEnvironment('KRISTAL_ACTIVE_FINAL');

          Future<void> main() async {
            WidgetsFlutterBinding.ensureInitialized();
            await SystemChrome.setPreferredOrientations(<DeviceOrientation>[DeviceOrientation.portraitUp]);
            await SystemChrome.setEnabledSystemUIMode(SystemUiMode.immersiveSticky);
            runApp(const ProofApp());
          }

          class ProofApp extends StatelessWidget {
            const ProofApp({super.key});
            static void noop() {}
            static void noopLevel(int _) {}
            @override
            Widget build(BuildContext context) {
              final route = WordHuntKristalContent.kristalVadisi;
              final progress = WordHuntProgressSnapshot(
                bestStarsByLevelId: <String, int>{
                  for (final level in route.levels.take(activeFinal ? 9 : 4))
                    level.id: activeFinal ? 1 : 3,
                },
              );
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                home: ProofProbe(
                  child: WordHuntThemedProductionRouteScreen(
                    route: route,
                    visualTheme: WordHuntKristalVisualTheme.production,
                    progress: progress,
                    onBack: noop,
                    onInfo: noop,
                    onCompass: noop,
                    onBook: noop,
                    onLevelTap: noopLevel,
                  ),
                ),
              );
            }
          }

          class ProofProbe extends StatefulWidget {
            const ProofProbe({super.key, required this.child});
            final Widget child;
            @override
            State<ProofProbe> createState() => ProofProbeState();
          }

          class ProofProbeState extends State<ProofProbe> {
            bool scheduled = false;
            @override
            void didChangeDependencies() {
              super.didChangeDependencies();
              if (scheduled) return;
              scheduled = true;
              WidgetsBinding.instance.addPostFrameCallback((_) async {
                try {
                  const asset = 'assets/word_hunt/KRISTAL_VADISI_ENV_941x1672.webp';
                  final data = await rootBundle.load(asset);
                  final bytes = data.buffer.asUint8List(data.offsetInBytes, data.lengthInBytes);
                  if (bytes.length != 2793116) throw StateError('bytes=${bytes.length}');
                  final codec = await ui.instantiateImageCodec(bytes);
                  final frame = await codec.getNextFrame();
                  if (frame.image.width != 941 || frame.image.height != 1672) {
                    throw StateError('size=${frame.image.width}x${frame.image.height}');
                  }
                  frame.image.dispose();
                  codec.dispose();
                  await Future<void>.delayed(const Duration(milliseconds: 900));
                  await WidgetsBinding.instance.endOfFrame;
                  debugPrint('[KRISTAL_FINAL_PROOF_READY] activeFinal=$activeFinal bytes=${bytes.length} size=941x1672');
                } catch (e, st) {
                  debugPrint('[KRISTAL_FINAL_PROOF_ERROR] $e');
                  debugPrintStack(stackTrace: st);
                }
              });
            }
            @override
            Widget build(BuildContext context) => widget.child;
          }
          DART
          dart format lib/word_hunt/word_hunt_kristal_final_proof_main.dart
          mkdir -p reports
      - name: Build proof APKs
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --debug -t lib/word_hunt/word_hunt_kristal_final_proof_main.dart --dart-define=KRISTAL_ACTIVE_FINAL=false --dart-define=ADMOB_ENVIRONMENT=test
          cp build/app/outputs/flutter-apk/app-debug.apk reports/KRISTAL_LOCKED.apk
          flutter build apk --debug -t lib/word_hunt/word_hunt_kristal_final_proof_main.dart --dart-define=KRISTAL_ACTIVE_FINAL=true --dart-define=ADMOB_ENVIRONMENT=test
          cp build/app/outputs/flutter-apk/app-debug.apk reports/KRISTAL_ACTIVE.apk
          printf '%s\n' "$FEATURE_SHA" > reports/FEATURE_SHA.txt
      - name: Enable KVM
        shell: bash
        run: |
          set -euo pipefail
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
          ./android/gradlew --stop || true
      - name: Prepare Android capture script
        shell: bash
        run: |
          set -euo pipefail
          cat > reports/run_kristal_capture.sh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          reset_display() {
            timeout 15 adb shell wm size reset >/dev/null 2>&1 || true
            timeout 15 adb shell wm density reset >/dev/null 2>&1 || true
          }
          wait_ready() {
            local label="$1"
            local i
            for i in $(seq 1 60); do
              timeout 15 adb logcat -d -v threadtime > "reports/${label}_LOGCAT.txt" 2>/dev/null || true
              if grep -Fq '[KRISTAL_FINAL_PROOF_ERROR]' "reports/${label}_LOGCAT.txt"; then
                tail -n 120 "reports/${label}_LOGCAT.txt" || true
                return 1
              fi
              if grep -Fq '[KRISTAL_FINAL_PROOF_READY]' "reports/${label}_LOGCAT.txt"; then
                return 0
              fi
              sleep 1
            done
            tail -n 160 "reports/${label}_LOGCAT.txt" || true
            return 1
          }
          capture() {
            local label="$1"
            local size="$2"
            local density="$3"
            reset_display
            timeout 15 adb shell wm size "$size"
            timeout 15 adb shell wm density "$density"
            timeout 15 adb shell am force-stop "$PACKAGE" >/dev/null 2>&1 || true
            timeout 15 adb logcat -c >/dev/null 2>&1 || true
            timeout 15 adb shell am start -n "$ACTIVITY" > "reports/${label}_LAUNCH.txt" 2>&1
            wait_ready "$label"
            sleep 2
            timeout 30 adb exec-out screencap -p > "reports/${label}.png"
            test -s "reports/${label}.png"
          }
          timeout 20 adb wait-for-device
          timeout 120 adb install -r reports/KRISTAL_LOCKED.apk > reports/LOCKED_INSTALL.txt
          grep -Fq Success reports/LOCKED_INSTALL.txt
          capture KRISTAL_LOCKED_411x731 411x731 160
          capture KRISTAL_LOCKED_720x1280 720x1280 320
          capture KRISTAL_LOCKED_1080x1920 1080x1920 420
          capture KRISTAL_LOCKED_1080x2400 1080x2400 440
          timeout 120 adb install -r reports/KRISTAL_ACTIVE.apk > reports/ACTIVE_INSTALL.txt
          grep -Fq Success reports/ACTIVE_INSTALL.txt
          capture KRISTAL_ACTIVE_FINAL_1080x1920 1080x1920 420
          reset_display
          printf '%s\n' 'RESULT=SUCCESS' > reports/RESULT.txt
          SH
          chmod +x reports/run_kristal_capture.sh
      - name: Capture Android 16 screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: aosp_atd
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          emulator-boot-timeout: 1200
          disable-animations: false
          script: ./reports/run_kristal_capture.sh
      - name: Verify proof output
        shell: bash
        run: |
          set -euo pipefail
          test -s reports/KRISTAL_LOCKED_411x731.png
          test -s reports/KRISTAL_LOCKED_720x1280.png
          test -s reports/KRISTAL_LOCKED_1080x1920.png
          test -s reports/KRISTAL_LOCKED_1080x2400.png
          test -s reports/KRISTAL_ACTIVE_FINAL_1080x1920.png
          grep -Fxq 'RESULT=SUCCESS' reports/RESULT.txt
          grep -Fxq "$FEATURE_SHA" reports/FEATURE_SHA.txt
      - name: Upload proof
        uses: actions/upload-artifact@v4
        with:
          name: Kristal-Android-Proof-${{ env.FEATURE_SHA }}
          path: |
            reports/FEATURE_SHA.txt
            reports/RESULT.txt
            reports/KRISTAL_LOCKED_411x731.png
            reports/KRISTAL_LOCKED_720x1280.png
            reports/KRISTAL_LOCKED_1080x1920.png
            reports/KRISTAL_LOCKED_1080x2400.png
            reports/KRISTAL_ACTIVE_FINAL_1080x1920.png
            reports/*_LOGCAT.txt
            reports/*_LAUNCH.txt
            reports/*_INSTALL.txt
          if-no-files-found: error
          retention-days: 30