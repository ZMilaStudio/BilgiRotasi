name: Firebase güvenlik doğrulaması

on:
  pull_request:
    paths:
      - "firestore.rules"
      - "firebase.json"
      - "functions/**"
      - ".github/workflows/firebase-safety-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  functions-and-rules:
    name: Functions ve Firestore Rules emulator testleri
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Java 21 kur
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Node.js 20 kur
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Kilitli bağımlılıkları kur
        working-directory: functions
        run: npm ci --ignore-scripts --no-audit

      - name: Cloud Functions birim testleri
        working-directory: functions
        run: npm test

      - name: Firestore Rules emulator testleri
        working-directory: functions
        run: npm run test:rules
