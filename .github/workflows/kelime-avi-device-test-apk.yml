name: Kelime Avi Exact-Head Device-Test APK

on:
  push:
    branches:
      - diag/kelime-avi-device-apk-9691abb

permissions:
  contents: read

jobs:
  device-test-apk:
    if: github.repository == 'ZMilaStudio/BilgiRotasi' && github.event_name == 'push' && github.ref == 'refs/heads/diag/kelime-avi-device-apk-9691abb'
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    env:
      PRODUCTION_SOURCE_SHA: 9691abb52c7e3ae9c4ed82a1f699a6fa63f5862f
      TEMPORARY_WORKFLOW_SHA: ${{ github.sha }}
    steps:
      - name: Check out isolated workflow commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Verify parent and workflow-only diff then select production source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/diag/kelime-avi-device-apk-9691abb'
          test "$(git rev-parse HEAD)" = "$TEMPORARY_WORKFLOW_SHA"
          test "$(git rev-list --parents -n 1 HEAD | wc -w)" -eq 2
          test "$(git rev-parse HEAD^)" = "$PRODUCTION_SOURCE_SHA"
          test "$(git diff --name-only "$PRODUCTION_SOURCE_SHA" HEAD)" = '.github/workflows/kelime-avi-device-test-apk.yml'
          git checkout --detach "$PRODUCTION_SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$PRODUCTION_SOURCE_SHA"
          git diff --exit-code
          git diff --cached --exit-code
          test ! -e apps/kelime_avi_standalone/android/key.properties
          link=apps/kelime_avi_standalone/assets/word_hunt
          test -L "$link"
          test "$(readlink "$link")" = '../../../assets/word_hunt'
          test "$(readlink -f "$link")" = "$(readlink -f assets/word_hunt)"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up canonical Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Build production-entrypoint debug APK
        working-directory: apps/kelime_avi_standalone
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          test "$(git rev-parse HEAD)" = "$PRODUCTION_SOURCE_SHA"
          flutter pub get
          flutter build apk --debug --target lib/main.dart --no-pub
          git diff --exit-code
          git diff --cached --exit-code

      - name: Verify APK identity and prepare delivery
        shell: bash
        run: |
          set -euo pipefail
          apk=apps/kelime_avi_standalone/build/app/outputs/flutter-apk/app-debug.apk
          test -s "$apk"
          aapt="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)"
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -x "$aapt"
          test -x "$apksigner"
          "$aapt" dump badging "$apk" > "$RUNNER_TEMP/device-apk-badging.txt"
          grep -Fxq 'application-debuggable' "$RUNNER_TEMP/device-apk-badging.txt"
          "$apksigner" verify --print-certs "$apk" > "$RUNNER_TEMP/device-apk-signature.txt"
          grep -Eq '^Signer #1 certificate DN: .*CN=Android Debug' "$RUNNER_TEMP/device-apk-signature.txt"
          python3 - <<'PY'
          import hashlib
          import os
          import pathlib
          import re
          import shutil
          apk = pathlib.Path("apps/kelime_avi_standalone/build/app/outputs/flutter-apk/app-debug.apk")
          badging = (pathlib.Path(os.environ["RUNNER_TEMP"]) / "device-apk-badging.txt").read_text()
          match = re.search(r"^package: name='([^']+)' versionCode='([^']+)' versionName='([^']*)'", badging, re.MULTILINE)
          if not match:
              raise SystemExit("Missing APK package/version metadata")
          package, code, version = match.groups()
          if package != "com.zmilastudio.kelimeavi" or not code.isdigit() or not version:
              raise SystemExit("Invalid APK identity/version")
          digest = hashlib.sha256(apk.read_bytes()).hexdigest()
          delivery = pathlib.Path(os.environ["RUNNER_TEMP"]) / "device-apk-delivery"
          delivery.mkdir()
          shutil.copyfile(apk, delivery / "KelimeAvi-device-test-9691abb-debug.apk")
          manifest = "\n".join([
              "production_source_sha=" + os.environ["PRODUCTION_SOURCE_SHA"],
              "temporary_workflow_sha=" + os.environ["TEMPORARY_WORKFLOW_SHA"],
              "apk_sha256=" + digest,
              "apk_size_bytes=" + str(apk.stat().st_size),
              "package_id=" + package,
              "version_name=" + version,
              "version_code=" + code,
              "build_type=debug",
              "entrypoint=lib/main.dart",
              "signing=Android Debug (non-production)",
          ]) + "\n"
          (delivery / "manifest.txt").write_text(manifest)
          print(manifest)
          PY

      - name: Upload owner device-test package
        uses: actions/upload-artifact@v4
        with:
          name: KelimeAvi-device-test-9691abb
          path: ${{ runner.temp }}/device-apk-delivery/
          if-no-files-found: error
          retention-days: 21
