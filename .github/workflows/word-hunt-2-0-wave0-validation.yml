name: Kelime Avı 2.0 Wave 0 Validation

on:
  pull_request:
    branches:
      - release/final-closed-test-aab-1.68.8
    paths:
      - 'docs/project-memory/KELIME_AVI_2_0_*.md'
      - 'test/word_hunt_2_0_wave0_baseline_test.dart'
      - '.github/workflows/word-hunt-2-0-wave0-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wave0:
    name: Authority and migration baselines
    runs-on: ubuntu-22.04
    timeout-minutes: 40

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Flutter 3.44.6 kur
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Bağımlılıkları kur
        run: flutter pub get

      - name: Wave 0 Dart format diagnostic
        run: |
          dart format test/word_hunt_2_0_wave0_baseline_test.dart
          echo '__WAVE0_FORMAT_DIFF_BEGIN__'
          git diff -- test/word_hunt_2_0_wave0_baseline_test.dart
          echo '__WAVE0_FORMAT_DIFF_END__'
          exit 1

      - name: Flutter analyze no-pub
        run: flutter analyze --no-pub

      - name: Wave 0 baseline tests
        run: flutter test test/word_hunt_2_0_wave0_baseline_test.dart --reporter expanded

      - name: Existing schema v2 regression
        run: flutter test test/word_hunt_progress_codec_v2_test.dart --reporter expanded

      - name: Existing route selection regression
        run: flutter test test/word_hunt_route_selection_test.dart --reporter expanded

      - name: Existing production flow regression
        run: flutter test test/word_hunt_production_flow_test.dart --reporter expanded

      - name: Existing gameplay regression
        run: flutter test test/word_hunt_level_production_test.dart --reporter expanded

      - name: Immutable trilogy asset lock
        run: flutter test test/word_hunt_trilogy_asset_lock_test.dart --reporter expanded

      - name: Full test suite
        run: flutter test

      - name: Diff whitespace gate
        run: git diff --check
