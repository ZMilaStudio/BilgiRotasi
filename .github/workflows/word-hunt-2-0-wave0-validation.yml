name: Kelime Avı 2.0 Cumulative Validation

on:
  pull_request:
    branches:
      - release/final-closed-test-aab-1.68.8
    paths:
      - 'docs/project-memory/KELIME_AVI_2_0_*.md'
      - 'lib/word_hunt/word_hunt_models.dart'
      - 'lib/word_hunt/word_hunt_segment_projection.dart'
      - 'lib/word_hunt/word_hunt_route_segment_host.dart'
      - 'lib/word_hunt/word_hunt_reusable_route_map_screen.dart'
      - 'lib/word_hunt/word_hunt_artwork_route_map_screen.dart'
      - 'lib/word_hunt/word_hunt_gokyuzu_master_art_screen.dart'
      - 'lib/word_hunt/word_hunt_pixel_proof_screen.dart'
      - 'lib/word_hunt/word_hunt_reference_route_screen.dart'
      - 'lib/word_hunt/word_hunt_progress.dart'
      - 'lib/word_hunt/word_hunt_progress_codec.dart'
      - 'lib/word_hunt/word_hunt_progress_migration.dart'
      - 'lib/word_hunt/word_hunt_route_rewards.dart'
      - 'lib/word_hunt/word_hunt_production_entry_screen.dart'
      - 'lib/word_hunt/word_hunt_screens.dart'
      - 'test/word_hunt_2_0_wave0_baseline_test.dart'
      - 'test/word_hunt_2_0_wave1_domain_foundation_test.dart'
      - 'test/word_hunt_2_0_wave2_persistence_v3_test.dart'
      - 'test/word_hunt_2_0_wave3_renderer_segment_host_test.dart'
      - 'test/word_hunt_progress_codec_test.dart'
      - 'test/word_hunt_progress_codec_v2_test.dart'
      - 'test/word_hunt_route_reward_test.dart'
      - '.github/workflows/word-hunt-2-0-wave0-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    name: Authority and cumulative domain baselines
    runs-on: ubuntu-22.04
    timeout-minutes: 40

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Flutter 3.44.6 kur
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Bağımlılıkları kur
        run: flutter pub get

      - name: Wave 0+1+2+3 Dart format gate
        run: >-
          dart format --output=none --set-exit-if-changed
          lib/word_hunt/word_hunt_models.dart
          lib/word_hunt/word_hunt_segment_projection.dart
          lib/word_hunt/word_hunt_route_segment_host.dart
          lib/word_hunt/word_hunt_reusable_route_map_screen.dart
          lib/word_hunt/word_hunt_artwork_route_map_screen.dart
          lib/word_hunt/word_hunt_gokyuzu_master_art_screen.dart
          lib/word_hunt/word_hunt_pixel_proof_screen.dart
          lib/word_hunt/word_hunt_reference_route_screen.dart
          lib/word_hunt/word_hunt_progress.dart
          lib/word_hunt/word_hunt_progress_codec.dart
          lib/word_hunt/word_hunt_progress_migration.dart
          lib/word_hunt/word_hunt_route_rewards.dart
          lib/word_hunt/word_hunt_production_entry_screen.dart
          lib/word_hunt/word_hunt_screens.dart
          test/word_hunt_2_0_wave0_baseline_test.dart
          test/word_hunt_2_0_wave1_domain_foundation_test.dart
          test/word_hunt_2_0_wave2_persistence_v3_test.dart
          test/word_hunt_2_0_wave3_renderer_segment_host_test.dart
          test/word_hunt_progress_codec_v2_test.dart

      - name: Full repository analyze baseline gate
        shell: bash
        run: |
          set -o pipefail
          set +e
          flutter analyze --no-pub 2>&1 | tee /tmp/wave-analyze.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          issues="$(grep -Eo '[0-9]+ issues found' /tmp/wave-analyze.log | tail -1 | awk '{print $1}')"
          test -n "$issues"
          echo "Full analyzer issue count: $issues (Wave 0 baseline: 92)"
          test "$issues" -le 92

      - name: Wave 1+2+3 targeted analyze gate
        run: >-
          flutter analyze --no-pub
          lib/word_hunt/word_hunt_models.dart
          lib/word_hunt/word_hunt_segment_projection.dart
          lib/word_hunt/word_hunt_route_segment_host.dart
          lib/word_hunt/word_hunt_reusable_route_map_screen.dart
          lib/word_hunt/word_hunt_artwork_route_map_screen.dart
          lib/word_hunt/word_hunt_gokyuzu_master_art_screen.dart
          lib/word_hunt/word_hunt_pixel_proof_screen.dart
          lib/word_hunt/word_hunt_reference_route_screen.dart
          lib/word_hunt/word_hunt_progress.dart
          lib/word_hunt/word_hunt_progress_codec.dart
          lib/word_hunt/word_hunt_progress_migration.dart
          lib/word_hunt/word_hunt_route_rewards.dart
          lib/word_hunt/word_hunt_production_entry_screen.dart
          lib/word_hunt/word_hunt_screens.dart
          test/word_hunt_2_0_wave1_domain_foundation_test.dart
          test/word_hunt_2_0_wave2_persistence_v3_test.dart
          test/word_hunt_2_0_wave3_renderer_segment_host_test.dart
          test/word_hunt_progress_codec_v2_test.dart

      - name: Wave 0 baseline tests
        run: flutter test test/word_hunt_2_0_wave0_baseline_test.dart --reporter expanded

      - name: Wave 1 domain foundation tests
        run: flutter test test/word_hunt_2_0_wave1_domain_foundation_test.dart --reporter expanded

      - name: Wave 2 persistence v3 tests
        run: flutter test test/word_hunt_2_0_wave2_persistence_v3_test.dart --reporter expanded

      - name: Wave 3 renderer segment-host tests
        run: flutter test test/word_hunt_2_0_wave3_renderer_segment_host_test.dart --reporter expanded

      - name: Existing reusable map geometry regression
        run: flutter test test/word_hunt_reusable_route_map_screen_test.dart --reporter expanded

      - name: Existing reference map regression
        run: flutter test test/word_hunt_reference_route_screen_test.dart --reporter expanded

      - name: Existing route stop hitbox regression
        run: flutter test test/word_hunt_route_stop_test.dart --reporter expanded

      - name: Existing path presentation-order regression
        run: flutter test test/word_hunt_trilogy_path_renderer_test.dart --reporter expanded

      - name: Existing book chrome regression
        run: flutter test test/word_hunt_book_regression_test.dart --reporter expanded

      - name: Existing model validator regression
        run: flutter test test/word_hunt_models_test.dart --reporter expanded

      - name: Existing progress semantics regression
        run: flutter test test/word_hunt_progress_test.dart --reporter expanded

      - name: Existing progress codec regression
        run: flutter test test/word_hunt_progress_codec_test.dart --reporter expanded

      - name: Legacy schema codec regression
        run: flutter test test/word_hunt_progress_codec_v2_test.dart --reporter expanded

      - name: Existing route reward regression
        run: flutter test test/word_hunt_route_reward_test.dart --reporter expanded

      - name: Existing route selection regression
        run: flutter test test/word_hunt_route_selection_test.dart --reporter expanded

      - name: Existing production flow regression
        run: flutter test test/word_hunt_production_flow_test.dart --reporter expanded

      - name: Existing gameplay regression
        run: flutter test test/word_hunt_level_production_test.dart --reporter expanded

      - name: Immutable trilogy asset lock
        run: flutter test test/word_hunt_trilogy_asset_lock_test.dart --reporter expanded

      - name: Full test suite
        run: flutter test

      - name: Diff whitespace gate
        run: git diff --check
