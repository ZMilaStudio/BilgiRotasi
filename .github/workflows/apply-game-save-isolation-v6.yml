name: Kayıtlı oyun izolasyonu V6
on:
  push:
    branches:
    - main
permissions:
  contents: write
jobs:
  apply:
    if: contains(github.event.head_commit.message, 'Kayıt izolasyonu V6')
    runs-on: ubuntu-latest
    steps:
    - name: Depoyu indir
      uses: actions/checkout@v7
      with:
        ref: main
        fetch-depth: 0
    - name: Flutter kur
      uses: subosito/flutter-action@v2
      with:
        flutter-version: 3.44.7
        channel: stable
        cache: true
    - name: Bağımlılıkları kur
      run: flutter pub get
    - name: Git kimliğini ayarla
      run: 'git config user.name "github-actions[bot]"

        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

        git checkout main

        '
    - name: Kesin hesap izolasyonunu uygula
      shell: bash
      env:
        INSTALLER_B64: 
      run: "set -euo pipefail\n\nprintf '%s' \"$INSTALLER_B64\" \\\n  | base64 --decode \\\n  > /tmp/apply_game_save_isolation_v3.py\n\npython3 /tmp/apply_game_save_isolation_v3.py\n"
    - name: Biçimlendir, analiz et ve test et
      shell: bash
      run: "set -euo pipefail\n\ndart format \\\n  lib/main.dart \\\n  lib/account_cloud.dart \\\n  lib/system_health.dart \\\n  lib/app_build_info.dart \\\n  test/game_save_account_isolation_v5_test.dart\n\nflutter analyze \\\n  --no-fatal-warnings \\\n  --no-fatal-infos\n\nflutter test \\\n  --concurrency=1 \\\n  --reporter expanded\n\npython3 tools/rc1_quality_gate.py\ngit diff --check\n"
    - name: Değişiklikleri kaydet
      shell: bash
      run: "set -euo pipefail\n\ngit add -A\n\ngit commit -m \"Kayitli oyun hesap izolasyonu V6\"\ngit push origin main\n"
