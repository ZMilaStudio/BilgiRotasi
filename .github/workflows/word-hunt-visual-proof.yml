name: Kelime Avı Android 16 görsel kanıtı

on:
  pull_request:
    branches:
      - release/final-closed-test-aab-1.68.8
      - feat/home-word-hunt-foundation-20260820
      - feat/kelime-avi-baslangic-limani-asset-first-20260824
    paths:
      - 'lib/word_hunt/**'
      - 'test/home_hub_prototype_test.dart'
      - 'test/word_hunt_*.dart'
      - 'assets/word_hunt/**'
      - 'tools/compare_kelime_avi_master_art.dart'
      - 'pubspec.yaml'
      - '.github/workflows/word-hunt-visual-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-proof:
    name: Kelime Avı gerçek Android 16 ekranları
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    env:
      PROOF_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Exact feature HEAD'i indir
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PROOF_SHA }}

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Dokunulmamış MASTER ART kaynağını doğrula
        shell: bash
        run: |
          set -euo pipefail
          source=assets/word_hunt/baslangic_limani_master_art_visual_proof.jpg
          test "$(wc -c < "$source")" -eq 156589
          test "$(sha256sum "$source" | cut -d' ' -f1)" = \
            fb4597bb4d37b30cefeec2ba913c591fe9471529f80966830afd5b801a86fca3

      - name: Flutter 3.44.6 kur
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Bağımlılıkları kur ve Kelime Avı focused suite'ini çalıştır
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          dart analyze lib/word_hunt
          flutter test \
            test/home_hub_prototype_test.dart \
            test/word_hunt_models_test.dart \
            test/word_hunt_path_test.dart \
            test/word_hunt_progress_codec_test.dart \
            test/word_hunt_progress_test.dart \
            test/word_hunt_production_assets_test.dart \
            test/word_hunt_pixel_proof_screen_test.dart \
            test/word_hunt_route_stop_test.dart \
            test/word_hunt_reference_route_screen_test.dart \
            test/word_hunt_prototype_screens_test.dart \
            test/word_hunt_route_map_v2_view_test.dart \
            test/word_hunt_route_map_view_test.dart \
            test/word_hunt_reusable_route_map_screen_test.dart \
            test/word_hunt_reusable_route_map_scenic_depth_test.dart \
            test/word_hunt_reusable_route_map_visual_proof_test.dart \
            test/word_hunt_route_map_decoration_test.dart \
            test/word_hunt_route_map_decoration_layer_test.dart \
            test/word_hunt_route_visual_theme_test.dart \
            test/word_hunt_orman_content_test.dart \
            test/word_hunt_scoring_test.dart \
            test/word_hunt_starter_content_test.dart \
            --reporter expanded
          git diff --check

      - name: Reusable harita widget kanıtlarını yükle
        uses: actions/upload-artifact@v4
        with:
          name: BilgiRotasi-KelimeAvi-ReusableMap-${{ env.PROOF_SHA }}
          path: |
            reports/WORD_HUNT_REUSABLE_MAP_WIDGET.txt
            reports/WORD_HUNT_REUSABLE_MAP_WIDGET_HARBOR_PROOF.png
            reports/WORD_HUNT_REUSABLE_MAP_WIDGET_SKY_PROOF.png
            reports/WORD_HUNT_REUSABLE_MAP_WIDGET_FOREST_PROOF.png
          if-no-files-found: error
          retention-days: 30

      - name: Reusable Orman Yolu Android proof APK'sını üret
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          flutter build apk --debug \
            -t lib/word_hunt/word_hunt_reusable_route_map_visual_proof_main.dart \
            --dart-define=ADMOB_ENVIRONMENT=test
          test -s build/app/outputs/flutter-apk/app-debug.apk
          cp build/app/outputs/flutter-apk/app-debug.apk \
            reports/WORD_HUNT_REUSABLE_MAP_ANDROID16_PROOF.apk
          sha256sum reports/WORD_HUNT_REUSABLE_MAP_ANDROID16_PROOF.apk \
            | tee reports/WORD_HUNT_REUSABLE_MAP_ANDROID16_APK_SHA256.txt
          git rev-parse HEAD \
            | tee reports/WORD_HUNT_REUSABLE_MAP_ANDROID16_HEAD_SHA.txt

      - name: İzole görsel kanıt APK'sını üret ve asset'i doğrula
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --debug \
            -t lib/word_hunt/word_hunt_visual_proof_main.dart \
            --dart-define=ADMOB_ENVIRONMENT=test
          test -s build/app/outputs/flutter-apk/app-debug.apk
          mkdir -p reports
          git rev-parse HEAD | tee reports/WORD_HUNT_VISUAL_PROOF_HEAD_SHA.txt
          sha256sum build/app/outputs/flutter-apk/app-debug.apk \
            | tee reports/WORD_HUNT_VISUAL_PROOF_APK_SHA256.txt
          source_assets=(
            assets/word_hunt/baslangic_limani_master_art_visual_proof.jpg
            assets/word_hunt/baslangic_limani/node_normal.webp
          )
          : > reports/WORD_HUNT_VISUAL_PROOF_APK_ASSET_LIST.txt
          : > reports/WORD_HUNT_VISUAL_PROOF_SOURCE_ASSET_SHA256.txt
          : > reports/WORD_HUNT_VISUAL_PROOF_SOURCE_ASSET_BYTES.txt
          : > reports/WORD_HUNT_VISUAL_PROOF_PACKAGED_ASSET_SHA256.txt
          : > reports/WORD_HUNT_VISUAL_PROOF_PACKAGED_ASSET_BYTES.txt
          mkdir -p reports/packaged-assets
          for source in "${source_assets[@]}"; do
            packaged="reports/packaged-assets/${source#assets/}"
            mkdir -p "$(dirname "$packaged")"
            unzip -l build/app/outputs/flutter-apk/app-debug.apk \
              | grep -F "assets/flutter_assets/$source" \
              | tee -a reports/WORD_HUNT_VISUAL_PROOF_APK_ASSET_LIST.txt
            unzip -p build/app/outputs/flutter-apk/app-debug.apk \
              "assets/flutter_assets/$source" > "$packaged"
            test -s "$packaged"
            cmp -s "$source" "$packaged"
            sha256sum "$source" | tee -a reports/WORD_HUNT_VISUAL_PROOF_SOURCE_ASSET_SHA256.txt
            wc -c "$source" | tee -a reports/WORD_HUNT_VISUAL_PROOF_SOURCE_ASSET_BYTES.txt
            sha256sum "$packaged" | tee -a reports/WORD_HUNT_VISUAL_PROOF_PACKAGED_ASSET_SHA256.txt
            wc -c "$packaged" | tee -a reports/WORD_HUNT_VISUAL_PROOF_PACKAGED_ASSET_BYTES.txt
          done
          echo "SOURCE_EQUALS_PACKAGED=YES count=2" \
            | tee reports/WORD_HUNT_VISUAL_PROOF_ASSET_COMPARE.txt

      - name: Android 16 emulator KVM erişimini hazırla
        shell: bash
        run: |
          set -euo pipefail
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm

      - name: Android 16'da gerçek Flutter ekranlarını çek
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: aosp_atd
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          emulator-boot-timeout: 1200
          disable-animations: false
          script: |
            set -eu
            mkdir -p reports

            wait_for_app_drawn() {
              local snapshot="$1"
              local label="$2"
              local drawn=0
              for attempt in $(seq 1 30); do
                adb shell dumpsys activity activities > "$snapshot"
                if grep -A60 -m1 'com.leventua.bilgirotasi/.MainActivity' "$snapshot" \
                  | grep -q 'reportedDrawn=true'; then
                  drawn=1
                  echo "$label first frame confirmed on attempt $attempt"
                  break
                fi
                sleep 1
              done
              if [ "$drawn" -ne 1 ]; then
                echo "$label never reached reportedDrawn=true" >&2
                cat "$snapshot" >&2
                return 1
              fi
              grep -Fq 'com.leventua.bilgirotasi/.MainActivity' "$snapshot"
              grep -Eq 'mResumedActivity.*com\.leventua\.bilgirotasi|topResumedActivity=.*com\.leventua\.bilgirotasi|mCurrentFocus=.*com\.leventua\.bilgirotasi' "$snapshot"
              sleep 1
            }

            validate_nonblack_png() {
              local png="$1"
              local metrics="$2"
              python3 - "$png" > "$metrics" <<'PY'
            import struct
            import sys
            import zlib

            path = sys.argv[1]
            data = open(path, 'rb').read()
            if data[:8] != b'\x89PNG\r\n\x1a\n':
                raise SystemExit('not a PNG')

            pos = 8
            width = height = bit_depth = color_type = interlace = None
            idat = bytearray()
            while pos + 12 <= len(data):
                length = struct.unpack('>I', data[pos:pos + 4])[0]
                kind = data[pos + 4:pos + 8]
                payload = data[pos + 8:pos + 8 + length]
                pos += 12 + length
                if kind == b'IHDR':
                    width, height, bit_depth, color_type, _, _, interlace = struct.unpack('>IIBBBBB', payload)
                elif kind == b'IDAT':
                    idat.extend(payload)
                elif kind == b'IEND':
                    break

            channels_by_type = {0: 1, 2: 3, 4: 2, 6: 4}
            if bit_depth != 8 or color_type not in channels_by_type or interlace != 0:
                raise SystemExit(
                    f'unsupported PNG layout bit_depth={bit_depth} color_type={color_type} interlace={interlace}'
                )
            channels = channels_by_type[color_type]
            stride = width * channels
            raw = zlib.decompress(bytes(idat))
            expected = height * (stride + 1)
            if len(raw) != expected:
                raise SystemExit(f'unexpected decompressed size {len(raw)} != {expected}')

            previous = bytearray(stride)
            offset = 0
            visible_pixels = 0
            max_channel = 0

            def paeth(a, b, c):
                p = a + b - c
                pa = abs(p - a)
                pb = abs(p - b)
                pc = abs(p - c)
                if pa <= pb and pa <= pc:
                    return a
                if pb <= pc:
                    return b
                return c

            for _ in range(height):
                filter_type = raw[offset]
                offset += 1
                source = raw[offset:offset + stride]
                offset += stride
                row = bytearray(stride)
                for i, value in enumerate(source):
                    left = row[i - channels] if i >= channels else 0
                    up = previous[i]
                    upper_left = previous[i - channels] if i >= channels else 0
                    if filter_type == 0:
                        decoded = value
                    elif filter_type == 1:
                        decoded = (value + left) & 255
                    elif filter_type == 2:
                        decoded = (value + up) & 255
                    elif filter_type == 3:
                        decoded = (value + ((left + up) // 2)) & 255
                    elif filter_type == 4:
                        decoded = (value + paeth(left, up, upper_left)) & 255
                    else:
                        raise SystemExit(f'unsupported PNG filter {filter_type}')
                    row[i] = decoded

                for x in range(width):
                    base = x * channels
                    if color_type in (0, 4):
                        r = g = b = row[base]
                    else:
                        r, g, b = row[base:base + 3]
                    local_max = max(r, g, b)
                    max_channel = max(max_channel, local_max)
                    if local_max >= 16:
                        visible_pixels += 1
                previous = row

            total = width * height
            ratio = visible_pixels / total if total else 0.0
            print(f'width={width}')
            print(f'height={height}')
            print(f'max_channel={max_channel}')
            print(f'visible_pixels_ge_16={visible_pixels}')
            print(f'visible_ratio={ratio:.6f}')
            if max_channel < 16 or ratio < 0.01:
                raise SystemExit(
                    f'visual proof is blank/near-black: max_channel={max_channel} visible_ratio={ratio:.6f}'
                )
            PY
              cat "$metrics"
            }

            if adb shell pm path com.leventua.bilgirotasi 2>/dev/null | grep -q '^package:'; then adb uninstall com.leventua.bilgirotasi; fi

            adb install reports/WORD_HUNT_REUSABLE_MAP_ANDROID16_PROOF.apk
            adb logcat -c
            adb shell am force-stop com.leventua.bilgirotasi
            adb shell monkey -p com.leventua.bilgirotasi -c android.intent.category.LAUNCHER 1 >/dev/null
            wait_for_app_drawn reports/WORD_HUNT_REUSABLE_MAP_ANDROID16_ACTIVITY.txt 'Reusable map proof'
            adb exec-out screencap -p > reports/WORD_HUNT_REUSABLE_MAP_ANDROID16.png
            adb logcat -d > reports/WORD_HUNT_REUSABLE_MAP_ANDROID16_LOGCAT.txt
            test -s reports/WORD_HUNT_REUSABLE_MAP_ANDROID16.png
            validate_nonblack_png \
              reports/WORD_HUNT_REUSABLE_MAP_ANDROID16.png \
              reports/WORD_HUNT_REUSABLE_MAP_ANDROID16_PIXEL_CHECK.txt
            if grep -E 'FATAL EXCEPTION|ANR in com\.leventua\.bilgirotasi|am_crash.*com\.leventua\.bilgirotasi|am_proc_died.*com\.leventua\.bilgirotasi' reports/WORD_HUNT_REUSABLE_MAP_ANDROID16_LOGCAT.txt; then echo 'Reusable map Android proof process failure detected.' >&2; exit 1; fi
            adb uninstall com.leventua.bilgirotasi

            adb install build/app/outputs/flutter-apk/app-debug.apk
            adb logcat -c
            adb shell am force-stop com.leventua.bilgirotasi
            adb shell monkey -p com.leventua.bilgirotasi -c android.intent.category.LAUNCHER 1 >/dev/null
            wait_for_app_drawn reports/WORD_HUNT_VISUAL_PROOF_ACTIVITY.txt 'MASTER ART visual proof'
            adb exec-out screencap -p > reports/ANDROID16_RAW.png
            adb logcat -d > reports/WORD_HUNT_VISUAL_PROOF_LOGCAT.txt
            awk '/WORD_HUNT_PIXEL_PROOF_ASSET_(LOADED|ERROR)/' reports/WORD_HUNT_VISUAL_PROOF_LOGCAT.txt > reports/WORD_HUNT_VISUAL_PROOF_ASSET_RUNTIME.txt
            test -s reports/ANDROID16_RAW.png
            validate_nonblack_png \
              reports/ANDROID16_RAW.png \
              reports/WORD_HUNT_VISUAL_PROOF_PIXEL_CHECK.txt
            if grep -E 'FATAL EXCEPTION|ANR in com\.leventua\.bilgirotasi|am_crash.*com\.leventua\.bilgirotasi|am_proc_died.*com\.leventua\.bilgirotasi' reports/WORD_HUNT_VISUAL_PROOF_LOGCAT.txt; then echo 'Bilgi Rotası visual-proof process failure detected.' >&2; exit 1; fi
            if grep -Fq '[WORD_HUNT_PIXEL_PROOF_ASSET_ERROR]' reports/WORD_HUNT_VISUAL_PROOF_ASSET_RUNTIME.txt; then cat reports/WORD_HUNT_VISUAL_PROOF_ASSET_RUNTIME.txt >&2; exit 1; fi
            grep -Fq '[WORD_HUNT_PIXEL_PROOF_ASSET_LOADED]' reports/WORD_HUNT_VISUAL_PROOF_ASSET_RUNTIME.txt
            test "$(grep -Fc '[WORD_HUNT_PIXEL_PROOF_ASSET_LOADED]' reports/WORD_HUNT_VISUAL_PROOF_ASSET_RUNTIME.txt)" -eq 2

      - name: Reusable harita gerçek Android kanıtını yükle
        uses: actions/upload-artifact@v4
        with:
          name: BilgiRotasi-KelimeAvi-ReusableMap-Android16-${{ env.PROOF_SHA }}
          path: |
            reports/WORD_HUNT_REUSABLE_MAP_ANDROID16.png
            reports/WORD_HUNT_REUSABLE_MAP_ANDROID16_ACTIVITY.txt
            reports/WORD_HUNT_REUSABLE_MAP_ANDROID16_LOGCAT.txt
            reports/WORD_HUNT_REUSABLE_MAP_ANDROID16_HEAD_SHA.txt
            reports/WORD_HUNT_REUSABLE_MAP_ANDROID16_APK_SHA256.txt
            reports/WORD_HUNT_REUSABLE_MAP_ANDROID16_PIXEL_CHECK.txt
          if-no-files-found: error
          retention-days: 30

      - name: MASTER ART karşılaştırma kanıtlarını üret
        shell: bash
        run: |
          set -euo pipefail
          dart run tools/compare_kelime_avi_master_art.dart \
            assets/word_hunt/baslangic_limani_master_art_visual_proof.jpg \
            reports/ANDROID16_RAW.png \
            reports
          test -s reports/REFERENCE.png
          test -s reports/ANDROID16.png
          test -s reports/SIDE_BY_SIDE.png
          test -s reports/DIFF.png
          test -s reports/pixel_geometry_metrics.json

      - name: Görsel kanıtları yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BilgiRotasi-KelimeAvi-PixelProof-${{ env.PROOF_SHA }}
          path: |
            reports/ANDROID16_RAW.png
            reports/REFERENCE.png
            reports/ANDROID16.png
            reports/SIDE_BY_SIDE.png
            reports/DIFF.png
            reports/pixel_geometry_metrics.json
            reports/WORD_HUNT_VISUAL_PROOF_ACTIVITY.txt
            reports/WORD_HUNT_VISUAL_PROOF_LOGCAT.txt
            reports/WORD_HUNT_VISUAL_PROOF_ASSET_RUNTIME.txt
            reports/WORD_HUNT_VISUAL_PROOF_HEAD_SHA.txt
            reports/WORD_HUNT_VISUAL_PROOF_APK_SHA256.txt
            reports/WORD_HUNT_VISUAL_PROOF_APK_ASSET_LIST.txt
            reports/WORD_HUNT_VISUAL_PROOF_SOURCE_ASSET_SHA256.txt
            reports/WORD_HUNT_VISUAL_PROOF_SOURCE_ASSET_BYTES.txt
            reports/WORD_HUNT_VISUAL_PROOF_PACKAGED_ASSET_SHA256.txt
            reports/WORD_HUNT_VISUAL_PROOF_PACKAGED_ASSET_BYTES.txt
            reports/WORD_HUNT_VISUAL_PROOF_ASSET_COMPARE.txt
            reports/WORD_HUNT_VISUAL_PROOF_PIXEL_CHECK.txt
          if-no-files-found: error
          retention-days: 30