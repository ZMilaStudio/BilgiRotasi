name: Kelime Avı Android 16 görsel kanıtı

on:
  pull_request:
    branches:
      - release/final-closed-test-aab-1.68.8
      - feat/home-word-hunt-foundation-20260820
      - feat/kelime-avi-baslangic-limani-asset-first-20260824
    paths:
      - 'lib/word_hunt/**'
      - 'test/home_hub_prototype_test.dart'
      - 'test/word_hunt_*.dart'
      - 'assets/word_hunt/**'
      - 'tools/compare_kelime_avi_master_art.dart'
      - 'tools/run_word_hunt_android16_visual_proof.sh'
      - 'pubspec.yaml'
      - '.github/workflows/word-hunt-visual-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-proof:
    name: Kelime Avı gerçek Android 16 ekranları
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      PROOF_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Exact feature HEAD'i indir
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PROOF_SHA }}

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Dokunulmamış MASTER ART kaynağını doğrula
        shell: bash
        run: |
          set -euo pipefail
          source=assets/word_hunt/baslangic_limani_master_art_visual_proof.jpg
          test "$(wc -c < "$source")" -eq 156589
          test "$(sha256sum "$source" | cut -d' ' -f1)" = \
            fb4597bb4d37b30cefeec2ba913c591fe9471529f80966830afd5b801a86fca3

      - name: Flutter 3.44.6 kur
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Bağımlılıkları kur ve Kelime Avı focused suite'ini çalıştır
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          dart analyze lib/word_hunt
          flutter test \
            test/home_hub_prototype_test.dart \
            test/word_hunt_models_test.dart \
            test/word_hunt_path_test.dart \
            test/word_hunt_progress_codec_test.dart \
            test/word_hunt_progress_test.dart \
            test/word_hunt_production_assets_test.dart \
            test/word_hunt_pixel_proof_screen_test.dart \
            test/word_hunt_route_stop_test.dart \
            test/word_hunt_reference_route_screen_test.dart \
            test/word_hunt_prototype_screens_test.dart \
            test/word_hunt_route_map_v2_view_test.dart \
            test/word_hunt_route_map_view_test.dart \
            test/word_hunt_reusable_route_map_screen_test.dart \
            test/word_hunt_reusable_route_map_scenic_depth_test.dart \
            test/word_hunt_reusable_route_map_visual_proof_test.dart \
            test/word_hunt_route_artwork_cleanliness_test.dart \
            test/word_hunt_route_map_decoration_test.dart \
            test/word_hunt_route_map_decoration_layer_test.dart \
            test/word_hunt_route_visual_theme_test.dart \
            test/word_hunt_themed_production_route_screen_test.dart \
            test/word_hunt_orman_content_test.dart \
            test/word_hunt_scoring_test.dart \
            test/word_hunt_starter_content_test.dart \
            --reporter expanded
          git diff --check

      - name: Reusable harita widget kanıtlarını yükle
        uses: actions/upload-artifact@v4
        with:
          name: BilgiRotasi-KelimeAvi-ReusableMap-${{ env.PROOF_SHA }}
          path: |
            reports/WORD_HUNT_REUSABLE_MAP_WIDGET.txt
            reports/WORD_HUNT_REUSABLE_MAP_WIDGET_HARBOR_PROOF.png
            reports/WORD_HUNT_REUSABLE_MAP_WIDGET_SKY_PROOF.png
            reports/WORD_HUNT_REUSABLE_MAP_WIDGET_FOREST_PROOF.png
            reports/WORD_HUNT_REUSABLE_MAP_WIDGET_ORMAN_PRODUCTION.png
            reports/WORD_HUNT_REUSABLE_MAP_WIDGET_ORMAN_PRODUCTION.txt
          if-no-files-found: error
          retention-days: 30

      - name: Reusable Orman Yolu Android proof APK'sını üret
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          flutter build apk --profile \
            -t lib/word_hunt/word_hunt_reusable_route_map_visual_proof_main.dart \
            --dart-define=ADMOB_ENVIRONMENT=test
          test -s build/app/outputs/flutter-apk/app-profile.apk
          cp build/app/outputs/flutter-apk/app-profile.apk \
            reports/WORD_HUNT_REUSABLE_MAP_ANDROID16_PROOF.apk
          sha256sum reports/WORD_HUNT_REUSABLE_MAP_ANDROID16_PROOF.apk \
            | tee reports/WORD_HUNT_REUSABLE_MAP_ANDROID16_APK_SHA256.txt
          git rev-parse HEAD \
            | tee reports/WORD_HUNT_REUSABLE_MAP_ANDROID16_HEAD_SHA.txt

      - name: İzole görsel kanıt APK'sını üret ve asset'i doğrula
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --profile \
            -t lib/word_hunt/word_hunt_visual_proof_main.dart \
            --dart-define=ADMOB_ENVIRONMENT=test
          test -s build/app/outputs/flutter-apk/app-profile.apk
          mkdir -p reports
          cp build/app/outputs/flutter-apk/app-profile.apk \
            reports/WORD_HUNT_VISUAL_PROOF_ANDROID16_PROOF.apk
          git rev-parse HEAD | tee reports/WORD_HUNT_VISUAL_PROOF_HEAD_SHA.txt
          sha256sum reports/WORD_HUNT_VISUAL_PROOF_ANDROID16_PROOF.apk \
            | tee reports/WORD_HUNT_VISUAL_PROOF_APK_SHA256.txt
          source_assets=(
            assets/word_hunt/baslangic_limani_master_art_visual_proof.jpg
            assets/word_hunt/baslangic_limani/node_normal.webp
          )
          : > reports/WORD_HUNT_VISUAL_PROOF_APK_ASSET_LIST.txt
          : > reports/WORD_HUNT_VISUAL_PROOF_SOURCE_ASSET_SHA256.txt
          : > reports/WORD_HUNT_VISUAL_PROOF_SOURCE_ASSET_BYTES.txt
          : > reports/WORD_HUNT_VISUAL_PROOF_PACKAGED_ASSET_SHA256.txt
          : > reports/WORD_HUNT_VISUAL_PROOF_PACKAGED_ASSET_BYTES.txt
          mkdir -p reports/packaged-assets
          for source in "${source_assets[@]}"; do
            packaged="reports/packaged-assets/${source#assets/}"
            mkdir -p "$(dirname "$packaged")"
            unzip -l reports/WORD_HUNT_VISUAL_PROOF_ANDROID16_PROOF.apk \
              | grep -F "assets/flutter_assets/$source" \
              | tee -a reports/WORD_HUNT_VISUAL_PROOF_APK_ASSET_LIST.txt
            unzip -p reports/WORD_HUNT_VISUAL_PROOF_ANDROID16_PROOF.apk \
              "assets/flutter_assets/$source" > "$packaged"
            test -s "$packaged"
            cmp -s "$source" "$packaged"
            sha256sum "$source" | tee -a reports/WORD_HUNT_VISUAL_PROOF_SOURCE_ASSET_SHA256.txt
            wc -c "$source" | tee -a reports/WORD_HUNT_VISUAL_PROOF_SOURCE_ASSET_BYTES.txt
            sha256sum "$packaged" | tee -a reports/WORD_HUNT_VISUAL_PROOF_PACKAGED_ASSET_SHA256.txt
            wc -c "$packaged" | tee -a reports/WORD_HUNT_VISUAL_PROOF_PACKAGED_ASSET_BYTES.txt
          done
          echo "SOURCE_EQUALS_PACKAGED=YES count=2" \
            | tee reports/WORD_HUNT_VISUAL_PROOF_ASSET_COMPARE.txt

      - name: Android emulator KVM erişimini hazırla
        shell: bash
        run: |
          set -euo pipefail
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
          ./android/gradlew --stop || true

      - name: Android 16 görsel kanıt (deneme 1/2)
        id: android16_visual_attempt_1
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: aosp_atd
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          emulator-boot-timeout: 1200
          disable-animations: false
          script: bash tools/run_word_hunt_android16_visual_proof.sh

      - name: İlk Android 16 görsel kanıt denemesini sınıflandır
        id: android16_visual_retry
        if: always()
        shell: bash
        env:
          FIRST_ATTEMPT_OUTCOME: ${{ steps.android16_visual_attempt_1.outcome }}
        run: |
          set -euo pipefail
          if [ "$FIRST_ATTEMPT_OUTCOME" = "success" ]; then
            echo "retry=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          app_failure_pattern='FATAL EXCEPTION|ANR in com\.leventua\.bilgirotasi|am_crash.*com\.leventua\.bilgirotasi|am_proc_died.*com\.leventua\.bilgirotasi|Process com\.leventua\.bilgirotasi .*has died|Cmdline: com\.leventua\.bilgirotasi'
          if grep -Eqi "$app_failure_pattern" \
              reports/WORD_HUNT_REUSABLE_MAP_ANDROID16_LOGCAT.txt \
              reports/WORD_HUNT_VISUAL_PROOF_LOGCAT.txt 2>/dev/null; then
            echo 'Android visual proof detected an application crash/ANR/process death; infrastructure retry is forbidden.' >&2
            exit 1
          fi

          attempt_dir='reports/word-hunt-android16-attempt-1'
          mkdir -p "$attempt_dir"
          find reports -maxdepth 1 -type f \
            \( -name 'WORD_HUNT_REUSABLE_MAP_ANDROID16*' \
               -o -name 'WORD_HUNT_VISUAL_PROOF_*' \
               -o -name 'ANDROID16_RAW.png' \) \
            -exec cp {} "$attempt_dir/" \;
          {
            echo 'RESULT=INFRASTRUCTURE_RETRY_REQUIRED'
            echo 'REASON=ANDROID_EMULATOR_OR_RENDER_PIPELINE_UNSTABLE'
          } > "$attempt_dir/WORD_HUNT_ANDROID16_RETRY_CLASSIFICATION.txt"
          echo "retry=true" >> "$GITHUB_OUTPUT"

      - name: Android 16 görsel kanıt (temiz deneme 2/2)
        id: android16_visual_attempt_2
        if: steps.android16_visual_retry.outputs.retry == 'true'
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: aosp_atd
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          emulator-boot-timeout: 1200
          disable-animations: false
          script: bash tools/run_word_hunt_android16_visual_proof.sh

      - name: Android 16 görsel kanıt kapısını sonuçlandır
        if: always()
        shell: bash
        env:
          FIRST_ATTEMPT_OUTCOME: ${{ steps.android16_visual_attempt_1.outcome }}
          RETRY_REQUIRED: ${{ steps.android16_visual_retry.outputs.retry }}
          SECOND_ATTEMPT_OUTCOME: ${{ steps.android16_visual_attempt_2.outcome }}
        run: |
          set -euo pipefail
          if [ "$RETRY_REQUIRED" = "true" ]; then
            test "$SECOND_ATTEMPT_OUTCOME" = "success"
          else
            test "$FIRST_ATTEMPT_OUTCOME" = "success"
          fi
          test -s reports/WORD_HUNT_REUSABLE_MAP_ANDROID16.png
          test -s reports/WORD_HUNT_REUSABLE_MAP_ANDROID16_ACTIVITY.txt
          test -s reports/WORD_HUNT_REUSABLE_MAP_ANDROID16_LOGCAT.txt
          test -s reports/WORD_HUNT_REUSABLE_MAP_ANDROID16_RUNTIME.txt
          test -s reports/WORD_HUNT_REUSABLE_MAP_ANDROID16_PIXEL_CHECK.txt
          test -s reports/ANDROID16_RAW.png
          test -s reports/WORD_HUNT_VISUAL_PROOF_ACTIVITY.txt
          test -s reports/WORD_HUNT_VISUAL_PROOF_LOGCAT.txt
          test -s reports/WORD_HUNT_VISUAL_PROOF_PIXEL_CHECK.txt
          grep -Fq '[WORD_HUNT_REUSABLE_MAP_PROOF_ARTWORK_READY]' \
            reports/WORD_HUNT_REUSABLE_MAP_ANDROID16_RUNTIME.txt
          grep -Fq '[WORD_HUNT_REUSABLE_MAP_PROOF_FRAME_READY]' \
            reports/WORD_HUNT_REUSABLE_MAP_ANDROID16_RUNTIME.txt
          ! grep -Fq '[WORD_HUNT_REUSABLE_MAP_PROOF_ERROR]' \
            reports/WORD_HUNT_REUSABLE_MAP_ANDROID16_RUNTIME.txt
          grep -Fq '[WORD_HUNT_VISUAL_PROOF_FRAME_READY]' \
            reports/WORD_HUNT_VISUAL_PROOF_ASSET_RUNTIME.txt
          grep -Fq 'visible_ratio=' reports/WORD_HUNT_REUSABLE_MAP_ANDROID16_PIXEL_CHECK.txt
          grep -Fq 'visible_ratio=' reports/WORD_HUNT_VISUAL_PROOF_PIXEL_CHECK.txt
          grep -Fq '[WORD_HUNT_PIXEL_PROOF_ASSET_LOADED]' \
            reports/WORD_HUNT_VISUAL_PROOF_ASSET_RUNTIME.txt
          test "$(grep -Fc '[WORD_HUNT_PIXEL_PROOF_ASSET_LOADED]' reports/WORD_HUNT_VISUAL_PROOF_ASSET_RUNTIME.txt)" -eq 2

      - name: Reusable harita gerçek Android kanıtını yükle
        uses: actions/upload-artifact@v4
        with:
          name: BilgiRotasi-KelimeAvi-ReusableMap-Android16-${{ env.PROOF_SHA }}
          path: |
            reports/WORD_HUNT_REUSABLE_MAP_ANDROID16.png
            reports/WORD_HUNT_REUSABLE_MAP_ANDROID16_ACTIVITY.txt
            reports/WORD_HUNT_REUSABLE_MAP_ANDROID16_LOGCAT.txt
            reports/WORD_HUNT_REUSABLE_MAP_ANDROID16_RUNTIME.txt
            reports/WORD_HUNT_REUSABLE_MAP_ANDROID16_HEAD_SHA.txt
            reports/WORD_HUNT_REUSABLE_MAP_ANDROID16_APK_SHA256.txt
            reports/WORD_HUNT_REUSABLE_MAP_ANDROID16_PIXEL_CHECK.txt
            reports/word-hunt-android16-attempt-1/**
          if-no-files-found: error
          retention-days: 30

      - name: MASTER ART karşılaştırma kanıtlarını üret
        shell: bash
        run: |
          set -euo pipefail
          dart run tools/compare_kelime_avi_master_art.dart \
            assets/word_hunt/baslangic_limani_master_art_visual_proof.jpg \
            reports/ANDROID16_RAW.png \
            reports
          test -s reports/REFERENCE.png
          test -s reports/ANDROID16.png
          test -s reports/SIDE_BY_SIDE.png
          test -s reports/DIFF.png
          test -s reports/pixel_geometry_metrics.json

      - name: Görsel kanıtları yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BilgiRotasi-KelimeAvi-PixelProof-${{ env.PROOF_SHA }}
          path: |
            reports/ANDROID16_RAW.png
            reports/REFERENCE.png
            reports/ANDROID16.png
            reports/SIDE_BY_SIDE.png
            reports/DIFF.png
            reports/pixel_geometry_metrics.json
            reports/WORD_HUNT_VISUAL_PROOF_ACTIVITY.txt
            reports/WORD_HUNT_VISUAL_PROOF_LOGCAT.txt
            reports/WORD_HUNT_VISUAL_PROOF_ASSET_RUNTIME.txt
            reports/WORD_HUNT_VISUAL_PROOF_HEAD_SHA.txt
            reports/WORD_HUNT_VISUAL_PROOF_APK_SHA256.txt
            reports/WORD_HUNT_VISUAL_PROOF_APK_ASSET_LIST.txt
            reports/WORD_HUNT_VISUAL_PROOF_SOURCE_ASSET_SHA256.txt
            reports/WORD_HUNT_VISUAL_PROOF_SOURCE_ASSET_BYTES.txt
            reports/WORD_HUNT_VISUAL_PROOF_PACKAGED_ASSET_SHA256.txt
            reports/WORD_HUNT_VISUAL_PROOF_PACKAGED_ASSET_BYTES.txt
            reports/WORD_HUNT_VISUAL_PROOF_ASSET_COMPARE.txt
            reports/WORD_HUNT_VISUAL_PROOF_PIXEL_CHECK.txt
            reports/WORD_HUNT_REUSABLE_MAP_ANDROID16_ACTIVITY.txt
            reports/WORD_HUNT_REUSABLE_MAP_ANDROID16_LOGCAT.txt
            reports/WORD_HUNT_REUSABLE_MAP_ANDROID16_RUNTIME.txt
            reports/WORD_HUNT_REUSABLE_MAP_ANDROID16_LAUNCH.txt
            reports/word-hunt-android16-attempt-1/**
          if-no-files-found: error
          retention-days: 30
