name: AdMob PR doğrulaması

# Temporary Actions budget freeze through 2026-09-01.
# Run manually only when this expensive release APK + Android 16 validation is required.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build-launch:
    name: Test, release APK ve Android 16 cold-start
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v7

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Flutter kur
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.6"
          channel: stable
          cache: true

      - name: Bağımlılık grafiğini kaydet
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          flutter pub get
          flutter pub deps --style=compact \
            | tee reports/ADMOB_DEPENDENCIES.txt
          grep -Fq "google_mobile_ads 9.0.0" \
            reports/ADMOB_DEPENDENCIES.txt
          grep -Fq "path_provider_android 2.3.1" \
            reports/ADMOB_DEPENDENCIES.txt
          grep -Fq "jni_flutter 1.0.1" \
            reports/ADMOB_DEPENDENCIES.txt

      - name: Analiz ve tüm testler
        shell: bash
        run: |
          set -euo pipefail
          flutter analyze --no-fatal-warnings --no-fatal-infos
          flutter test --concurrency=1 --reporter expanded
          flutter test \
            --dart-define=ADMOB_ENVIRONMENT=production \
            test/admob_id_profile_test.dart
          git diff --check

      - name: Kalıcı Android imzasını hazırla
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"

          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode \
            > android/app/bilgi_rotasi_upload.jks

          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=bilgi_rotasi_upload.jks
          EOF

          chmod 600 \
            android/app/bilgi_rotasi_upload.jks \
            android/key.properties

          test -s android/app/bilgi_rotasi_upload.jks
          test -s android/key.properties

      - name: Test reklam kimlikli release APK üret
        env:
          ORG_GRADLE_PROJECT_ADMOB_ENVIRONMENT: test
        run: >-
          flutter build apk --release
          --dart-define=ADMOB_ENVIRONMENT=test

      - name: Paket ve birleşik manifesti doğrula
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          AAPT2="$(find "$SDK_ROOT/build-tools" -type f -name aapt2 \
            | sort -V | tail -n 1)"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner \
            | sort -V | tail -n 1)"

          test -f "$APK"
          test -x "$AAPT2"
          test -x "$APKSIGNER"
          "$AAPT2" dump badging "$APK" \
            | tee reports/ADMOB_APK_BADGING.txt
          "$AAPT2" dump xmltree --file AndroidManifest.xml "$APK" \
            | tee reports/ADMOB_APK_MANIFEST.txt

          grep -Fq "package: name='com.leventua.bilgirotasi'" \
            reports/ADMOB_APK_BADGING.txt
          grep -Fq "versionCode='96'" reports/ADMOB_APK_BADGING.txt
          grep -Fq "versionName='1.68.6'" reports/ADMOB_APK_BADGING.txt
          grep -Fq "com.google.android.gms.ads.APPLICATION_ID" \
            reports/ADMOB_APK_MANIFEST.txt
          grep -Fq "ca-app-pub-3940256099942544~3347511713" \
            reports/ADMOB_APK_MANIFEST.txt
          ! grep -Fq "ca-app-pub-7452194004008791~7046504043" \
            reports/ADMOB_APK_MANIFEST.txt
          grep -Fq "com.google.android.gms.ads.MobileAdsInitProvider" \
            reports/ADMOB_APK_MANIFEST.txt
          sha256sum "$APK" | tee reports/ADMOB_APK_SHA256.txt

          CERT_OUTPUT="$("$APKSIGNER" verify --print-certs "$APK")"
          printf '%s\n' "$CERT_OUTPUT" \
            | tee reports/ADMOB_APK_CERTIFICATE.txt
          ACTUAL_SHA1="$(
            printf '%s\n' "$CERT_OUTPUT" \
              | awk -F': ' \
                '/certificate SHA-1 digest/ {print $NF; exit}' \
              | tr '[:lower:]' '[:upper:]' \
              | tr -d '[:space:]:'
          )"
          EXPECTED_SHA1="000EE43F410ABC6B4F634C4F716D76EB19084115"
          test "$ACTUAL_SHA1" = "$EXPECTED_SHA1"

          (cd android && ./gradlew app:dependencies \
            --configuration releaseRuntimeClasspath) \
            | tee reports/ADMOB_ANDROID_DEPENDENCIES.txt
          grep -Fq "androidx.work:work-runtime:2.7.0 -> 2.11.2" \
            reports/ADMOB_ANDROID_DEPENDENCIES.txt

      - name: Emulator için derleme kaynaklarını bırak
        shell: bash
        run: |
          set -euo pipefail
          (cd android && ./gradlew --stop)

      - name: Android 16 emulator cold-start
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: aosp_atd
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          emulator-boot-timeout: 1200
          disable-animations: true
          script: |
            adb install -r build/app/outputs/flutter-apk/app-release.apk
            adb logcat -c
            adb shell am force-stop com.leventua.bilgirotasi
            adb shell am start -W -n com.leventua.bilgirotasi/.MainActivity
            sleep 25
            adb logcat -d > reports/ADMOB_ANDROID16_COLD_START_LOG.txt
            grep -Ei 'com\.leventua\.bilgirotasi|AndroidRuntime|FATAL EXCEPTION|MobileAdsInitProvider|Missing application ID|WorkManager|WorkDatabase|WM-|SQLite|Room' reports/ADMOB_ANDROID16_COLD_START_LOG.txt | tail -n 600 || true
            adb shell dumpsys activity activities | grep -F com.leventua.bilgirotasi || true
            test -n "$(adb shell pidof com.leventua.bilgirotasi | tr -d '\r')"
            ! grep -Eqi 'FATAL EXCEPTION|AndroidRuntime.*FATAL|Missing application ID|MobileAdsInitProvider.*IllegalStateException' reports/ADMOB_ANDROID16_COLD_START_LOG.txt
            adb shell dumpsys activity activities | grep -F com.leventua.bilgirotasi
