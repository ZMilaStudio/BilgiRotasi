name: AdMob PR doğrulaması

on:
  push:
    branches:
      - codex/admob-safe-integration
      - codex/admob-production-ids
      - update/closed-test-next-release
    paths-ignore:
      - 'docs/project-memory/**'
  pull_request:
    branches:
      - main
      - codex/admob-safe-integration
      - release/final-closed-test-aab-1.68.8
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build-launch:
    name: Test, release APK ve Android 16 cold-start
    if: >-
      ${{ !(github.event_name == 'pull_request' &&
        github.event.pull_request.number == 224 &&
        github.repository == 'ZMilaStudio/BilgiRotasi' &&
        github.event.pull_request.base.ref == 'release/final-closed-test-aab-1.68.8' &&
        github.event.pull_request.head.ref == 'feat/kelime-avi-harbor-repair-checkpoint-a') &&
        !(github.event_name == 'pull_request' &&
        github.repository == 'ZMilaStudio/BilgiRotasi' &&
        github.event.pull_request.base.ref == 'release/final-closed-test-aab-1.68.8' &&
        github.event.pull_request.head.ref == 'feat/kelime-avi-checkpoint-b-pilot-sky-unlock') &&
        !(github.event_name == 'pull_request' &&
        github.repository == 'ZMilaStudio/BilgiRotasi' &&
        github.event.pull_request.base.ref == 'release/final-closed-test-aab-1.68.8' &&
        github.event.pull_request.head.ref == 'fix/kelime-avi-versioncode-2') &&
        !(github.event_name == 'pull_request' &&
        github.repository == 'ZMilaStudio/BilgiRotasi' &&
        github.event.pull_request.base.ref == 'release/final-closed-test-aab-1.68.8' &&
        github.event.pull_request.head.ref == 'feat/kelime-avi-checkpoint-c-fener-burnu') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Flutter kur
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.6"
          channel: stable
          cache: true

      - name: Sürümü pubspec.yaml dosyasından oku
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -nE 's/^version:[[:space:]]*([^[:space:]]+).*$/\1/p' pubspec.yaml)"
          test -n "$VERSION"
          VERSION_NAME="${VERSION%%+*}"
          VERSION_CODE="${VERSION##*+}"
          test "$VERSION_NAME" != "$VERSION"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_LABEL=${VERSION_NAME}-${VERSION_CODE}" >> "$GITHUB_ENV"

      - name: Bağımlılık grafiğini kaydet
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          flutter pub get
          flutter pub deps --style=compact \
            | tee reports/ADMOB_DEPENDENCIES.txt
          grep -Fq "google_mobile_ads 9.0.0" \
            reports/ADMOB_DEPENDENCIES.txt
          grep -Fq "path_provider_android 2.3.1" \
            reports/ADMOB_DEPENDENCIES.txt
          grep -Fq "jni_flutter 1.0.1" \
            reports/ADMOB_DEPENDENCIES.txt
          grep -Fq "firebase_messaging 16.4.3" \
            reports/ADMOB_DEPENDENCIES.txt

      - name: Analiz ve tüm testler
        shell: bash
        run: |
          set -euo pipefail
          flutter analyze --no-fatal-warnings --no-fatal-infos
          flutter test --concurrency=1 --reporter expanded
          flutter test \
            --dart-define=ADMOB_ENVIRONMENT=production \
            test/admob_id_profile_test.dart
          flutter test \
            --dart-define=PUSH_ENVIRONMENT=closed_test \
            --dart-define=EXPECT_PUSH_ENVIRONMENT=closed_test \
            test/push_notification_profile_test.dart
          flutter test \
            --dart-define=PUSH_ENVIRONMENT=production \
            --dart-define=EXPECT_PUSH_ENVIRONMENT=production \
            test/push_notification_profile_test.dart
          git diff --check

      - name: Kalıcı Android imzasını hazırla
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"

          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode \
            > android/app/bilgi_rotasi_upload.jks

          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=bilgi_rotasi_upload.jks
          EOF

          chmod 600 \
            android/app/bilgi_rotasi_upload.jks \
            android/key.properties

          test -s android/app/bilgi_rotasi_upload.jks
          test -s android/key.properties

      - name: Test reklam kimlikli release APK üret
        env:
          ORG_GRADLE_PROJECT_ADMOB_ENVIRONMENT: test
        run: >-
          flutter build apk --release
          --dart-define=ADMOB_ENVIRONMENT=test

      - name: Paket ve birleşik manifesti doğrula
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          AAPT2="$(find "$SDK_ROOT/build-tools" -type f -name aapt2 \
            | sort -V | tail -n 1)"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner \
            | sort -V | tail -n 1)"

          test -f "$APK"
          test -x "$AAPT2"
          test -x "$APKSIGNER"
          "$AAPT2" dump badging "$APK" \
            | tee reports/ADMOB_APK_BADGING.txt
          "$AAPT2" dump xmltree --file AndroidManifest.xml "$APK" \
            | tee reports/ADMOB_APK_MANIFEST.txt

          grep -Fq "package: name='com.leventua.bilgirotasi'" \
            reports/ADMOB_APK_BADGING.txt
          grep -Fq "versionCode='$VERSION_CODE'" reports/ADMOB_APK_BADGING.txt
          grep -Fq "versionName='$VERSION_NAME'" reports/ADMOB_APK_BADGING.txt
          grep -Fq "com.google.android.gms.ads.APPLICATION_ID" \
            reports/ADMOB_APK_MANIFEST.txt
          grep -Fq "ca-app-pub-3940256099942544~3347511713" \
            reports/ADMOB_APK_MANIFEST.txt
          ! grep -Fq "ca-app-pub-7452194004008791~7046504043" \
            reports/ADMOB_APK_MANIFEST.txt
          grep -Fq "com.google.android.gms.ads.MobileAdsInitProvider" \
            reports/ADMOB_APK_MANIFEST.txt
          grep -Fq "android.permission.POST_NOTIFICATIONS" \
            reports/ADMOB_APK_MANIFEST.txt
          grep -Fq "firebase_messaging_auto_init_enabled" \
            reports/ADMOB_APK_MANIFEST.txt
          grep -Fq "com.google.firebase.messaging.FirebaseMessagingService" \
            reports/ADMOB_APK_MANIFEST.txt
          sha256sum "$APK" | tee reports/ADMOB_APK_SHA256.txt

          CERT_OUTPUT="$("$APKSIGNER" verify --print-certs "$APK")"
          printf '%s\n' "$CERT_OUTPUT" \
            | tee reports/ADMOB_APK_CERTIFICATE.txt
          ACTUAL_SHA1="$(
            printf '%s\n' "$CERT_OUTPUT" \
              | awk -F': ' \
                '/certificate SHA-1 digest/ {print $NF; exit}' \
              | tr '[:lower:]' '[:upper:]' \
              | tr -d '[:space:]:'
          )"
          EXPECTED_SHA1="000EE43F410ABC6B4F634C4F716D76EB19084115"
          test "$ACTUAL_SHA1" = "$EXPECTED_SHA1"

          (cd android && ./gradlew app:dependencies \
            --configuration releaseRuntimeClasspath) \
            | tee reports/ADMOB_ANDROID_DEPENDENCIES.txt
          grep -Fq "androidx.work:work-runtime:2.7.0 -> 2.11.2" \
            reports/ADMOB_ANDROID_DEPENDENCIES.txt

      - name: Emulator için derleme kaynaklarını bırak
        shell: bash
        run: |
          set -euo pipefail
          (cd android && ./gradlew --stop)

      - name: Android emulator KVM erişimini hazırla
        shell: bash
        run: |
          set -euo pipefail
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm

      - name: Android 16 emulator cold-start (deneme 1/2)
        id: android16_attempt_1
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: aosp_atd
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          emulator-boot-timeout: 1200
          disable-animations: false
          script: |
            bash tools/validate_admob_android16_cold_start.sh

      - name: İlk AdMob Android 16 denemesini sınıflandır
        id: android16_retry
        if: always()
        shell: bash
        env:
          FIRST_ATTEMPT_OUTCOME: ${{ steps.android16_attempt_1.outcome }}
        run: |
          set -euo pipefail
          if [ "$FIRST_ATTEMPT_OUTCOME" = "success" ]; then
            echo "retry=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if grep -Fqx 'REASON=APPLICATION_CRASH_ANR_FATAL_OR_PROCESS_DEATH' \
              reports/ADMOB_ANDROID16_VALIDATION_RESULT.txt 2>/dev/null; then
            echo "Application failure cannot be retried as emulator infrastructure." >&2
            exit 1
          fi
          if ! grep -Fxq 'EMULATOR_HEALTH=UNHEALTHY' \
              reports/ADMOB_ANDROID16_EMULATOR_HEALTH.txt 2>/dev/null \
              || ! grep -Fxq 'RESULT=INFRASTRUCTURE_RETRY_REQUIRED' \
                reports/ADMOB_ANDROID16_VALIDATION_RESULT.txt 2>/dev/null \
              || ! grep -Fxq 'RELEASE_GATE=FAIL' \
                reports/ADMOB_ANDROID16_VALIDATION_RESULT.txt 2>/dev/null; then
            echo "The first Android 16 attempt failed without explicit infrastructure evidence." >&2
            test ! -s reports/ADMOB_ANDROID16_VALIDATION_RESULT.txt \
              || cat reports/ADMOB_ANDROID16_VALIDATION_RESULT.txt >&2
            exit 1
          fi

          attempt_dir="reports/admob-android16-attempt-1"
          mkdir -p "$attempt_dir"
          find reports -maxdepth 1 -type f -name 'ADMOB_ANDROID16_*' \
            -exec cp {} "$attempt_dir/" \;
          echo "retry=true" >> "$GITHUB_OUTPUT"

      - name: Android 16 emulator cold-start (temiz deneme 2/2)
        id: android16_attempt_2
        if: steps.android16_retry.outputs.retry == 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: aosp_atd
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          emulator-boot-timeout: 1200
          disable-animations: false
          script: |
            bash tools/validate_admob_android16_cold_start.sh

      - name: AdMob Android 16 uygulama kapısını sonuçlandır
        if: always()
        shell: bash
        env:
          FIRST_ATTEMPT_OUTCOME: ${{ steps.android16_attempt_1.outcome }}
          RETRY_REQUIRED: ${{ steps.android16_retry.outputs.retry }}
          SECOND_ATTEMPT_OUTCOME: ${{ steps.android16_attempt_2.outcome }}
        run: |
          set -euo pipefail
          if [ "$RETRY_REQUIRED" = "true" ]; then
            test "$SECOND_ATTEMPT_OUTCOME" = "success"
          else
            test "$FIRST_ATTEMPT_OUTCOME" = "success"
          fi
          for required_gate in \
            APK_INSTALL=PASS \
            APP_LAUNCH=PASS \
            APP_PID=PASS \
            APP_ACTIVITY=PASS \
            APP_LOGCAT=PASS \
            APP_GATE=PASS; do
            grep -Fxq "$required_gate" reports/ADMOB_ANDROID16_APP_GATE.txt
          done
          grep -Fxq 'RELEASE_GATE=PASS' \
            reports/ADMOB_ANDROID16_VALIDATION_RESULT.txt
          grep -Fxq 'APP_GATE=PASS' \
            reports/ADMOB_ANDROID16_VALIDATION_RESULT.txt
          ! grep -Fqx 'REASON=APPLICATION_CRASH_ANR_FATAL_OR_PROCESS_DEATH' \
            reports/ADMOB_ANDROID16_VALIDATION_RESULT.txt

      - name: APK ve kanıt raporlarını yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BilgiRotasi-AdMob-${{ env.VERSION_LABEL }}-kanitlari
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            reports/ADMOB_DEPENDENCIES.txt
            reports/ADMOB_ANDROID_DEPENDENCIES.txt
            reports/ADMOB_APK_BADGING.txt
            reports/ADMOB_APK_MANIFEST.txt
            reports/ADMOB_APK_SHA256.txt
            reports/ADMOB_APK_CERTIFICATE.txt
            reports/ADMOB_ANDROID16_COLD_START_LOG.txt
            reports/ADMOB_ANDROID16_*
            reports/admob-android16-attempt-1/**
          if-no-files-found: warn
          retention-days: 21
