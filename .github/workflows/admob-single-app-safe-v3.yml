name: Bilgi Rotası tek APK güvenli AdMob testi V3

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/admob-single-app-safe-v3.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-smoke-test:
    name: Tek APK derle ve açılışını doğrula
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Flutter kur
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.7"
          channel: stable
          cache: true

      - name: Güncel çalışan koda reklamları güvenli biçimde yeniden uygula
        shell: bash
        run: |
          set -euo pipefail

          WORK_DIR="$RUNNER_TEMP/bilgi_rotasi_single_admob"
          rm -rf "$WORK_DIR"
          git worktree add --detach "$WORK_DIR" "$GITHUB_SHA"
          cd "$WORK_DIR"

          RECOVERY_SHA="$(
            git log \
              --all \
              --grep='Acil reklam geri alma ve uygulama kurtarma V2' \
              -n 1 \
              --format='%H'
          )"

          if [ -z "$RECOVERY_SHA" ]; then
            echo "Reklam geri alma commit'i bulunamadı."
            exit 1
          fi

          git revert --no-commit "$RECOVERY_SHA"

          python3 - <<'PY'
          from pathlib import Path
          import shutil

          pubspec_path = Path("pubspec.yaml")
          pubspec = pubspec_path.read_text(encoding="utf-8")

          old_plugin = (
              "  bilgi_rotasi_admob_config:\n"
              "    path: lib/admob_config_plugin\n"
          )
          if old_plugin not in pubspec:
              raise SystemExit(
                  "Eski yerel AdMob eklentisi pubspec içinde bulunamadı."
              )
          pubspec = pubspec.replace(old_plugin, "", 1)

          old_ads = "  google_mobile_ads: ^9.0.0\n"
          new_ads = "  google_mobile_ads: 8.0.0\n"
          if old_ads not in pubspec:
              raise SystemExit(
                  "Google Mobile Ads 9.0.0 bağımlılığı bulunamadı."
              )
          pubspec = pubspec.replace(old_ads, new_ads, 1)

          if "version: 1.67.0+88" not in pubspec:
              raise SystemExit("Reklam sürümü pubspec içinde bulunamadı.")
          pubspec = pubspec.replace(
              "version: 1.67.0+88",
              "version: 1.67.3+91",
              1,
          )
          pubspec_path.write_text(pubspec, encoding="utf-8")

          shutil.rmtree("lib/admob_config_plugin", ignore_errors=True)

          main_path = Path("lib/main.dart")
          main = main_path.read_text(encoding="utf-8")
          eager_init = (
              "\n  unawaited(AdMonetizationService.initialize());\n"
          )
          if eager_init not in main:
              raise SystemExit(
                  "Açılıştaki erken reklam başlatma satırı bulunamadı."
              )
          main = main.replace(eager_init, "\n", 1)
          main_path.write_text(main, encoding="utf-8")

          info_path = Path("lib/app_build_info.dart")
          info = info_path.read_text(encoding="utf-8")
          replacements = [
              (
                  "static const String versionName = '1.67.0';",
                  "static const String versionName = '1.67.3';",
              ),
              (
                  "static const int buildNumber = 88;",
                  "static const int buildNumber = 91;",
              ),
          ]
          for old, new in replacements:
              if old not in info:
                  raise SystemExit(
                      f"Uygulama sürüm satırı bulunamadı: {old}"
                  )
              info = info.replace(old, new, 1)
          info_path.write_text(info, encoding="utf-8")

          gate_path = Path("tools/rc1_quality_gate.py")
          gate = gate_path.read_text(encoding="utf-8")
          old_gate = 'EXPECTED_VERSION = "1.67.0+88"'
          new_gate = 'EXPECTED_VERSION = "1.67.3+91"'
          if old_gate not in gate:
              raise SystemExit("Kalite kapısı sürüm satırı bulunamadı.")
          gate = gate.replace(old_gate, new_gate, 1)
          gate_path.write_text(gate, encoding="utf-8")

          test_path = Path("test/ad_monetization_test.dart")
          test_text = test_path.read_text(encoding="utf-8")
          import re
          pattern = re.compile(
              r"\n    test\('yerel Android eklentisi "
              r"test uygulama kimliğini taşır', \(\) \{"
              r".*?\n    \}\);\n",
              re.DOTALL,
          )
          replacement = (
              "\n    test('AdMob SDK ve test kimlikleri güvenli yapılandırılır', () {\n"
              "      final pubspec = File('pubspec.yaml').readAsStringSync();\n"
              "      final mainSource = File('lib/main.dart').readAsStringSync();\n"
              "\n"
              "      expect(pubspec, contains('google_mobile_ads:'));\n"
              "      expect(\n"
              "        pubspec,\n"
              "        isNot(contains('bilgi_rotasi_admob_config:')),\n"
              "      );\n"
              "      expect(\n"
              "        mainSource,\n"
              "        isNot(\n"
              "          contains(\n"
              "            'unawaited(AdMonetizationService.initialize());',\n"
              "          ),\n"
              "        ),\n"
              "      );\n"
              "    });\n"
          )
          test_text, test_count = pattern.subn(
              replacement,
              test_text,
              count=1,
          )
          if test_count != 1:
              raise SystemExit(
                  "Eski yerel eklenti testi bulunamadı veya birden fazla bulundu."
              )
          test_path.write_text(test_text, encoding="utf-8")

          required = [
              Path("lib/ad_monetization.dart"),
              Path("test/ad_monetization_test.dart"),
              Path("assets/questions.json"),
          ]
          missing = [str(path) for path in required if not path.exists()]
          if missing:
              raise SystemExit(
                  "Reklam kaynakları eksik: " + ", ".join(missing)
              )

          checks = {
              "pubspec": "google_mobile_ads:",
              "main": "part 'ad_monetization.dart';",
              "ads": "class AdBannerSlot",
              "reward": "AdMonetizationService.showRewarded()",
          }
          sources = {
              "pubspec": pubspec,
              "main": main,
              "ads": Path(
                  "lib/ad_monetization.dart"
              ).read_text(encoding="utf-8"),
              "reward": main,
          }
          for label, needle in checks.items():
              if needle not in sources[label]:
                  raise SystemExit(
                      f"Reklam doğrulaması eksik ({label}): {needle}"
                  )
          PY

          rm -f pubspec.lock
          flutter pub get

          flutter pub deps --style=compact > /tmp/admob_pub_deps.txt
          cat /tmp/admob_pub_deps.txt

          grep -Fq "google_mobile_ads 8.0.0" /tmp/admob_pub_deps.txt

          if grep -Eq '(^|[[:space:]])jni[[:space:]]' /tmp/admob_pub_deps.txt; then
            echo "Beklenmeyen jni bağımlılığı hâlâ çözüm ağacında."
            exit 1
          fi

          dart format \
            lib/main.dart \
            lib/ad_monetization.dart \
            lib/app_build_info.dart \
            lib/xp_progression.dart \
            lib/gameplay_boost.dart \
            lib/live_duel_screen.dart \
            lib/live_duel_leaderboard.dart \
            lib/live_duel_play_screen.dart \
            test/ad_monetization_test.dart

          flutter analyze \
            --no-fatal-warnings \
            --no-fatal-infos

          flutter test \
            --concurrency=1 \
            --reporter expanded

          python3 tools/rc1_quality_gate.py
          git diff --check

      - name: Normal Bilgi Rotası Android projesini oluştur
        shell: bash
        run: |
          set -euo pipefail

          WORK_DIR="$RUNNER_TEMP/bilgi_rotasi_single_admob"
          cd "$WORK_DIR"

          rm -rf .flutter_build

          flutter create \
            --platforms=android \
            --org com.leventua \
            --project-name bilgirotasi \
            .flutter_build

          rm -rf .flutter_build/lib
          cp -R lib .flutter_build/lib

          rm -rf .flutter_build/assets
          cp -R assets .flutter_build/assets

          cp pubspec.yaml .flutter_build/pubspec.yaml

          if [ -f pubspec.lock ]; then
            cp pubspec.lock .flutter_build/pubspec.lock
          fi

          if [ -f analysis_options.yaml ]; then
            cp analysis_options.yaml \
              .flutter_build/analysis_options.yaml
          fi

          cp firebase/google-services.json \
            .flutter_build/android/app/google-services.json

      - name: Firebase, paket adı ve AdMob manifestini hazırla
        shell: bash
        run: |
          set -euo pipefail

          WORK_DIR="$RUNNER_TEMP/bilgi_rotasi_single_admob"
          cd "$WORK_DIR/.flutter_build"

          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          package_id = "com.leventua.bilgirotasi"
          admob_test_app_id = (
              "ca-app-pub-3940256099942544~3347511713"
          )

          config_path = Path("android/app/google-services.json")
          config = json.loads(
              config_path.read_text(encoding="utf-8")
          )
          firebase_package = (
              config["client"][0]["client_info"]
              ["android_client_info"]["package_name"]
          )
          if firebase_package != package_id:
              raise SystemExit(
                  "Firebase paket adı uyuşmuyor: "
                  + firebase_package
              )

          settings = Path("android/settings.gradle.kts")
          settings_text = settings.read_text(encoding="utf-8")
          plugin_line = (
              '    id("com.google.gms.google-services") '
              'version "4.5.0" apply false\n'
          )
          if "com.google.gms.google-services" not in settings_text:
              settings_text = settings_text.replace(
                  "plugins {\n",
                  "plugins {\n" + plugin_line,
                  1,
              )
          settings.write_text(settings_text, encoding="utf-8")

          # AGP 9 yerleşik Kotlin, jni 1.0.1 Android betiğiyle
          # uyumsuz. Android'in resmî geçici uyumluluk ayarları.
          properties = Path("android/gradle.properties")
          properties_text = properties.read_text(encoding="utf-8")
          compatibility_lines = [
              "android.builtInKotlin=false",
              "android.newDsl=false",
          ]
          for line in compatibility_lines:
              if line not in properties_text:
                  properties_text += "\n" + line
          properties.write_text(
              properties_text.rstrip() + "\n",
              encoding="utf-8",
          )

          if "org.jetbrains.kotlin.android" not in settings_text:
              raise SystemExit(
                  "Kotlin Android eklentisi settings.gradle.kts içinde yok."
              )

          gradle = Path("android/app/build.gradle.kts")
          gradle_text = gradle.read_text(encoding="utf-8")

          if "com.google.gms.google-services" not in gradle_text:
              gradle_text = gradle_text.replace(
                  "plugins {\n",
                  'plugins {\n'
                  '    id("com.google.gms.google-services")\n',
                  1,
              )

          gradle_text = gradle_text.replace(
              "minSdk = flutter.minSdkVersion",
              "minSdk = 23",
              1,
          )
          gradle_text, namespace_count = re.subn(
              r'namespace\s*=\s*"[^"]+"',
              f'namespace = "{package_id}"',
              gradle_text,
              count=1,
          )
          gradle_text, app_id_count = re.subn(
              r'applicationId\s*=\s*"[^"]+"',
              f'applicationId = "{package_id}"',
              gradle_text,
              count=1,
          )
          if namespace_count != 1 or app_id_count != 1:
              raise SystemExit(
                  "Normal paket kimliği Gradle dosyasına yazılamadı."
              )
          gradle.write_text(gradle_text, encoding="utf-8")

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )
          manifest_text = manifest.read_text(encoding="utf-8")

          if "android.permission.INTERNET" not in manifest_text:
              manifest_text, count = re.subn(
                  r"(<manifest\b[^>]*>)",
                  (
                      r'\1\n    <uses-permission '
                      r'android:name="android.permission.INTERNET" />'
                  ),
                  manifest_text,
                  count=1,
              )
              if count != 1:
                  raise SystemExit(
                      "Android manifest kökü bulunamadı."
                  )

          manifest_text, label_count = re.subn(
              r'android:label="[^"]*"',
              'android:label="Bilgi Rotası"',
              manifest_text,
              count=1,
          )
          if label_count != 1:
              raise SystemExit(
                  "Android uygulama etiketi bulunamadı."
              )

          if "com.google.android.gms.ads.APPLICATION_ID" in manifest_text:
              raise SystemExit(
                  "Manifestte beklenmeyen eski AdMob kimliği var."
              )

          application = re.search(
              r"<application\b[^>]*>",
              manifest_text,
              re.DOTALL,
          )
          if application is None:
              raise SystemExit(
                  "Android application etiketi bulunamadı."
              )

          metadata = (
              "\n        <meta-data\n"
              '            android:name='
              '"com.google.android.gms.ads.APPLICATION_ID"\n'
              f'            android:value="{admob_test_app_id}" />\n'
          )
          manifest_text = (
              manifest_text[: application.end()]
              + metadata
              + manifest_text[application.end() :]
          )
          manifest.write_text(manifest_text, encoding="utf-8")

          required_gradle = [
              f'namespace = "{package_id}"',
              f'applicationId = "{package_id}"',
              "minSdk = 23",
              "com.google.gms.google-services",
          ]
          required_properties = [
              "android.builtInKotlin=false",
              "android.newDsl=false",
          ]
          properties_text = Path(
              "android/gradle.properties"
          ).read_text(encoding="utf-8")
          missing_properties = [
              item
              for item in required_properties
              if item not in properties_text
          ]
          if missing_properties:
              raise SystemExit(
                  "AGP 9 uyumluluk ayarları eksik: "
                  + ", ".join(missing_properties)
              )
          missing_gradle = [
              item
              for item in required_gradle
              if item not in gradle_text
          ]
          if missing_gradle:
              raise SystemExit(
                  "Gradle yapılandırması eksik: "
                  + ", ".join(missing_gradle)
              )

          required_manifest = [
              "Bilgi Rotası",
              "com.google.android.gms.ads.APPLICATION_ID",
              admob_test_app_id,
              "android.permission.INTERNET",
          ]
          missing_manifest = [
              item
              for item in required_manifest
              if item not in manifest_text
          ]
          if missing_manifest:
              raise SystemExit(
                  "Manifest yapılandırması eksik: "
                  + ", ".join(missing_manifest)
              )
          PY

      - name: Kalıcı Android imzasını hazırla
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          WORK_DIR="$RUNNER_TEMP/bilgi_rotasi_single_admob"
          cd "$WORK_DIR/.flutter_build"

          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"

          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode \
            > android/app/bilgi_rotasi_upload.jks

          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=bilgi_rotasi_upload.jks
          EOF

          chmod 600 \
            android/app/bilgi_rotasi_upload.jks \
            android/key.properties

          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle.kts")
          text = path.read_text(encoding="utf-8")

          imports = (
              "import java.io.FileInputStream\n"
              "import java.util.Properties\n\n"
          )
          if "import java.util.Properties" not in text:
              text = imports + text

          android_anchor = "\nandroid {\n"
          properties_block = """
          val keystoreProperties = Properties()
          val keystorePropertiesFile =
              rootProject.file("key.properties")
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(
                  FileInputStream(keystorePropertiesFile)
              )
          }
          """.strip() + "\n"

          if "val keystoreProperties = Properties()" not in text:
              if text.count(android_anchor) != 1:
                  raise SystemExit(
                      "Gradle android bloğu bulunamadı."
                  )
              text = text.replace(
                  android_anchor,
                  "\n" + properties_block + android_anchor,
                  1,
              )

          default_anchor = "    defaultConfig {\n"
          signing_block = """
              signingConfigs {
                  create("release") {
                      keyAlias =
                          keystoreProperties["keyAlias"] as String
                      keyPassword =
                          keystoreProperties["keyPassword"] as String
                      storeFile =
                          keystoreProperties["storeFile"]
                              ?.let { file(it) }
                      storePassword =
                          keystoreProperties["storePassword"] as String
                  }
              }

          """.replace("          ", "", 1)

          if 'create("release")' not in text:
              if text.count(default_anchor) != 1:
                  raise SystemExit(
                      "Gradle defaultConfig bloğu bulunamadı."
                  )
              text = text.replace(
                  default_anchor,
                  signing_block + default_anchor,
                  1,
              )

          debug_line = (
              'signingConfig = '
              'signingConfigs.getByName("debug")'
          )
          release_line = (
              'signingConfig = '
              'signingConfigs.getByName("release")'
          )

          if release_line not in text:
              if text.count(debug_line) != 1:
                  raise SystemExit(
                      "Release imza satırı bulunamadı."
                  )
              text = text.replace(
                  debug_line,
                  release_line,
                  1,
              )

          path.write_text(text, encoding="utf-8")
          PY

      - name: Normal imzalı reklamlı APK'yı oluştur
        shell: bash
        run: |
          set -euo pipefail

          WORK_DIR="$RUNNER_TEMP/bilgi_rotasi_single_admob"
          cd "$WORK_DIR/.flutter_build"

          flutter pub get
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create
          flutter build apk --release

          SOURCE_APK="build/app/outputs/flutter-apk/app-release.apk"
          test -f "$SOURCE_APK"

          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$SOURCE_APK" \
            "$GITHUB_WORKSPACE/dist/BilgiRotasi-AdMob-Tek-APK-V3-1.67.3-91.apk"

      - name: APK paketini, manifesti ve imzayı doğrula
        shell: bash
        run: |
          set -euo pipefail

          APK="dist/BilgiRotasi-AdMob-Tek-APK-V3-1.67.3-91.apk"
          test -f "$APK"

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT"

          APKSIGNER="$(
            find "$SDK_ROOT/build-tools" \
              -type f \
              -name apksigner \
              | sort -V \
              | tail -n 1
          )"
          test -n "$APKSIGNER"

          CERT_OUTPUT="$("$APKSIGNER" verify --print-certs "$APK")"
          printf '%s\n' "$CERT_OUTPUT"

          ACTUAL_SHA1="$(
            printf '%s\n' "$CERT_OUTPUT" \
              | awk -F': ' \
                '/certificate SHA-1 digest/ {print $NF; exit}' \
              | tr '[:lower:]' '[:upper:]' \
              | tr -d '[:space:]:'
          )"
          EXPECTED_SHA1="000EE43F410ABC6B4F634C4F716D76EB19084115"
          test "$ACTUAL_SHA1" = "$EXPECTED_SHA1"

          APKANALYZER="$(command -v apkanalyzer || true)"
          test -n "$APKANALYZER"

          ACTUAL_PACKAGE="$(
            "$APKANALYZER" manifest application-id "$APK"
          )"
          test "$ACTUAL_PACKAGE" = "com.leventua.bilgirotasi"

          mkdir -p reports

          "$APKANALYZER" manifest print "$APK" \
            > reports/ADMOB_APK_MANIFEST.txt

          grep -Fq \
            "com.google.android.gms.ads.APPLICATION_ID" \
            reports/ADMOB_APK_MANIFEST.txt

          grep -Fq \
            "ca-app-pub-3940256099942544~3347511713" \
            reports/ADMOB_APK_MANIFEST.txt

          sha256sum "$APK" \
            | tee reports/ADMOB_SINGLE_APK_SHA256.txt

      - name: APK'yı Android emülatöründe kur ve aç
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -euo pipefail

            APK="$GITHUB_WORKSPACE/dist/BilgiRotasi-AdMob-Tek-APK-V3-1.67.3-91.apk"
            PACKAGE="com.leventua.bilgirotasi"

            adb install -r "$APK"
            adb logcat -c

            adb shell monkey \
              -p "$PACKAGE" \
              -c android.intent.category.LAUNCHER \
              1

            sleep 20

            PID="$(adb shell pidof "$PACKAGE" | tr -d '\r')"
            if [ -z "$PID" ]; then
              echo "Uygulama emülatörde kapandı."
              adb logcat -d
              exit 1
            fi

            mkdir -p "$GITHUB_WORKSPACE/reports"

            adb logcat -d \
              > "$GITHUB_WORKSPACE/reports/ADMOB_ANDROID_LAUNCH_LOG.txt"

            if grep -Eqi \
              "FATAL EXCEPTION|AndroidRuntime.*FATAL|The Google Mobile Ads SDK was initialized incorrectly|MobileAdsInitProvider.*IllegalStateException" \
              "$GITHUB_WORKSPACE/reports/ADMOB_ANDROID_LAUNCH_LOG.txt"; then
              echo "Android açılış günlüğünde kritik hata bulundu."
              cat "$GITHUB_WORKSPACE/reports/ADMOB_ANDROID_LAUNCH_LOG.txt"
              exit 1
            fi

            adb shell dumpsys activity activities \
              | grep -F "$PACKAGE"

            adb shell am force-stop "$PACKAGE"

      - name: Tek normal APK'yı yükle
        uses: actions/upload-artifact@v7
        with:
          name: BilgiRotasi-AdMob-Tek-APK-V3-1.67.3-91
          path: |
            dist/BilgiRotasi-AdMob-Tek-APK-V3-1.67.3-91.apk
            reports/ADMOB_APK_MANIFEST.txt
            reports/ADMOB_SINGLE_APK_SHA256.txt
            reports/ADMOB_ANDROID_LAUNCH_LOG.txt
          if-no-files-found: error
          retention-days: 14
