name: AdMob izole test APK

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/admob-isolated-test-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-admob-test:
    name: Ayrı reklam test uygulaması
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Flutter kur
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.7"
          channel: stable
          cache: true

      - name: Reklamlı kaynak kopyasını hazırla
        shell: bash
        run: |
          set -euo pipefail

          TEST_DIR="$RUNNER_TEMP/bilgi_rotasi_admob_test"
          rm -rf "$TEST_DIR"

          # Ana dalı değiştirmeden, önceki reklam entegrasyonunu geçici alanda aç.
          git worktree add --detach "$TEST_DIR" \
            97bd29226c4d8eaa822f486a5913a43cd487890d

          cd "$TEST_DIR"

          python3 - <<'PY'
          from pathlib import Path
          import re
          import shutil

          pubspec_path = Path("pubspec.yaml")
          pubspec = pubspec_path.read_text(encoding="utf-8")

          # Çökmeye yol açan yerel manifest eklentisini kaldır.
          pubspec = re.sub(
              r"\n  bilgi_rotasi_admob_config:\n"
              r"    path: lib/admob_config_plugin\n",
              "\n",
              pubspec,
              count=1,
          )
          pubspec = pubspec.replace(
              "version: 1.67.0+88",
              "version: 1.67.2+90",
              1,
          )
          pubspec_path.write_text(pubspec, encoding="utf-8")

          shutil.rmtree("lib/admob_config_plugin", ignore_errors=True)

          main_path = Path("lib/main.dart")
          main = main_path.read_text(encoding="utf-8")

          # Reklam SDK'sı uygulama açılırken çalışmaz.
          main = main.replace(
              "\n  unawaited(AdMonetizationService.initialize());\n",
              "\n",
              1,
          )
          main_path.write_text(main, encoding="utf-8")

          info_path = Path("lib/app_build_info.dart")
          info = info_path.read_text(encoding="utf-8")
          info = info.replace(
              "static const String versionName = '1.67.0';",
              "static const String versionName = '1.67.2-test';",
              1,
          )
          info = info.replace(
              "static const int buildNumber = 88;",
              "static const int buildNumber = 90;",
              1,
          )
          info_path.write_text(info, encoding="utf-8")

          gate_path = Path("tools/rc1_quality_gate.py")
          gate = gate_path.read_text(encoding="utf-8")
          gate = gate.replace(
              'EXPECTED_VERSION = "1.67.0+88"',
              'EXPECTED_VERSION = "1.67.2+90"',
              1,
          )
          gate_path.write_text(gate, encoding="utf-8")

          required = [
              Path("lib/ad_monetization.dart"),
              Path("lib/main.dart"),
              Path("assets/questions.json"),
          ]
          missing = [str(path) for path in required if not path.exists()]
          if missing:
              raise SystemExit(
                  "Reklam test kaynakları eksik: " + ", ".join(missing)
              )

          if "google_mobile_ads" not in pubspec:
              raise SystemExit("google_mobile_ads bağımlılığı bulunamadı.")

          if "AdMonetizationService.initialize()" in main:
              raise SystemExit("Açılışta reklam başlatma satırı kaldı.")
          PY

          rm -f pubspec.lock
          flutter pub get

          dart format \
            lib/main.dart \
            lib/ad_monetization.dart \
            lib/app_build_info.dart

          flutter analyze \
            --no-fatal-warnings \
            --no-fatal-infos

          flutter test \
            --concurrency=1 \
            --reporter expanded

          python3 tools/rc1_quality_gate.py

      - name: Ayrı Android test uygulamasını oluştur
        shell: bash
        run: |
          set -euo pipefail

          TEST_DIR="$RUNNER_TEMP/bilgi_rotasi_admob_test"
          cd "$TEST_DIR"

          rm -rf .flutter_build

          flutter create \
            --platforms=android \
            --org com.leventua \
            --project-name bilgirotasi_adtest \
            .flutter_build

          rm -rf .flutter_build/lib
          cp -R lib .flutter_build/lib

          rm -rf .flutter_build/assets
          cp -R assets .flutter_build/assets

          cp pubspec.yaml .flutter_build/pubspec.yaml

          if [ -f analysis_options.yaml ]; then
            cp analysis_options.yaml \
              .flutter_build/analysis_options.yaml
          fi

          cp firebase/google-services.json \
            .flutter_build/android/app/google-services.json

          cd .flutter_build

          python3 - <<'PY'
          from pathlib import Path
          import re

          stable_package = "com.leventua.bilgirotasi"
          test_package = "com.leventua.bilgirotasi.adtest"
          test_admob_app_id = (
              "ca-app-pub-3940256099942544~3347511713"
          )

          # Firebase yapılandırmasını yalnız test APK'sı için ayrı paket adına uyarla.
          config_path = Path("android/app/google-services.json")
          config = config_path.read_text(encoding="utf-8")
          if stable_package not in config:
              raise SystemExit(
                  "Firebase yapılandırmasında ana paket bulunamadı."
              )
          config = config.replace(stable_package, test_package)
          config_path.write_text(config, encoding="utf-8")

          settings = Path("android/settings.gradle.kts")
          settings_text = settings.read_text(encoding="utf-8")
          plugin_line = (
              '    id("com.google.gms.google-services") '
              'version "4.5.0" apply false\n'
          )
          if "com.google.gms.google-services" not in settings_text:
              settings_text = settings_text.replace(
                  "plugins {\n",
                  "plugins {\n" + plugin_line,
                  1,
              )
          settings.write_text(settings_text, encoding="utf-8")

          app_gradle = Path("android/app/build.gradle.kts")
          app_text = app_gradle.read_text(encoding="utf-8")

          if "com.google.gms.google-services" not in app_text:
              app_text = app_text.replace(
                  "plugins {\n",
                  'plugins {\n'
                  '    id("com.google.gms.google-services")\n',
                  1,
              )

          app_text = app_text.replace(
              "minSdk = flutter.minSdkVersion",
              "minSdk = 23",
              1,
          )
          app_text = re.sub(
              r'namespace\s*=\s*"[^"]+"',
              f'namespace = "{test_package}"',
              app_text,
              count=1,
          )
          app_text = re.sub(
              r'applicationId\s*=\s*"[^"]+"',
              f'applicationId = "{test_package}"',
              app_text,
              count=1,
          )
          app_gradle.write_text(app_text, encoding="utf-8")

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )
          manifest_text = manifest.read_text(encoding="utf-8")

          if "android.permission.INTERNET" not in manifest_text:
              manifest_text = re.sub(
                  r"(<manifest\b[^>]*>)",
                  (
                      r'\1\n    <uses-permission '
                      r'android:name="android.permission.INTERNET" />'
                  ),
                  manifest_text,
                  count=1,
              )

          manifest_text = re.sub(
              r'android:label="[^"]*"',
              'android:label="Bilgi Rotası Reklam Testi"',
              manifest_text,
              count=1,
          )

          if "com.google.android.gms.ads.APPLICATION_ID" not in manifest_text:
              application_match = re.search(
                  r"<application\b[^>]*>",
                  manifest_text,
                  re.DOTALL,
              )
              if application_match is None:
                  raise SystemExit(
                      "Android application etiketi bulunamadı."
                  )

              metadata = (
                  "\n        <meta-data\n"
                  '            android:name='
                  '"com.google.android.gms.ads.APPLICATION_ID"\n'
                  f'            android:value="{test_admob_app_id}" />\n'
              )
              manifest_text = (
                  manifest_text[: application_match.end()]
                  + metadata
                  + manifest_text[application_match.end() :]
              )

          manifest.write_text(manifest_text, encoding="utf-8")

          required_gradle = [
              f'namespace = "{test_package}"',
              f'applicationId = "{test_package}"',
              "minSdk = 23",
              "com.google.gms.google-services",
          ]
          missing_gradle = [
              item for item in required_gradle
              if item not in app_text
          ]
          if missing_gradle:
              raise SystemExit(
                  "Test Gradle kurulumu eksik: "
                  + ", ".join(missing_gradle)
              )

          required_manifest = [
              "Bilgi Rotası Reklam Testi",
              "com.google.android.gms.ads.APPLICATION_ID",
              test_admob_app_id,
              "android.permission.INTERNET",
          ]
          missing_manifest = [
              item for item in required_manifest
              if item not in manifest_text
          ]
          if missing_manifest:
              raise SystemExit(
                  "Test manifest kurulumu eksik: "
                  + ", ".join(missing_manifest)
              )
          PY

      - name: İzole test APK'sını üret
        shell: bash
        run: |
          set -euo pipefail

          TEST_DIR="$RUNNER_TEMP/bilgi_rotasi_admob_test"
          cd "$TEST_DIR/.flutter_build"

          flutter pub get
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create
          flutter build apk --release

          SOURCE_APK="build/app/outputs/flutter-apk/app-release.apk"
          test -f "$SOURCE_APK"

          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$SOURCE_APK" \
            "$GITHUB_WORKSPACE/dist/BilgiRotasi-AdMob-Izole-Test.apk"

      - name: Test APK paketini yükle
        uses: actions/upload-artifact@v7
        with:
          name: BilgiRotasi-AdMob-Izole-Test
          path: dist/BilgiRotasi-AdMob-Izole-Test.apk
          if-no-files-found: error
          retention-days: 14
