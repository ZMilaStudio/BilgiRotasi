name: Closed test release çekirdeği

on:
  workflow_call:
    inputs:
      confirmation:
        required: true
        type: string
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: true
      ANDROID_KEYSTORE_PASSWORD:
        required: true
      ANDROID_KEY_ALIAS:
        required: true
      ANDROID_KEY_PASSWORD:
        required: true

permissions:
  contents: read

concurrency:
  group: closed-test-release
  cancel-in-progress: false

jobs:
  closed-test-release:
    name: İmzalı AAB ve Android 16 doğrulaması
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      ORG_GRADLE_PROJECT_ADMOB_ENVIRONMENT: closed_test
      EXPECTED_SHA1: 000EE43F410ABC6B4F634C4F716D76EB19084115

    steps:
      - name: Kapalı test onayını doğrula
        shell: bash
        env:
          CLOSED_TEST_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$CLOSED_TEST_CONFIRMATION" = "CLOSED_TEST"

      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Flutter kur
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.6"
          channel: stable
          cache: true

      - name: Sürümü pubspec.yaml dosyasından oku
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -nE 's/^version:[[:space:]]*([^[:space:]]+).*$/\1/p' pubspec.yaml)"
          test -n "$VERSION"
          VERSION_NAME="${VERSION%%+*}"
          VERSION_CODE="${VERSION##*+}"
          test "$VERSION_NAME" != "$VERSION"
          [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$VERSION_CODE" =~ ^[0-9]+$ ]]
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_LABEL=${VERSION_NAME}-${VERSION_CODE}" >> "$GITHUB_ENV"
          echo "AAB_FILE=BilgiRotasi-${VERSION_NAME}-${VERSION_CODE}-closed-test.aab" >> "$GITHUB_ENV"

      - name: Production Firebase ve OAuth yapılandırmasını doğrula
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          android_config = json.loads(Path('android/app/google-services.json').read_text())
          firebase_config = json.loads(Path('firebase/google-services.json').read_text())
          assert android_config == firebase_config
          config = android_config
          assert config['project_info']['project_id'] == 'bilgi-rotasi-f255d'
          clients = config['client']
          assert any(
              item['client_info']['android_client_info']['package_name']
              == 'com.leventua.bilgirotasi'
              for item in clients
          )
          oauth = [entry for item in clients for entry in item.get('oauth_client', [])]
          expected_web_client_id = (
              '184174765052-cq19m113aum2jofrfj3np8adbulgmeon'
              '.apps.googleusercontent.com'
          )
          expected_android_client_ids = {
              '184174765052-tug3r8maeh0bvvvjibjtiogifrmummiq.apps.googleusercontent.com',
              '184174765052-8vma0frp2jqlf3iqui7hm7qlilluklgo.apps.googleusercontent.com',
          }
          for expected_hash in (
              '000ee43f410abc6b4f634c4f716d76eb19084115',
              '263c46c6ae9f27c3b33810fa898cd7eb9373ccf4',
          ):
              assert any(
                  entry.get('client_type') == 1
                  and entry.get('android_info', {}).get('package_name')
                  == 'com.leventua.bilgirotasi'
                  and entry.get('android_info', {}).get(
                      'certificate_hash',
                      '',
                  ).lower() == expected_hash
                  for entry in oauth
              ), f'Missing Android OAuth client for certificate {expected_hash}'
          android_client_ids = {
              entry['client_id']
              for entry in oauth
              if entry.get('client_type') == 1
          }
          assert expected_android_client_ids <= android_client_ids
          web_client_ids = [
              entry['client_id']
              for entry in oauth
              if entry.get('client_type') == 3
          ]
          assert web_client_ids == [expected_web_client_id]

          account_source = Path('lib/account_cloud.dart').read_text()
          constant_match = re.search(
              r"static const String _googleServerClientId\s*=\s*((?:'[^']*'\s*)+);",
              account_source,
          )
          assert constant_match, 'Google server client ID constant is missing'
          dart_server_client_id = ''.join(
              re.findall(r"'([^']*)'", constant_match.group(1))
          )
          assert dart_server_client_id == expected_web_client_id
          assert re.search(
              r'initialize\(\s*serverClientId:\s*_googleServerClientId,?\s*\)',
              account_source,
          ), 'GoogleSignIn.initialize must use the server client ID'
          assert dart_server_client_id not in android_client_ids
          for android_client_id in expected_android_client_ids:
              assert f"serverClientId: '{android_client_id}'" not in account_source
              assert f'serverClientId: "{android_client_id}"' not in account_source
          PY
          ! grep -Fq 'bilgirotasi-dev' android/app/google-services.json firebase/google-services.json

      - name: Bağımlılıkları ve kalite kapılarını çalıştır
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports dist
          flutter pub get
          flutter pub deps --style=compact \
            | tee reports/DEPENDENCY_GRAPH.txt
          flutter analyze --no-fatal-warnings --no-fatal-infos \
            | tee reports/ANALYZE_RESULTS.txt
          flutter test --concurrency=1 --reporter expanded \
            | tee reports/FLUTTER_TEST_RESULTS.txt
          flutter test \
            --dart-define=ADMOB_ENVIRONMENT=closed_test \
            test/admob_id_profile_test.dart \
            | tee reports/CLOSED_TEST_AD_PROFILE.txt
          flutter test \
            --dart-define=ADMOB_ENVIRONMENT=production \
            test/admob_id_profile_test.dart \
            | tee reports/PRODUCTION_AD_PROFILE.txt
          flutter test \
            --dart-define=FIREBASE_ENVIRONMENT=production \
            --dart-define=EXPECT_FIREBASE_PRODUCTION=true \
            test/firebase_production_profile_test.dart \
            | tee reports/PRODUCTION_FIREBASE_PROFILE.txt
          python3 tools/rc1_quality_gate.py \
            --report reports/RC1_QUALITY_GATE.md
          git diff --check

          (
            cd functions
            npm ci
            npm test
            npm run test:rules
          ) | tee reports/FIREBASE_TEST_RESULTS.txt

          {
            echo "Flutter analyze: PASS"
            echo "Flutter tests: PASS"
            echo "Question bank and asset gates: PASS"
            echo "Cloud Functions tests: PASS"
            echo "Firestore Rules emulator tests: PASS"
            echo "Closed-test AdMob profile: PASS (Google demo IDs)"
            echo "Production AdMob profile preserved: PASS"
            echo "Production Firebase profile: PASS"
            echo "git diff --check: PASS"
          } > reports/TEST_RESULTS.txt

      - name: Kalıcı Android imzasını hazırla
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode \
            > android/app/bilgi_rotasi_upload.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=bilgi_rotasi_upload.jks
          EOF
          chmod 600 android/key.properties android/app/bilgi_rotasi_upload.jks
          test -s android/key.properties
          test -s android/app/bilgi_rotasi_upload.jks

      - name: Production Firebase ve kapalı-test reklam profilli AAB üret
        shell: bash
        run: |
          set -euo pipefail
          flutter build appbundle --release \
            --dart-define=ADMOB_ENVIRONMENT=closed_test \
            --dart-define=FIREBASE_ENVIRONMENT=production
          cp build/app/outputs/bundle/release/app-release.aab \
            "dist/$AAB_FILE"

      - name: Bundletool kur ve AAB'den APK seti üret
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KS_PASS_FILE="$RUNNER_TEMP/bundletool-keystore.pass"
          KEY_PASS_FILE="$RUNNER_TEMP/bundletool-key.pass"
          trap 'rm -f "$KS_PASS_FILE" "$KEY_PASS_FILE"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_PASSWORD" > "$KS_PASS_FILE"
          printf '%s' "$ANDROID_KEY_PASSWORD" > "$KEY_PASS_FILE"
          chmod 600 "$KS_PASS_FILE" "$KEY_PASS_FILE"
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/bundletool.jar" \
            "https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar"
          java -jar "$RUNNER_TEMP/bundletool.jar" version
          java -jar "$RUNNER_TEMP/bundletool.jar" build-apks \
            --bundle="dist/$AAB_FILE" \
            --output="dist/BilgiRotasi-${VERSION_LABEL}-closed-test.apks" \
            --mode=universal \
            --ks=android/app/bilgi_rotasi_upload.jks \
            --ks-key-alias="$ANDROID_KEY_ALIAS" \
            --ks-pass="file:$KS_PASS_FILE" \
            --key-pass="file:$KEY_PASS_FILE"
          unzip -p "dist/BilgiRotasi-${VERSION_LABEL}-closed-test.apks" \
            universal.apk \
            > "dist/BilgiRotasi-${VERSION_LABEL}-closed-test-universal.apk"
          test -s "dist/BilgiRotasi-${VERSION_LABEL}-closed-test-universal.apk"

      - name: AAB metadata, Firebase, reklam ve imzayı doğrula
        shell: bash
        run: |
          set -euo pipefail
          APK="dist/BilgiRotasi-${VERSION_LABEL}-closed-test-universal.apk"
          AAB="dist/$AAB_FILE"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          AAPT2="$(find "$SDK_ROOT/build-tools" -type f -name aapt2 | sort -V | tail -n 1)"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$AAPT2"
          test -x "$APKSIGNER"

          "$AAPT2" dump badging "$APK" \
            | tee reports/APK_BADGING.txt
          java -jar "$RUNNER_TEMP/bundletool.jar" dump manifest --bundle="$AAB" \
            | tee reports/AAB_MANIFEST.xml
          {
            echo "AAB file: $AAB_FILE"
            echo "Derived APK badging:"
            cat reports/APK_BADGING.txt
            echo "AAB manifest:"
            cat reports/AAB_MANIFEST.xml
          } > reports/AAB_BADGING.txt

          grep -Fq "package: name='com.leventua.bilgirotasi'" reports/APK_BADGING.txt
          grep -Fq "versionCode='$VERSION_CODE'" reports/APK_BADGING.txt
          grep -Fq "versionName='$VERSION_NAME'" reports/APK_BADGING.txt
          grep -Fq 'package="com.leventua.bilgirotasi"' reports/AAB_MANIFEST.xml
          grep -Fq "android:versionCode=\"$VERSION_CODE\"" reports/AAB_MANIFEST.xml
          grep -Fq "android:versionName=\"$VERSION_NAME\"" reports/AAB_MANIFEST.xml
          ! grep -Fq 'android:debuggable="true"' reports/AAB_MANIFEST.xml

          "$AAPT2" dump xmltree --file AndroidManifest.xml "$APK" \
            | tee reports/APK_MANIFEST.txt
          grep -Fq 'ca-app-pub-3940256099942544~3347511713' reports/APK_MANIFEST.txt
          ! grep -Fq 'ca-app-pub-7452194004008791~7046504043' reports/APK_MANIFEST.txt
          grep -Fq 'ca-app-pub-3940256099942544~3347511713' reports/AAB_MANIFEST.xml
          ! grep -Fq 'ca-app-pub-7452194004008791~7046504043' reports/AAB_MANIFEST.xml
          ! grep -Eq 'android:debuggable.*0xffffffff' reports/APK_MANIFEST.txt

          "$AAPT2" dump resources "$APK" | tee reports/APK_RESOURCES.txt
          grep -Fq 'bilgi-rotasi-f255d' reports/APK_RESOURCES.txt
          ! grep -Fq 'bilgirotasi-dev' reports/APK_RESOURCES.txt

          APK_CERT="$($APKSIGNER verify --print-certs "$APK")"
          printf '%s\n' "$APK_CERT" > reports/APK_CERTIFICATE.txt
          APK_SHA1="$(printf '%s\n' "$APK_CERT" | awk -F': ' '/certificate SHA-1 digest/ {print $NF; exit}' | tr '[:lower:]' '[:upper:]' | tr -d '[:space:]:')"
          jarsigner -verify "$AAB"
          keytool -printcert -jarfile "$AAB" | tee reports/AAB_CERTIFICATE.txt
          AAB_SHA1="$(awk -F': ' '/SHA1:/ {print $2; exit}' reports/AAB_CERTIFICATE.txt | tr '[:lower:]' '[:upper:]' | tr -d '[:space:]:')"
          test "$APK_SHA1" = "$EXPECTED_SHA1"
          test "$AAB_SHA1" = "$EXPECTED_SHA1"

          unzip -l "$AAB" | tee reports/AAB_CONTENTS.txt
          ! grep -Eqi '\.(jks|keystore)|key\.properties|service.?account|google-services\.json|private.?key' reports/AAB_CONTENTS.txt
          ! unzip -p "$AAB" | strings | grep -Eqi 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|"private_key"[[:space:]]*:'

          sha256sum "$AAB" | tee reports/AAB_SHA256.txt
          {
            echo "AdMob profile: closed_test"
            echo "Manifest App ID: ca-app-pub-3940256099942544~3347511713"
            echo "Banner ID: ca-app-pub-3940256099942544/6300978111"
            echo "Rewarded ID: ca-app-pub-3940256099942544/5224354917"
            echo "Firebase profile: production"
            echo "Firebase project: bilgi-rotasi-f255d"
            echo "Production AdMob IDs remain available only under ADMOB_ENVIRONMENT=production."
          } > reports/CLOSED_TEST_CONFIGURATION.txt

          (cd android && ./gradlew app:dependencies --configuration releaseRuntimeClasspath) \
            | tee -a reports/DEPENDENCY_GRAPH.txt

      - name: Ekran OCR doğrulama aracını hazırla
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v tesseract >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends tesseract-ocr
          fi
          tesseract --version

      - name: Android emulator KVM erişimini hazırla
        shell: bash
        run: |
          set -euo pipefail
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm

      - name: Android 16 AAB-derived cold-start ve kritik akışlar (deneme 1/2)
        id: android16_attempt_1
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 4
          ram-size: 4096M
          heap-size: 768M
          emulator-boot-timeout: 1200
          disable-animations: false
          script: |
            timeout 1200 bash tools/validate_android16_closed_test.sh

      - name: İlk Android 16 denemesini sınıflandır
        id: android16_retry
        if: always()
        shell: bash
        env:
          FIRST_ATTEMPT_OUTCOME: ${{ steps.android16_attempt_1.outcome }}
        run: |
          set -euo pipefail
          if [ "$FIRST_ATTEMPT_OUTCOME" = "success" ]; then
            echo "retry=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if grep -Fqx 'REASON=APPLICATION_CRASH_ANR_FATAL_OR_PROCESS_DEATH' \
              reports/ANDROID16_VALIDATION_RESULT.txt 2>/dev/null; then
            echo "Application failure cannot be retried as emulator infrastructure." >&2
            exit 1
          fi
          if ! grep -Fxq 'EMULATOR_HEALTH=UNHEALTHY' \
              reports/ANDROID16_EMULATOR_HEALTH.txt 2>/dev/null \
              || ! grep -Fxq 'RESULT=INFRASTRUCTURE_RETRY_REQUIRED' \
                reports/ANDROID16_VALIDATION_RESULT.txt 2>/dev/null \
              || ! grep -Fxq 'RELEASE_GATE=FAIL' \
                reports/ANDROID16_VALIDATION_RESULT.txt 2>/dev/null \
              || ! grep -Fxq 'REASON=EMULATOR_INFRASTRUCTURE_UNHEALTHY' \
                reports/ANDROID16_VALIDATION_RESULT.txt 2>/dev/null; then
            echo "The first Android 16 attempt failed without an explicit emulator health signal." >&2
            test ! -s reports/ANDROID16_VALIDATION_RESULT.txt \
              || cat reports/ANDROID16_VALIDATION_RESULT.txt >&2
            exit 1
          fi

          attempt_dir="reports/android16-attempt-1"
          mkdir -p "$attempt_dir"
          find reports -maxdepth 1 -type f \
            \( -name 'UI_*' \
              -o -name 'COLD_START_LOGCAT.txt' \
              -o -name 'APP_GATE_LOGCAT.txt' \
              -o -name 'ACTIVITY_STATE.txt' \
              -o -name 'APP_PID.txt' \
              -o -name '*ANR_DISMISSED.txt' \
              -o -name 'ANDROID16_APP_GATE.txt' \
              -o -name 'ANDROID16_VALIDATION_RESULT.txt' \
              -o -name 'ANDROID16_EMULATOR_HEALTH.txt' \
              -o -name 'INFRASTRUCTURE_DIAGNOSTICS.txt' \
              -o -name 'SCREEN_CAPTURE_FAILURES.txt' \) \
            -exec cp {} "$attempt_dir/" \;
          echo "retry=true" >> "$GITHUB_OUTPUT"

      - name: Android 16 AAB-derived cold-start ve kritik akışlar (temiz deneme 2/2)
        id: android16_attempt_2
        if: steps.android16_retry.outputs.retry == 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 4096M
          heap-size: 768M
          emulator-boot-timeout: 1200
          disable-animations: false
          script: |
            timeout 1200 bash tools/validate_android16_closed_test.sh

      - name: Android 16 zorunlu uygulama kapısını sonuçlandır
        if: always()
        shell: bash
        env:
          FIRST_ATTEMPT_OUTCOME: ${{ steps.android16_attempt_1.outcome }}
          RETRY_REQUIRED: ${{ steps.android16_retry.outputs.retry }}
          SECOND_ATTEMPT_OUTCOME: ${{ steps.android16_attempt_2.outcome }}
        run: |
          set -euo pipefail
          if [ "$RETRY_REQUIRED" = "true" ]; then
            test "$SECOND_ATTEMPT_OUTCOME" = "success"
          else
            test "$FIRST_ATTEMPT_OUTCOME" = "success"
          fi
          for required_gate in \
            APK_INSTALL=PASS \
            APP_LAUNCH=PASS \
            GUEST_LOGIN=PASS \
            HOME_OYNA=PASS \
            APP_PID=PASS \
            APP_LOGCAT=PASS \
            APP_GATE=PASS; do
            grep -Fxq "$required_gate" reports/ANDROID16_APP_GATE.txt
          done
          grep -Fxq 'RELEASE_GATE=PASS' reports/ANDROID16_VALIDATION_RESULT.txt
          grep -Fxq 'APP_GATE=PASS' reports/ANDROID16_VALIDATION_RESULT.txt
          ! grep -Fqx 'REASON=APPLICATION_CRASH_ANR_FATAL_OR_PROCESS_DEATH' \
            reports/ANDROID16_VALIDATION_RESULT.txt

      - name: Yayın hazırlık raporunu tamamla
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cp RELEASE_READINESS.md reports/RELEASE_READINESS.md
          {
            echo
            echo "## GitHub Actions build sonucu"
            echo
            echo "- Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "- AAB: $AAB_FILE"
            echo "- Package: com.leventua.bilgirotasi"
            echo "- Version: $VERSION_NAME+$VERSION_CODE"
            echo "- Certificate SHA-1: 00:0E:E4:3F:41:0A:BC:6B:4F:63:4C:4F:71:6D:76:EB:19:08:41:15"
            echo "- Firebase: production / bilgi-rotasi-f255d"
            echo "- AdMob: closed_test / Google demo ad units"
          } >> reports/RELEASE_READINESS.md
          if test -s reports/ANDROID16_VALIDATION_RESULT.txt; then
            {
              echo
              echo "### Android 16 uygulama kapısı ve altyapı tanısı"
              echo
              cat reports/ANDROID16_VALIDATION_RESULT.txt
            } >> reports/RELEASE_READINESS.md
          fi

      - name: AAB ve doğrulama kanıtlarını yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BilgiRotasi-${{ env.VERSION_LABEL }}-closed-test-release
          path: |
            dist/${{ env.AAB_FILE }}
            reports/AAB_CERTIFICATE.txt
            reports/AAB_BADGING.txt
            reports/TEST_RESULTS.txt
            reports/COLD_START_LOGCAT.txt
            reports/APP_GATE_LOGCAT.txt
            reports/RELEASE_READINESS.md
            reports/DEPENDENCY_GRAPH.txt
            reports/CLOSED_TEST_CONFIGURATION.txt
            reports/RC1_QUALITY_GATE.md
            reports/AAB_SHA256.txt
            reports/AAB_MANIFEST.xml
            reports/AAB_CONTENTS.txt
            reports/UI_*
            reports/ACTIVITY_STATE.txt
            reports/APP_PID.txt
            reports/*ANR_DISMISSED.txt
            reports/ANDROID16_APP_GATE.txt
            reports/ANDROID16_VALIDATION_RESULT.txt
            reports/INFRASTRUCTURE_DIAGNOSTICS.txt
            reports/SCREEN_CAPTURE_FAILURES.txt
            reports/android16-attempt-1/**
          if-no-files-found: warn
          retention-days: 30

      - name: Geçici imza dosyalarını temizle
        if: always()
        shell: bash
        run: |
          rm -f android/key.properties android/app/bilgi_rotasi_upload.jks
